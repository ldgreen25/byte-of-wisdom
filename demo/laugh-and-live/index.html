    const rn=Object.keys(S.roles);
    body=`<p class="small muted" style="margin:0 0 12px;max-width:70ch">Check the trainings each role must complete. Employees see only their role's trainings, and the status board and inspection record follow the same rules. Changes apply right away.</p>
     <div class="tablewrap"><table class="roles"><thead><tr><th>Training</th>${rn.map(r=>`<th style="text-align:center">${esc(r)}<span style="display:block;text-transform:none;letter-spacing:0;font-weight:500;margin-top:3px">${S.staff.filter(x=>x.role===r).length} staff</span></th>`).join("")}</tr></thead><tbody>
     ${COURSES.map(c=>`<tr><td><b>${esc(c.short)}</b></td>${rn.map(r=>`<td style="text-align:center"><input type="checkbox" data-rc="${esc(r)}|${c.id}" aria-label="${esc(c.short)} required for ${esc(r)}" ${S.roles[r].includes(c.id)?"checked":""} style="width:18px;height:18px;accent-color:var(--accent)"></td>`).join("")}</tr>`).join("")}
     <tr><td class="muted small">Total required</td>${rn.map(r=>`<td style="text-align:center" class="mono">${S.roles[r].length}</td>`).join("")}</tr>
     </tbody></table></div>`;
  } else if(tab==="courses"){
    body=`<div class="cat">${COURSES.map(c=>`<div class="card">${thumb(c,"cimg")}<div><h3>${esc(c.title)}</h3>
      <p class="small muted" style="margin:6px 0 0">${c.reg?esc(c.reg)+" · ":""}${c.slides?c.slides+" slides":"Slides needed"} · Required for ${Object.keys(S.roles).filter(r=>S.roles[r].includes(c.id)).length} of ${Object.keys(S.roles).length} roles · ${c.minutes} min required · ${c.qs.length} questions (${c.total} pts) · 80% to pass · renew yearly</p></div></div>`).join("")}</div>
      <p class="small muted" style="margin:14px 0 0">Courses are built from Laugh &amp; Live's own training slides and tests.</p>`;
  } else {
    body=S.mail.length?`<div class="log">${S.mail.map(m=>`<div><b>${esc(m.subject)}</b> <span class="muted small">· ${esc(m.when)}</span><br>To <span class="mono">${esc(m.to)}</span> · Copy <span class="mono">${esc(m.cc)}</span><br><span class="muted">${esc(m.body)}</span></div>`).join("")}</div>`
      :`<div class="panel" style="margin-top:0"><p style="margin:0">No certificate emails yet. Pass a test as an employee and the email appears here, addressed to the employee with a copy to <span class="mono">${AGENCY_EMAIL}</span>.</p></div>`;
  }
  app.innerHTML=`<div class="section-head"><h1>Training administration</h1><span class="small muted">As of ${fmt(iso(today))}</span></div>${tiles}${tabs}${body}`;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go({name:"admin",tab:b.dataset.tab,sid:view.sid}));
  app.querySelectorAll("[data-sendans]").forEach(b=>b.onclick=()=>{const cid=b.dataset.sendans,sid=view.sid||S.staff[0].id,rr=S.rec[sid+"|"+cid];
    const ta=app.querySelector(`[data-ans="${cid}"]`);const a=ta.value.trim();if(!a){ta.focus();toast("Type your answer first");return}
    rr.question.a=a;const x=staffOf(sid);
    S.mail.unshift({when:new Date().toLocaleString("en-US"),to:x.email,cc:"—",subject:`Answer to your question: ${COURSES.find(c=>c.id===cid).title}`,body:`${a} You can now sign off and get your certificate.`});
    save();toast(`Answer sent. ${x.name} can now sign off.`);render()});
  app.querySelectorAll("[data-unlock]").forEach(b=>b.onclick=()=>{S.rec[b.dataset.unlock].attempts=[];save();toast("Attempts reset. The employee can retake the test.");render()});
  app.querySelectorAll("[data-rc]").forEach(b=>b.onchange=()=>{const i=b.dataset.rc.lastIndexOf("|");const r=b.dataset.rc.slice(0,i),cid=b.dataset.rc.slice(i+1);const set=S.roles[r];
    if(b.checked){if(!set.includes(cid))set.push(cid);let n=0;S.staff.filter(x=>x.role===r).forEach(x=>{const rc=S.rec[x.id+"|"+cid];if(!rc.cert&&!rc.watched&&!rc.attempts.length){rc.assigned=iso(today);const hd=new Date(x.hire+"T00:00:00");rc.due=(today-hd)/864e5<60?iso(addBiz(hd,15)):iso(addDays(today,30))}n++});
      toast(`${COURSES.find(c=>c.id===cid).short} is now required for ${r}${n?` (${n} staff)`:""}`)}
    else{S.roles[r]=set.filter(x=>x!==cid);toast(`${COURSES.find(c=>c.id===cid).short} is no longer required for ${r}`)}
    S.roles[r].sort((a,b)=>COURSES.findIndex(c=>c.id===a)-COURSES.findIndex(c=>c.id===b));save();render()});
  const chrole=document.getElementById("chrole");if(chrole)chrole.onchange=()=>{const x=staffOf(view.sid||S.staff[0].id);x.role=chrole.value;
    reqCourses(x).forEach(c=>{const rc=S.rec[x.id+"|"+c.id];if(!rc.cert&&!rc.watched&&!rc.attempts.length&&rc.due<iso(today)){rc.assigned=iso(today);rc.due=iso(addDays(today,30))}});
    save();toast(`${x.name} is now ${x.role}: ${reqCourses(x).length} required trainings`);render()};
  app.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>go({name:"admin",tab:"person",sid:b.dataset.rec}));
  const addf=document.getElementById("addf");
  if(addf)addf.onsubmit=e=>{e.preventDefault();const fd=new FormData(addf);const err=document.getElementById("adderr");
    const name=String(fd.get("name")||"").trim(),email=String(fd.get("email")||"").trim(),hire=String(fd.get("hire")||"");
    const bad=!name?"Enter the employee's name.":(!hire?"Enter a hire date.":(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)?"Check the email address.":""));
    if(bad){err.textContent=bad;err.hidden=false;return}
    const id="e"+Date.now().toString(36);const hd=new Date(hire+"T00:00:00");const recent=(today-hd)/864e5<60;
    S.staff.push({id,name,role:String(fd.get("role")),email,hire});
    COURSES.forEach(c=>{S.rec[id+"|"+c.id]={assigned:iso(today),due:recent?iso(addBiz(hd,15)):iso(addDays(today,30)),watched:0,attempts:[],cert:null}});
    save();toast(`${name} added and assigned ${reqIds({role:String(fd.get("role"))}).length} trainings`);go({name:"admin",tab:"staff"})};
  const pick=document.getElementById("pick");if(pick)pick.onchange=()=>go({name:"admin",tab:"person",sid:pick.value});
  app.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go({name:"cert",cid:b.dataset.view,sid:view.sid||S.staff[0].id}));
}

fillWho();render();
})();
</script>
</body></html>
