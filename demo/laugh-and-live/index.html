<meta name="robots" content="noindex, nofollow">

<style>
/* Layout: one app shell — top bar with role switch, then a single working view (list → course → test → certificate, or admin board). */
:root{
  --bg:#f6f4f7; --surface:#ffffff; --sunk:#efebf2; --ink:#221d27; --muted:#675f6e; --line:#e2dce7;
  --accent:#6b3f7a; --accent-ink:#ffffff; --accent-soft:#efe4f3;
  --good:#2c7a57; --good-soft:#e2f2ea; --warn:#9a6210; --warn-soft:#fbefd9; --bad:#b03636; --bad-soft:#f8e1e1; --idle:#5d6670; --idle-soft:#eceff2;
  --screen:#1d1922; --screen-ink:#f3eef6;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16131a; --surface:#201c25; --sunk:#1a171e; --ink:#eeeaf2; --muted:#a69daf; --line:#352f3c;
  --accent:#c99be0; --accent-ink:#1b1220; --accent-soft:#33263b;
  --good:#6cc89d; --good-soft:#1e3329; --warn:#e3aa52; --warn-soft:#3a2d17; --bad:#f08484; --bad-soft:#3d2121; --idle:#a8b1ba; --idle-soft:#2a2e33;
  --screen:#0e0c11; --screen-ink:#f3eef6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16131a; --surface:#201c25; --sunk:#1a171e; --ink:#eeeaf2; --muted:#a69daf; --line:#352f3c;
  --accent:#c99be0; --accent-ink:#1b1220; --accent-soft:#33263b;
  --good:#6cc89d; --good-soft:#1e3329; --warn:#e3aa52; --warn-soft:#3a2d17; --bad:#f08484; --bad-soft:#3d2121; --idle:#a8b1ba; --idle-soft:#2a2e33;
  --screen:#0e0c11; --screen-ink:#f3eef6; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.01em}
.brand span{font-size:.8rem;color:var(--muted);font-style:italic}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;max-width:100%}
.demo-note{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.86rem;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.demo{border-style:dashed;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-good{background:var(--good-soft);color:var(--good)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)} .c-idle{background:var(--idle-soft);color:var(--idle)}
.c-acc{background:var(--accent-soft);color:var(--accent)}

/* staff list */
.section-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.list{display:grid;gap:10px}
.course{display:grid;grid-template-columns:120px 1fr auto;gap:8px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 12px}
.course .thumb{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.course .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.course > div{min-width:0}
@media (max-width:640px){.course{grid-template-columns:1fr}.course .thumb{width:100%}}

/* player */
.back{margin-bottom:14px}
.player{background:var(--screen);color:var(--screen-ink);border-radius:14px;overflow:hidden}
.frame{position:relative;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}
.frame img{width:100%;height:100%;object-fit:contain;display:block}
.frame .k{position:absolute;left:12px;top:12px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;padding:3px 8px;border-radius:6px}
.bar{display:flex;gap:12px;align-items:center;padding:12px 16px;background:rgba(255,255,255,.06)}
.bar .play{width:40px;height:40px;border-radius:50%;border:0;background:var(--screen-ink);color:var(--screen);font-weight:700;flex:none}
.track{position:relative;flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.14);cursor:pointer;min-width:0}
.track .seen{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.28);border-radius:6px}
.track .pos{position:absolute;inset:0 auto 0 0;background:#d7b4ea;border-radius:6px}
.bar .t{font-family:var(--f-mono);font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.watch{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}

/* quiz */
.q{border-top:1px solid var(--line);padding-block:14px}
.q:first-of-type{border-top:0}
.q legend{font-weight:600;margin-bottom:8px;padding:0}
.q .pts{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:6px}
.sec{font-family:var(--f-display);font-size:1rem;margin:18px 0 2px;padding-top:12px;border-top:2px solid var(--line)}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
fieldset{border:0;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--sunk)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.result{border-radius:12px;padding:16px 18px;margin-top:16px}
.result.pass{background:var(--good-soft)} .result.fail{background:var(--bad-soft)}

/* certificate */
.cert{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
.cert-in{border:2px solid var(--accent);border-radius:4px;padding:clamp(20px,5vw,44px);text-align:center;display:grid;gap:10px}
.cert-in .eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cert-in .name{font-family:var(--f-display);font-size:clamp(1.6rem,5vw,2.3rem);color:var(--accent)}
.cert-in .course-t{font-family:var(--f-display);font-size:1.2rem}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px;text-align:left}
.cert-grid div{border-top:1px solid var(--line);padding-top:6px}
.cert-grid span{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mail{font-size:.86rem;background:var(--sunk);border-radius:10px;padding:12px 14px;margin-top:14px}

/* admin */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.tile b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1.1}
.tile span{font-size:.82rem;color:var(--muted)}
.tile.alert{border-color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.88rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:.76rem;color:var(--muted);margin-top:3px}
table.board{min-width:1180px}
table.board th:first-child,table.board td:first-child{position:sticky;left:0;z-index:1;min-width:180px;background:var(--surface);box-shadow:1px 0 0 var(--line)}
table.board th:first-child{background:var(--sunk)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.86rem;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.log{display:grid;gap:8px}
.log div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.86rem}
.cat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cat .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cat .card .cimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;text-align:center;padding:6px;line-height:1.15}
.course .ph{font-size:.8rem}
.noslides{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:linear-gradient(135deg,#3a2546,#1d1922)}
.noslides b{font-family:var(--f-display);font-size:clamp(1.3rem,4vw,2rem)}
.noslides span{opacity:.8;max-width:44ch}
.vlink{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#c4302b;color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap}
.cat .card div{padding:12px 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.form label{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
.form input,.form select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:.95rem;color:var(--ink);width:100%}
.err{color:var(--bad);font-size:.85rem;margin:8px 0 0}
.foot{margin-top:36px;font-size:.78rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.track .pos{transition:width .2s linear}}
</style></head><body>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>Laugh &amp; Live, LLC · Training</b><span>Laugh everyday, Love beyond words</span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="View as">
        <button id="role-staff" aria-pressed="true">Employee</button>
        <button id="role-admin" aria-pressed="false">Administrator</button>
      </div>
      <label class="small muted" for="who">Signed in as</label>
      <select id="who"></select>
    </div>
  </header>
  <div class="demo-note">
    <span><b>Demo.</b> Real Laugh &amp; Live courses with sample staff. Lesson time runs at demo speed (1 second = 1 minute), and "Skip to end" is for demos only. No real emails are sent.</span>
    <button class="linkbtn" id="reset">Reset demo data</button>
  </div>
  <main id="app"></main>
  <p class="foot">Powered by Byte of Wisdom</p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const AGENCY_EMAIL="laughandlivellc@gmail.com";
const PASS=0.8, MAX_ATTEMPTS=3;
const TF=["True","False"];
// Each question: q text, o options, a correct index, p points, s section, fixed = keep option order
const COURSES=[
 {id:"hr",title:"Human Rights",minutes:30,orientation:true,deck:null,slides:0,
  sections:["Multiple choice","True or false","Scenarios"],
  qs:[
  {s:0,q:"Individuals receiving DD services maintain:",o:["Only limited legal rights","Rights determined by staff","All rights granted to any citizen","Rights only during service hours"],a:2},
  {s:0,q:"Self-determination means:",o:["Staff make decisions for the individual","Individuals have the right to make choices about their own lives","Only family members make decisions","Goals are selected by providers only"],a:1},
  {s:0,q:"Person-centered services are designed around:",o:["Staff schedules and convenience","Provider preferences","The individual's unique needs, preferences, and goals","State inspections only"],a:2},
  {s:0,q:"Which of the following demonstrates dignity and respect?",o:["Speaking about the individual instead of to them","Using labels to describe individuals","Honoring personal choices and preferences","Entering personal spaces without knocking"],a:2},
  {s:0,q:"Personal records and health information:",o:["May be shared freely among staff","Are confidential and require proper consent or legal authority to share","Can be discussed in public settings","Do not require privacy protection"],a:1},
  {s:0,q:"Which of the following is considered neglect?",o:["Respecting individual choices","Failing to provide necessary care or supervision","Encouraging independence","Supporting self-determination"],a:1},
  {s:0,q:"At Laugh & Live, LLC, staff who suspect abuse, neglect, or exploitation must:",o:["Wait for proof before acting","Report it immediately","Discuss it only with coworkers","Ignore minor concerns"],a:1},
  {s:0,q:"Individuals have the right to:",o:["Be denied complaint assistance","File complaints without retaliation","Avoid all service planning","Have complaints ignored"],a:1},
  {s:0,q:"Which role does the Human Rights Advocate perform?",o:["Approving payroll records","Investigating rights complaints and protecting individual rights","Scheduling transportation only","Managing billing systems"],a:1},
  {s:0,q:"Rights in service delivery include:",o:["Restricting communication with family","Denying community access","Providing information in plain, understandable language","Limiting participation in service planning"],a:2},
  {s:1,q:"Staff should knock before entering an individual's personal space.",o:TF,a:0},
  {s:1,q:"Staff may monitor private phone calls without permission.",o:TF,a:1},
  {s:1,q:"All staff are mandatory reporters of suspected abuse, neglect, or exploitation.",o:TF,a:0},
  {s:1,q:"Individuals have the right to participate in planning their own services.",o:TF,a:0},
  {s:1,q:"Failure to report a rights violation may result in disciplinary action.",o:TF,a:0},
  {s:2,p:2,q:"You are preparing to assist an individual with personal care. What should you do to protect their privacy and dignity?",o:["Knock before entering, explain the care, respect personal space, keep it confidential, and communicate respectfully","Work quickly and skip explaining so it's over sooner","Leave the door open in case a coworker needs you","Chat with a coworker about the person during care"],a:0},
  {s:2,p:2,q:"An individual tells you they want to file a complaint about services. What are your responsibilities?",o:["Help them file it, make sure it's reported, protect them from retaliation, and explain the process in plain language","Tell them complaints usually don't change anything","Ask them to wait until their family visits","Handle it yourself without reporting it"],a:0},
  {s:2,p:2,q:"You witness another staff member speaking disrespectfully to an individual. What should you do?",o:["Follow policy: report it to your supervisor or the Human Rights Advocate, document your concerns, and protect the person's rights and dignity","Ignore it unless it happens again","Confront the coworker in front of the individual","Post about it on social media"],a:0},
  {s:2,p:2,q:"A staff member suspects financial exploitation involving an individual's money. What must be done?",o:["Report it immediately, document observations, notify Liz Lewis and/or Human Rights Advocate Latoya Wilburn, and make sure the person is safe","Collect proof for a few weeks before reporting","Ask the coworker to quietly pay it back","Bring it up at the next staff meeting"],a:0},
  {s:2,p:2,q:"Why is it important to involve the Human Rights Advocate when a serious rights concern or restriction comes up?",o:["They provide independent review, investigate concerns, approve required restrictions, and protect the person's rights","They process payroll for the staff involved","They are only needed if the family complains","They decide which staff members are disciplined"],a:0}]},

 {id:"conf",title:"Practices of Confidentiality",short:"Confidentiality",reg:"12VAC35-105-440",minutes:30,orientation:true,deck:"conf",slides:10,
  sections:["Multiple choice","True or false","Scenarios"],
  qs:[
  {s:0,q:"Confidentiality is considered the cornerstone of Laugh & Live, LLC's relationship with individuals because:",o:["It reduces paperwork","It builds trust","It increases profits","It limits documentation"],a:1},
  {s:0,q:"Virginia regulation 12VAC35-105-440 requires protection of:",o:["Only paper records","Only electronic records","All portions of an individual's record","Only verbal disclosures"],a:2},
  {s:0,q:"Who is responsible for maintaining confidentiality at Laugh & Live, LLC?",o:["Only supervisors","Only clinical staff","Staff members only","Staff, contractors, interns, and volunteers"],a:3},
  {s:0,q:"Access to client records should be based on:",o:["Curiosity","Friendship with the client","Legitimate, documented need","Years of employment"],a:2},
  {s:0,q:"Before sharing records in person, by phone, or electronically, staff must:",o:["Assume the person is authorized","Verify identity and authorization","Ask another employee","Share only partial information"],a:1},
  {s:0,q:"Copies of client records:",o:["Are less sensitive than originals","Can be made without approval","Carry the same level of sensitivity as originals","Do not require safeguards"],a:2},
  {s:0,q:"All copied records must be labeled:",o:["“Private”","“Protected”","“CONFIDENTIAL”","“For Office Use Only”"],a:2},
  {s:0,q:"Sharing client information generally requires:",o:["Verbal permission","Supervisor approval only","Signed written consent","Staff discretion"],a:2},
  {s:0,q:"Which situation may allow limited disclosure without written consent?",o:["Staff curiosity","A genuine emergency or court order","Requests from friends","Social media inquiries"],a:1},
  {s:0,q:"If you suspect a confidentiality breach, you should:",o:["Ignore it","Wait until the next meeting","Notify your supervisor immediately","Handle it privately without reporting"],a:2},

  {s:1,q:"It is acceptable to discuss client information in break rooms if clients are not present.",o:TF,a:1},
  {s:1,q:"Unauthorized copying or distribution of records is considered a serious policy violation.",o:TF,a:0},
  {s:1,q:"Confidentiality breaches can result in emotional harm, legal action, and reputational damage.",o:TF,a:0},
  {s:1,q:"When unsure about sharing information, employees should ask before acting.",o:TF,a:0},
  {s:2,p:2,q:"A staff member accidentally leaves client files unattended on a printer. What should they do immediately?",o:["Secure the records right away, prevent anyone else from seeing them, and notify a supervisor if necessary","Leave them, since the printer is in a staff-only area","Shred them and reprint later without telling anyone","Ask a coworker to drop them at the front desk"],a:0},
  {s:2,p:2,q:"A coworker asks to view a client record out of curiosity because they “know the family.” What is the correct response?",o:["Deny access. Only authorized staff with a legitimate, documented need may view records","Let them look, since they already know the family","Let them look if no supervisor is around","Summarize the record out loud instead of showing it"],a:0},
  {s:2,p:2,q:"Someone calls claiming to be authorized to receive client information. What must you do before sharing anything?",o:["Verify the caller's identity, confirm authorization, and make sure proper consent exists","Share basic details, since they said they are authorized","Share only the client's address","Ask for their name, then share what they need"],a:0},
  {s:2,p:2,q:"Which are best practices for protecting digital client files?",o:["Use strong passwords, enable encryption, and log out when stepping away","Share one login so coverage is easier","Save copies to your personal phone as a backup","Leave your screen unlocked during short breaks"],a:0},
  {s:2,p:2,q:"After client information is legally disclosed, what must be documented?",o:["What was shared, with whom, when, and the reason for the disclosure","Only the date","Nothing, because the disclosure was legal","Only the name of the person who asked"],a:0}]},

 {id:"sir",title:"Serious Incident Reporting",short:"Serious Incidents",reg:"12VAC35-105-440",minutes:30,orientation:true,deck:"sir",slides:14,
  sections:["Multiple choice","True or false","Classification scenarios","Process & accountability"],
  qs:[
  {s:0,q:"The primary purpose of serious incident reporting is to:",o:["Increase paperwork","Protect lives and ensure compliance","Discipline staff","Reduce documentation"],a:1},

COURSES.forEach(c=>{c.qs.forEach(q=>{q.p=q.p||1});c.total=c.qs.reduce((t,q)=>t+q.p,0);c.short=c.short||c.title});
const ROLE_NAMES=["Direct Support Professional","QDDP","Counselor","Program Manager","Office / Admin Staff"];

// dates
const today=new Date(); today.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addBiz=(d,n)=>{let x=new Date(d),c=0;while(c<n){x.setDate(x.getDate()+1);const w=x.getDay();if(w&&w<6)c++;}return x};
const fmt=s=>{if(!s)return"—";const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function seed(){
  const staff=[
   {id:"jc",name:"Jasmine Carter",role:"Direct Support Professional",email:"jasmine.carter@example.com",hire:iso(addDays(today,-5))},
   {id:"mb",name:"Marcus Bell",role:"Counselor",email:"marcus.bell@example.com",hire:"2024-03-11"},
   {id:"tr",name:"Tanya Ruiz",role:"Program Manager",email:"tanya.ruiz@example.com",hire:"2023-08-02"},
   {id:"dp",name:"Devon Price",role:"Direct Support Professional",email:"devon.price@example.com",hire:iso(addDays(today,-12))},
   {id:"rh",name:"Renee Hall",role:"Office / Admin Staff",email:"renee.hall@example.com",hire:"2025-01-15"}];
  const rec={};
  staff.forEach(s=>COURSES.forEach(c=>{
    const hire=new Date(s.hire+"T00:00:00");
    const newHire=(today-hire)/864e5<60;
    rec[s.id+"|"+c.id]={assigned:newHire?s.hire:iso(addDays(today,-20)),due:newHire?iso(addBiz(hire,15)):iso(addDays(today,40)),watched:0,attempts:[],cert:null};
  }));
  const st={staff,rec,mail:[],certSeq:1,roles:defaultRoles()};
  const done=(sid,cid,days,score)=>{const r=rec[sid+"|"+cid];const d=iso(addDays(today,-days));r.watched=COURSES.find(c=>c.id===cid).minutes;r.attempts=[{date:d,score}];r.cert={no:certNo(st),date:d,score};};
  // Tanya: everything current, one renewal coming up
  [["hr",125,100],["conf",120,100],["sir",119,93],["ic",118,97],["emer",345,93],["doc",117,93],["pc",116,100],["hcbs",115,90]].forEach(x=>done("tr",...x));
  // Marcus: documentation expired, emergency overdue
  [["hr",205,96],["conf",200,96],["sir",199,89],["ic",198,90],["doc",372,87],["pc",197,100],["hcbs",196,90]].forEach(x=>done("mb",...x));
  rec["mb|emer"].due=iso(addDays(today,-3));
  // Devon (new hire): two done, confidentiality needs a retake, emergency locked after 3 tries, documentation in progress
  done("dp","hr",9,92);done("dp","sir",8,84);
  const dc=rec["dp|conf"];dc.watched=30;dc.attempts=[{date:iso(addDays(today,-4)),score:72}];
  const de=rec["dp|emer"];de.watched=45;de.attempts=[{date:iso(addDays(today,-6)),score:63},{date:iso(addDays(today,-5)),score:70},{date:iso(addDays(today,-2)),score:73}];
  rec["dp|doc"].watched=12;
  // Renee (office staff): only her 5 required courses, all current
  [["hr",160,96],["conf",158,100],["sir",157,89],["ic",156,93],["emer",155,90]].forEach(x=>done("rh",...x));
  return st;
}
function certNo(st){return "LL-"+today.getFullYear()+"-"+String(st.certSeq++).padStart(4,"0")}
const KEY="ll-training-demo-v4";
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.staff||!S.rec||!S.roles||!S.rec["jc|hcbs"])S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const expires=c=>c?iso(addDays(new Date(c.date+"T00:00:00"),365)):null;
function status(sid,cid){
  const r=S.rec[sid+"|"+cid];
  if(r.cert){const ex=expires(r.cert);const left=(new Date(ex+"T00:00:00")-today)/864e5;
    if(left<0)return{k:"Expired",cls:"c-bad",r};
    if(left<=30)return{k:"Renewal due soon",cls:"c-warn",r};
    return{k:"Completed",cls:"c-good",r};}
  if(r.attempts.length>=MAX_ATTEMPTS)return{k:"Locked: needs reset",cls:"c-bad",r};
  if(r.due<iso(today))return{k:"Overdue",cls:"c-bad",r};
  if(r.attempts.length)return{k:"Retake needed",cls:"c-warn",r};
  if(r.watched>0)return{k:"In progress",cls:"c-acc",r};
  return{k:"Not started",cls:"c-idle",r};
}
const staffOf=id=>S.staff.find(x=>x.id===id);
const reqIds=st=>(S.roles[st.role]||COURSES.map(c=>c.id));
const isReq=(sid,cid)=>reqIds(staffOf(sid)).includes(cid);
const reqCourses=st=>COURSES.filter(c=>reqIds(st).includes(c.id));
const mmss=m=>{const t=Math.round(m*60);return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};

function renderCourse(){
  const c=COURSES.find(x=>x.id===view.cid), r=S.rec[who+"|"+c.id];
  if(view.pos==null)view.pos=Math.min(r.watched,c.minutes)>=c.minutes?0:Math.min(r.watched,c.minutes);
  let playing=false;
  app.innerHTML=`<button class="btn back" id="back">← My trainings</button>
  <div class="section-head"><h1>${esc(c.title)}</h1>${c.reg?`<span class="small muted">Guided by ${esc(c.reg)}</span>`:""}</div>
  <div class="player"><div class="frame" id="frame"><img id="slide" alt=""><div class="noslides" id="noslides" hidden><b>${esc(c.title)}</b><span>Slides for this course haven't been uploaded yet. The timer and test still work for the demo.</span></div><a class="vlink" id="vlink" target="_blank" rel="noopener" hidden></a><span class="k" id="part"></span></div>
   <div class="bar"><button class="play" id="play" aria-label="Play">▶</button>
    <div class="track" id="track" role="slider" aria-label="Lesson position" tabindex="0"><div class="seen" id="seen"></div><div class="pos" id="pos"></div></div>
    <span class="t" id="time"></span></div></div>
  <div class="watch"><div class="stat"><span>Time completed</span><b id="w"></b></div><div class="stat"><span>Required</span><b>${mmss(c.minutes)}</b></div><div class="stat"><span>Test</span><b id="lock"></b></div></div>
  <div class="panel"><div class="row" style="justify-content:space-between"><p class="small muted" style="margin:0;max-width:56ch">Time only counts while the lesson plays on this screen. Switching tabs pauses it. You can go back, but you can't skip ahead of what you've completed.</p>
  <div class="row"><button class="btn demo" id="skip">Skip to end (demo only)</button><button class="btn primary" id="take" disabled>Take the test</button></div></div></div>`;
  const $=id=>document.getElementById(id);
  // preload slides
  for(let i=0;i<c.slides;i++){const im=new Image();im.src=slideSrc(c,i)}
  let shown=-1;
  if(!c.slides){$("slide").hidden=true;$("noslides").hidden=false}
  function paint(){
    if(c.slides){const i=Math.min(c.slides-1,Math.floor(view.pos/c.minutes*c.slides));
    if(i!==shown){$("slide").src=slideSrc(c,i);$("slide").alt=`${c.title}, slide ${i+1}`;shown=i;
      const L=c.links&&c.links[i];const v=$("vlink");if(L){v.href=L.url;v.textContent="▶ "+L.label;v.hidden=false;playing=false;stopTimer()}else v.hidden=true}
    $("part").textContent=`Slide ${i+1} of ${c.slides}`;} else $("part").textContent="Lesson";
    $("seen").style.width=(Math.min(r.watched,c.minutes)/c.minutes*100)+"%";$("pos").style.width=(view.pos/c.minutes*100)+"%";
    $("time").textContent=mmss(view.pos)+" / "+mmss(c.minutes);$("w").textContent=mmss(Math.min(r.watched,c.minutes));
    const ok=r.watched>=c.minutes;$("lock").textContent=ok?"Unlocked":"Locked";$("take").disabled=!ok;$("skip").hidden=ok;
    $("play").textContent=playing?"❚❚":"▶";$("play").setAttribute("aria-label",playing?"Pause":"Play");
  }
  function tick(){ if(!playing||document.hidden)return; // demo speed: 1s = 1 min, tick every 250ms
    view.pos=Math.min(c.minutes,view.pos+0.25);
    if(view.pos>r.watched)r.watched=view.pos;
    if(view.pos>=c.minutes){playing=false;stopTimer();toast("Lesson complete. The test is unlocked.")}
    save();paint();}
  $("play").onclick=()=>{playing=!playing;if(playing){if(view.pos>=c.minutes)view.pos=0;timer=timer||setInterval(tick,250)}else stopTimer();paint()};
  $("track").onclick=e=>{const rc=e.currentTarget.getBoundingClientRect();const want=(e.clientX-rc.left)/rc.width*c.minutes;
    if(want>r.watched+0.01){toast("You can't skip ahead. Keep going to continue.");return}
    view.pos=Math.max(0,want);paint()};
  $("skip").onclick=()=>{playing=false;stopTimer();r.watched=c.minutes;view.pos=c.minutes-0.01;save();paint();toast("Demo: lesson marked complete. The test is unlocked.")};
  $("back").onclick=()=>go({name:"list"});
  $("take").onclick=()=>go({name:"quiz",cid:c.id});
  document.onvisibilitychange=()=>{if(document.hidden&&playing){playing=false;stopTimer();paint()}};
  paint();
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQuiz(){
  const c=COURSES.find(x=>x.id===view.cid), r=S.rec[who+"|"+c.id];
  if(!view.order){
    // shuffle within each section, keep section order; True/False options stay in order
    const groups={};c.qs.forEach((q,i)=>{(groups[q.s||0]=groups[q.s||0]||[]).push(i)});
    view.order=Object.keys(groups).sort((a,b)=>a-b).flatMap(k=>shuffle(groups[k])).map(i=>({i,opts:(c.qs[i].o.length===2||c.qs[i].fixed)?c.qs[i].o.map((t,j)=>j):shuffle(c.qs[i].o.map((t,j)=>j))}));
  }
  const n=r.attempts.length+1;let lastSec=null,k=0;
  const body=view.order.map(o=>{const q=c.qs[o.i];let h="";
    if(c.sections&&q.s!==lastSec){lastSec=q.s;h+=`<h3 class="sec">${esc(c.sections[q.s])}</h3>`}
    k++;
    return h+`<fieldset class="q"><legend>${k}. ${esc(q.q)}<span class="pts">${q.p} pt${q.p>1?"s":""}</span></legend>
     ${o.opts.map(j=>`<label class="opt"><input type="radio" name="q${o.i}" value="${j}" required><span>${esc(q.o[j])}</span></label>`).join("")}</fieldset>`}).join("");
  app.innerHTML=`<button class="btn back" id="back">← Back to lesson</button>
  <div class="section-head"><h1>${esc(c.short)} · Test</h1><span class="small muted">Attempt ${n} of ${MAX_ATTEMPTS} · ${c.total} points · Passing score 80%</span></div>
  <form class="panel" id="f">${body}
   <div class="row" style="margin-top:10px"><button class="btn primary" type="submit">Submit answers</button></div></form>`;
  document.getElementById("back").onclick=()=>go({name:"course",cid:c.id});
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);
    let pts=0;c.qs.forEach((q,i)=>{if(Number(fd.get("q"+i))===q.a)pts+=q.p});
    const score=Math.round(pts/c.total*100);r.attempts.push({date:iso(today),score,pts});
    const s=S.staff.find(x=>x.id===who);
    if(pts/c.total>=PASS){r.cert={no:certNo(S),date:iso(today),score};
      S.mail.unshift({when:new Date().toLocaleString("en-US"),to:s.email,cc:AGENCY_EMAIL,subject:`Certificate: ${c.title}`,body:`${s.name} passed with ${score}% (${pts} of ${c.total} points). Certificate ${r.cert.no} attached.`});
      save();go({name:"cert",cid:c.id,sid:who,fresh:true,pts});return}
    save();
    const left=MAX_ATTEMPTS-r.attempts.length;
    app.insertAdjacentHTML("beforeend",`<div class="result fail" role="status"><h2>Score: ${score}% (${pts} of ${c.total} points)</h2><p style="margin:6px 0 12px">You need 80% to pass. ${left>0?`You have ${left} attempt${left>1?"s":""} left. Questions will be reshuffled.`:"You've used all attempts. Your supervisor will review and reset the test."}</p>
    <div class="row">${left>0?`<button class="btn primary" id="retry">Retake test</button><button class="btn" id="rewatch">Review the lesson</button>`:`<button class="btn" id="home">Back to my trainings</button>`}</div></div>`);
    e.target.querySelectorAll("input,button").forEach(x=>x.disabled=true);
    const rr=document.getElementById("retry");if(rr)rr.onclick=()=>go({name:"quiz",cid:c.id});
    const rw=document.getElementById("rewatch");if(rw)rw.onclick=()=>go({name:"course",cid:c.id,pos:0});
    const h=document.getElementById("home");if(h)h.onclick=()=>go({name:"list"});
    document.querySelector(".result").scrollIntoView({behavior:"smooth",block:"center"});
  };
}

  const top=Math.max(392,y+60);const cw=(W-160)/cols.length;
  cols.forEach(([k,v],i)=>{const x=80+cw*i+cw/2;line(80+cw*i+8,top,80+cw*(i+1)-8,top,LN,1);text(k.toUpperCase(),x,top+16,8.5,false,MUT);text(v,x,top+34,12,false,INK)});

  if(tab==="board"){
    body=`<div class="tablewrap"><table class="board"><thead><tr><th>Employee</th>${COURSES.map(c=>`<th>${esc(c.short)}</th>`).join("")}</tr></thead><tbody>
    ${S.staff.map(s=>`<tr><td><b>${esc(s.name)}</b><span class="sub">${esc(s.role)}</span><span class="sub">Orientation due ${fmt(iso(addBiz(new Date(s.hire+"T00:00:00"),15)))}</span></td>
     ${COURSES.map(c=>{if(!isReq(s.id,c.id))return `<td><span class="sub" style="margin:0">Not required</span></td>`;const st=status(s.id,c.id),r=st.r;return `<td><span class="chip ${st.cls}">${st.k}</span>
       <span class="sub">${r.cert?`Score ${r.cert.score}% · ${fmt(r.cert.date)}`:`Due ${fmt(r.due)} · ${Math.round(Math.min(r.watched,c.minutes))} of ${c.minutes} min done`}</span>
       ${r.attempts.length&&!r.cert?`<span class="sub">Attempts: ${r.attempts.map(a=>a.score+"%").join(", ")}</span>`:""}
       ${st.k.startsWith("Locked")?`<button class="linkbtn small" data-unlock="${s.id}|${c.id}">Reset attempts</button>`:""}</td>`}).join("")}</tr>`).join("")}
    </tbody></table></div>`;
  } else if(tab==="person"){
    const sid=view.sid||S.staff[0].id, s=S.staff.find(x=>x.id===sid);
    const orient=iso(addBiz(new Date(s.hire+"T00:00:00"),15));
    const orientDone=reqCourses(s).filter(c=>c.orientation).every(c=>S.rec[sid+"|"+c.id].cert);
    body=`<div class="row" style="margin-bottom:14px"><label class="small muted" for="pick">Employee</label><select id="pick">${S.staff.map(x=>`<option value="${x.id}" ${x.id===sid?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
    <div class="panel" style="margin-top:0"><div class="section-head" style="margin-bottom:8px"><h2>Training record: ${esc(s.name)}</h2>${(()=>{const newHire=(today-new Date(s.hire+"T00:00:00"))/864e5<60;
      if(newHire||!orientDone&&false)return `<span class="chip ${orientDone?"c-good":(orient<iso(today)?"c-bad":"c-warn")}">Orientation ${orientDone?"complete":(orient<iso(today)?"past due":"due "+fmt(orient))}</span>`;
      const bad=reqCourses(s).filter(c=>["Overdue","Expired","Locked: needs reset"].includes(status(sid,c.id).k)).length;
      return bad?`<span class="chip c-bad">${bad} training${bad>1?"s":""} need${bad>1?"":"s"} attention</span>`:`<span class="chip c-good">All trainings current</span>`})()}</div>
     <p class="small muted" style="margin:0 0 12px"><label>Role <select id="chrole" style="margin-left:4px">${Object.keys(S.roles).map(r=>`<option ${r===s.role?"selected":""}>${esc(r)}</option>`).join("")}</select></label> · ${reqCourses(s).length} required · Hired ${fmt(s.hire)} · Personal email <span class="mono">${esc(s.email)}</span></p>
     <div class="tablewrap"><table><thead><tr><th>Training</th><th>Status</th><th>Completed</th><th>Score</th><th>Attempts</th><th>Certificate</th><th>Renew by</th></tr></thead><tbody>
     ${reqCourses(s).map(c=>{const st=status(sid,c.id),r=st.r;return `<tr><td>${esc(c.short)}</td><td><span class="chip ${st.cls}">${st.k}</span></td><td>${r.cert?fmt(r.cert.date):"—"}</td><td>${r.cert?r.cert.score+"%":"—"}</td><td>${r.attempts.length?r.attempts.map(a=>a.score+"%").join(", "):"—"}</td><td>${r.cert?`<button class="linkbtn mono" data-view="${c.id}">${r.cert.no}</button>`:"—"}</td><td>${r.cert?fmt(expires(r.cert)):"—"}</td></tr>`}).join("")}
     </tbody></table></div>
     <p class="small muted" style="margin:12px 0 0">This record is the inspection view: one page per employee showing every required training, dates, scores, and certificates.</p></div>`;
  } else if(tab==="staff"){
    body=`<div class="panel" style="margin-top:0"><h2 style="margin-bottom:12px">Add an employee</h2>
     <form id="addf" class="form" novalidate>
      <label>Full name<input name="name" autocomplete="off" required></label>
      <label>Role<select name="role">${Object.keys(S.roles).map(r=>`<option>${esc(r)}</option>`).join("")}</select></label>
      <label>Personal email<input name="email" type="email" autocomplete="off"></label>
      <label>Hire date<input name="hire" type="date" value="${iso(today)}" required></label>
      <div><button class="btn primary" type="submit">Add employee</button></div></form>
     <p class="err" id="adderr" hidden></p>
     <p class="small muted" style="margin:12px 0 0">New employees are assigned the trainings their role requires (set on the Roles tab). Orientation is due within 15 business days of hire.</p></div>
     <div class="tablewrap" style="margin-top:16px"><table><thead><tr><th>Employee</th><th>Role</th><th>Hired</th><th>Email</th><th>Completed</th><th>Needs attention</th></tr></thead><tbody>
     ${S.staff.map(x=>{const xr=reqCourses(x);const st=xr.map(c=>status(x.id,c.id));const done=st.filter(t=>t.k==="Completed"||t.k==="Renewal due soon").length;const bad=st.filter(t=>["Overdue","Expired","Locked: needs reset"].includes(t.k)).length;
       return `<tr><td><button class="linkbtn" data-rec="${x.id}">${esc(x.name)}</button></td><td>${esc(x.role)}</td><td>${fmt(x.hire)}</td><td class="mono small">${esc(x.email||"—")}</td><td>${done} of ${xr.length}</td><td>${bad?`<span class="chip c-bad">${bad}</span>`:"—"}</td></tr>`}).join("")}
     </tbody></table></div>`;
  } else if(tab==="roles"){
    const rn=Object.keys(S.roles);
    body=`<p class="small muted" style="margin:0 0 12px;max-width:70ch">Check the trainings each role must complete. Employees see only their role's trainings, and the status board and inspection record follow the same rules. Changes apply right away.</p>
     <div class="tablewrap"><table class="roles"><thead><tr><th>Training</th>${rn.map(r=>`<th style="text-align:center">${esc(r)}<span style="display:block;text-transform:none;letter-spacing:0;font-weight:500;margin-top:3px">${S.staff.filter(x=>x.role===r).length} staff</span></th>`).join("")}</tr></thead><tbody>
     ${COURSES.map(c=>`<tr><td><b>${esc(c.short)}</b></td>${rn.map(r=>`<td style="text-align:center"><input type="checkbox" data-rc="${esc(r)}|${c.id}" aria-label="${esc(c.short)} required for ${esc(r)}" ${S.roles[r].includes(c.id)?"checked":""} style="width:18px;height:18px;accent-color:var(--accent)"></td>`).join("")}</tr>`).join("")}
     <tr><td class="muted small">Total required</td>${rn.map(r=>`<td style="text-align:center" class="mono">${S.roles[r].length}</td>`).join("")}</tr>
     </tbody></table></div>`;
  } else if(tab==="courses"){
    body=`<div class="cat">${COURSES.map(c=>`<div class="card">${thumb(c,"cimg")}<div><h3>${esc(c.title)}</h3>
      <p class="small muted" style="margin:6px 0 0">${c.reg?esc(c.reg)+" · ":""}${c.slides?c.slides+" slides":"Slides needed"} · Required for ${Object.keys(S.roles).filter(r=>S.roles[r].includes(c.id)).length} of ${Object.keys(S.roles).length} roles · ${c.minutes} min required · ${c.qs.length} questions (${c.total} pts) · 80% to pass · renew yearly</p></div></div>`).join("")}</div>
      <p class="small muted" style="margin:14px 0 0">Courses are built from Laugh &amp; Live's own training slides and tests.</p>`;
  } else {
    body=S.mail.length?`<div class="log">${S.mail.map(m=>`<div><b>${esc(m.subject)}</b> <span class="muted small">· ${esc(m.when)}</span><br>To <span class="mono">${esc(m.to)}</span> · Copy <span class="mono">${esc(m.cc)}</span><br><span class="muted">${esc(m.body)}</span></div>`).join("")}</div>`
      :`<div class="panel" style="margin-top:0"><p style="margin:0">No certificate emails yet. Pass a test as an employee and the email appears here, addressed to the employee with a copy to <span class="mono">${AGENCY_EMAIL}</span>.</p></div>`;
  }
  app.innerHTML=`<div class="section-head"><h1>Training administration</h1><span class="small muted">As of ${fmt(iso(today))}</span></div>${tiles}${tabs}${body}`;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go({name:"admin",tab:b.dataset.tab,sid:view.sid}));
  app.querySelectorAll("[data-unlock]").forEach(b=>b.onclick=()=>{S.rec[b.dataset.unlock].attempts=[];save();toast("Attempts reset. The employee can retake the test.");render()});
  app.querySelectorAll("[data-rc]").forEach(b=>b.onchange=()=>{const i=b.dataset.rc.lastIndexOf("|");const r=b.dataset.rc.slice(0,i),cid=b.dataset.rc.slice(i+1);const set=S.roles[r];
    if(b.checked){if(!set.includes(cid))set.push(cid);let n=0;S.staff.filter(x=>x.role===r).forEach(x=>{const rc=S.rec[x.id+"|"+cid];if(!rc.cert&&!rc.watched&&!rc.attempts.length){rc.assigned=iso(today);const hd=new Date(x.hire+"T00:00:00");rc.due=(today-hd)/864e5<60?iso(addBiz(hd,15)):iso(addDays(today,30))}n++});
      toast(`${COURSES.find(c=>c.id===cid).short} is now required for ${r}${n?` (${n} staff)`:""}`)}
    else{S.roles[r]=set.filter(x=>x!==cid);toast(`${COURSES.find(c=>c.id===cid).short} is no longer required for ${r}`)}
    S.roles[r].sort((a,b)=>COURSES.findIndex(c=>c.id===a)-COURSES.findIndex(c=>c.id===b));save();render()});
  const chrole=document.getElementById("chrole");if(chrole)chrole.onchange=()=>{const x=staffOf(view.sid||S.staff[0].id);x.role=chrole.value;
    reqCourses(x).forEach(c=>{const rc=S.rec[x.id+"|"+c.id];if(!rc.cert&&!rc.watched&&!rc.attempts.length&&rc.due<iso(today)){rc.assigned=iso(today);rc.due=iso(addDays(today,30))}});
    save();toast(`${x.name} is now ${x.role}: ${reqCourses(x).length} required trainings`);render()};
  app.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>go({name:"admin",tab:"person",sid:b.dataset.rec}));
  const addf=document.getElementById("addf");
  if(addf)addf.onsubmit=e=>{e.preventDefault();const fd=new FormData(addf);const err=document.getElementById("adderr");
    const name=String(fd.get("name")||"").trim(),email=String(fd.get("email")||"").trim(),hire=String(fd.get("hire")||"");
    const bad=!name?"Enter the employee's name.":(!hire?"Enter a hire date.":(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)?"Check the email address.":""));
    if(bad){err.textContent=bad;err.hidden=false;return}
    const id="e"+Date.now().toString(36);const hd=new Date(hire+"T00:00:00");const recent=(today-hd)/864e5<60;
    S.staff.push({id,name,role:String(fd.get("role")),email,hire});
    COURSES.forEach(c=>{S.rec[id+"|"+c.id]={assigned:iso(today),due:recent?iso(addBiz(hd,15)):iso(addDays(today,30)),watched:0,attempts:[],cert:null}});
    save();toast(`${name} added and assigned ${reqIds({role:String(fd.get("role"))}).length} trainings`);go({name:"admin",tab:"staff"})};
  const pick=document.getElementById("pick");if(pick)pick.onchange=()=>go({name:"admin",tab:"person",sid:pick.value});
  app.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go({name:"cert",cid:b.dataset.view,sid:view.sid||S.staff[0].id}));
}

fillWho();render();
})();
</script>
</body></html>
