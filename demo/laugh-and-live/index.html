ually, and they may affect a single location or the entire community. Common Emergency Types. Fire — Structure fires, electrical fires, or smoke conditions requiring immediate evacuation. Natural Disasters — Tornadoes, hurricanes, flooding, winter storms, earthquakes, or extreme heat/cold. Power Outages — Extended loss of electricity affecting safety systems, climate control, or medical equipment. Medical Emergencies — Life-threatening health crises requiring immediate professional intervention. Missing Person — A person cannot be located and may require immediate coordinated response. Community Disasters — Chemical spills, active threats, infrastructure failures, or pandemic events. Internal Emergencies. Situations originating within our facility — fires, medical crises, facility damage, or utility failures. External Emergencies. Community-wide events affecting our operations — natural disasters, public health emergencies, or regional threats.", "EMERGENCY TYPE. Fire Emergency Response. When fire is detected, swift and coordinated action is critical. Our response follows the universally recognized RACE acronym to ensure maximum safety for everyone involved. R - Rescue. Rescue anyone in immediate danger. Prioritize moving individuals away from the direct threat. A - Alarm. Activate the fire alarm to alert others and initiate the emergency response system. C - Contain. Contain the fire by closing doors and windows, if safe to do so, to slow the spread of smoke and flames. E - Extinguish/Evacuate. Extinguish small fires if trained and safe, or evacuate the area immediately. Never put yourself at risk. Evacuation Steps. Upon hearing the alarm, calmly exit the building using the nearest safe route. Do NOT use elevators during a fire emergency. Pull the nearest fire alarm pull station while evacuating. Call 911 (or local emergency number) once safely outside. Proceed to your designated external assembly point. Do NOT re-enter the building until officially cleared by emergency personnel. Laugh & Live, LLC conducts fire drills at least twice per year to practice and refine our emergency response procedures.", "EMERGENCY TYPE. Natural Disasters. Natural disasters are unpredictable events that require immediate awareness and preparedness. Understanding common types and our response protocols ensures everyone's safety and minimizes disruption. Tornadoes & Hurricanes. Rapidly rotating columns of air or intense tropical storms. Seek immediate shelter in an interior room or basement. Have an emergency kit ready. Winter Storms. Heavy snow, ice, or extreme cold. Prepare for power outages and travel hazards. Stay indoors, dress in layers, and conserve heat. Extreme Heat/Cold. Prolonged periods of dangerously high or low temperatures. Stay hydrated in heat; layer clothing in cold. Seek cooling/warming centers if needed. For severe weather, be prepared to shelter-in-place immediately. This means staying put in a safe location until the threat passes. Monitor local weather alerts and NOAA Weather Radio for warnings. Flooding. Excessive water accumulation from heavy rainfall or overflowing bodies of water. Never drive or walk through floodwaters. Evacuate to higher ground if advised. Earthquakes. Sudden, violent shaking of the ground. Drop, Cover, and Hold On during shaking. Stay away from windows and heavy furniture.", "EMERGENCY TYPE. Power Outages. Power outages can be disruptive and challenging, especially when essential services are affected. Our plan focuses on immediate safety, maintaining critical operations, and clear communication. Initial Response. Stay calm and assess the situation. Avoid opening refrigerators and freezers unnecessarily to preserve food. Check on Individuals. Immediately check on individuals, especially those relying on powered medical devices. Ensure backup power sources are activated. Activate Backup Systems. Engage backup generators, uninterruptible power supplies (UPS), or other emergency power solutions for essential equipment and lighting. Medication Management. For medications requiring refrigeration, confirm cold storage is maintained. Prepare coolers with ice packs if the outage is expected to be prolonged. Ensure Lighting & Safety. Distribute flashlights, headlamps, or battery-powered lanterns. Avoid candles due to fire risk. Clear pathways to prevent trips and falls. Communication Protocol. Use battery-powered devices or landlines (if available) to communicate with staff, families, and emergency contacts as needed. Contact Utility Company. Report the outage to the local utility provider. Do not call 911 unless there is an immediate threat to life or safety. Consider Evacuation. If the power outage is prolonged, environmental conditions become unsafe (e.g., extreme temperatures), or critical services cannot be maintained, consider emergency evacuation. Special Considerations for Medical Devices: Identify all individuals who rely on powered medical devices. Always have a plan for backup power, and know when to seek medical assistance or alternative care if backup power fails.", "EMERGENCY TYPE. Medical Emergencies. Responding effectively to medical emergencies requires quick thinking and adherence to a clear protocol to ensure the best possible outcome for the individual in distress. Recognize Emergency. Assess the situation for signs and symptoms indicating a life-threatening medical event (e.g., unconsciousness, severe bleeding, difficulty breathing, chest pain). Call 911 Immediately. Provide precise location, nature of emergency, and any known patient information. Follow dispatchers' instructions until professional help arrives. Ensure Safety & Stay. Do not move the person unless they are in immediate danger (e.g., fire, falling debris). Stay with the individual to provide comfort and monitor their condition. Provide First Aid. If trained and safe, provide appropriate first aid such as CPR, using an AED, or assisting with choking. Protect the individual from further harm. Notify Supervisor. Inform your immediate supervisor or designated emergency contact person about the incident, providing key details and actions taken. Document Incident. Accurately record all observations, actions taken, and the timeline of events. This documentation is crucial for follow-up and compliance. Follow Up. After the immediate crisis is managed, ensure appropriate follow-up with the individual's family/emergency contacts, respecting privacy and protocols. AED & First Aid Locations:", "EMERGENCY TYPE. Missing Person Protocol. A missing person incident requires immediate, structured action. Following this protocol ensures a swift response, maximizing the chances of a safe return and adhering to regulatory requirements. Immediate Search & Verification. Conduct a thorough internal search of the facility and immediate grounds. Verify the person's absence and last known location. Call 911 Immediately. Report the missing person to local law enforcement. Provide all known details, including description, last seen clothing, and any pertinent medical information. Internal & External Notifications. Notify your supervisor, executive leadership, family, authorized representatives, and the Department of Behavioral Health and Developmental Services (DBHDS) as per protocol. Documentation of Events. Maintain a detailed log of all actions taken, observations, communications, and their exact timestamps. This is critical for investigations and reviews. Coordinate Search Efforts. Cooperate fully with law enforcement and assist in search efforts as directed, ensuring staff safety and proper procedures are followed. Post-Incident Review. Once the situation is resolved, conduct a comprehensive review to identify contributing factors, evaluate response effectiveness, and implement preventative measures. Time is critical — do not delay calling 911 if a person cannot be located.", "CRITICAL PROCEDURE. Shelter-in-Place Procedures. Shelter-in-place is a protective action to take immediately during emergencies where it is safer to stay indoors than to evacuate. It means finding a safe, interior room and remaining there until authorities advise otherwise. When to Shelter-in-Place. Severe Weather. Tornadoes, blizzards, or other extreme weather events. Air Quality Emergency. Smoke, dust, or other airborne contaminants making outside air unsafe. Steps for Shelter-in-Place. Move to Interior Room. Immediately move to an interior room or area without windows, preferably on a lower floor. Avoid common areas. Seal Doors & Windows. If a chemical or hazardous material threat is present, seal doors and windows with towels, tape, or plastic sheeting. Stay Low & Quiet. For active threats, stay out of sight, remain quiet, and put as much as possible between you and the threat. Turn Off HVAC. If a chemical threat, turn off heating, ventilation, and air conditioning (HVAC) systems to prevent outside air from entering. Monitor Alerts. Use battery-powered radios, phones, or emergency communication systems to monitor official alerts and instructions. Await All-Clear. Remain in place until authorities issue an \"all-clear\" message. Do not leave shelter prematurely. Hazmat/Chemical Spill. Nearby release of hazardous materials or toxic chemicals. Active Threat. An immediate danger outside the facility, such as an active shooter. Communication During Shelter-in-Place. Staff should use designated emergency communication channels to report their status and location. Avoid making unnecessary calls to keep lines open for emergency services. Families will be notified as soon as it is safe and appropriate. When to Evacuate Instead: If the building is compromised (e.g., fire, structural damage) or the immediate area is safer than staying put, prioritize evacuation following established routes.", "QUICK REFERENCE. Emergency Contacts. Having immediate access to critical contact information is essential for effective emergency response. Keep this list accessible at all times. External Emergency Contacts. These are vital external services to contact in various emergency scenarios. 911. Police / Fire / EMS. Local Fire Non-Emergency. (Local non-emergency number). Internal Laugh & Live, LLC Contacts. For internal communication and support during incidents. Poison Control. 1-800-222-1222. VA DBHDS Crisis Line. (Specific local number if available, otherwise general). Local Police Non-Emergency. Utility Company. For power outages. NOAA Weather Radio. Emergency broadcasts. Elizabeth Lewis, MA, QDDP , E.lewis@laughandlivellc.com. On-Call Supervisor/Assistant Program Director. Devan Deisch, MSW, QDDP , Assistantprogramdirector@laughandlivellc.com. Executive Director. Program Director/Coordinator. LaWanda Jones, MSW, QDDP , L.jones@laughandlivellc.com. Update contact information whenever changes occur. All staff should have these emergency contacts saved in their phones. Remember: 911 should always be the first call in life-threatening situations. Only use non-emergency numbers for non-immediate threats or informational purposes.", "PERSON-CENTERED CARE. Individual-Specific Emergency Needs. Effective emergency response at Laugh & Live, LLC is deeply rooted in person-centered care. Tailoring emergency plans to each individual's unique needs ensures their safety, comfort, and well-being during critical incidents, reflecting our commitment to personalized support. Key Components of an Individual Emergency Plan. Medical Conditions. Document all known medical conditions, allergies, and existing diagnoses. Medications. List current prescriptions, dosages, administration instructions, and any adverse reactions. Behavioral Support Needs. Outline strategies and triggers for behavioral support, including de-escalation techniques. Mobility Needs. Note specific needs for mobility assistance, such as wheelchair use, walkers, or physical support. Dietary Needs. Record all dietary restrictions, allergies, and feeding instructions. Communication Needs. Detail preferred communication methods, assistive devices, or support for non-verbal individuals. Sensory Sensitivities. Identify sensitivities to light, sound, touch, or specific environments. Individual emergency plans are stored in accessible electronic formats and physical binders at each location. During an emergency, staff must immediately refer to these plans to guide their actions. It is the responsibility of all staff to review and understand the emergency plans for the individuals they support before any emergency occurs. Plans must be reviewed and updated regularly, at least annually or whenever there is a significant change in an individual's condition or needs. Every individual served by Laugh & Live, LLC has a unique emergency support profile. Know your individuals before an emergency occurs.", "COMPREHENSIVE APPROACH. Scope of Our Emergency Preparedness. Laugh & Live's emergency preparedness encompasses both organizational and community-wide emergencies. Our comprehensive approach addresses the full emergency management cycle, ensuring we're ready before disasters strike and capable of effective response and recovery when they occur. Mitigation. Reducing risks and vulnerabilities before emergencies occur through hazard assessments, safety improvements, and preventive measures. Preparedness. Planning, training, drilling, and maintaining resources so we're ready to respond effectively when emergencies happen. Response. Taking immediate action during emergencies to protect lives, stabilize situations, and minimize damage to people and property. Recovery. Restoring normal operations, repairing damage, supporting affected individuals, and incorporating lessons learned.", "The Four Phases of Emergency Management. Identify hazards, assess vulnerabilities, implement safety improvements, and reduce the likelihood or impact of emergencies through proactive measures and continuous risk assessment. Assess damage, restore services, support affected individuals, repair facilities, document incidents, analyze response effectiveness, and update plans based on lessons learned. Each phase builds upon the others, creating a continuous cycle of improvement. Your role varies across these phases, but your engagement in each is essential for comprehensive emergency preparedness. Mitigation. Preparedness. Develop comprehensive plans, conduct regular training sessions, perform emergency drills, maintain emergency supplies, and ensure all staff understand their roles and responsibilities. Response. Execute emergency procedures, evacuate safely, alert authorities, provide emergency care, protect individuals receiving services, and coordinate with emergency responders during active incidents. Recovery.", "Emergency Roles & Responsibilities. Effective emergency response depends on everyone understanding their specific role and executing their responsibilities with precision and confidence. While roles vary by position, all staff share accountability for life safety and service continuity. Administrative Leadership. Activate emergency plans, coordinate overall response, communicate with authorities, make operational decisions, and ensure resources are available. Staff Responsibilities. Conducting headcounts to account for everyone during an emergency. Following emergency protocols and staff directions without delay. Documenting incidents and response actions accurately. Communicating with families and authorized representatives as needed. Supporting individuals with special needs, including mobility, communication, and emotional support. Priority Focus Areas. Life safety — Protecting all persons from harm. Clear communication — Ensuring information flows effectively. Program Coordinators. Implement site-specific procedures, coordinate staff actions, communicate with families and authorized representatives, and document all response activities. Individuals Receiving Services. Follow staff instructions, move to safe locations when directed, stay calm and cooperative, and communicate needs or concerns to staff members. Property protection — Securing facilities and resources. Service continuity — Maintaining essential support.", "Emergency Notification & Communication. Rapid, accurate communication can save lives during emergencies. Laugh & Live maintains robust notification procedures that ensure the right people receive critical information at the right time, enabling coordinated response and appropriate support. How to Report Emergencies. Immediately report emergencies to your direct supervisor or the designated emergency contact. For life-threatening situations, call 911 first, then notify agency leadership. Never delay contacting emergency services while trying to reach internal contacts. Required Notifications. Local authorities — Police, fire, EMS, as appropriate to the emergency type. State authorities — Virginia Department of Behavioral Health and Developmental Services when required. Agency leadership — Executive Director and relevant program administrators. Staff members — Using phone trees, text alerts, or designated communication methods. 24-Hour Access. Laugh & Live maintains round-the-clock communication capability to ensure emergency contacts are always reachable. Multiple Methods. We use phone, text, email, and backup systems to ensure messages reach all staff reliably. Remember: During active emergencies, prioritize life safety over documentation. Record details and make notifications once immediate dangers are addressed and individuals are safe.", "Warning & Alert Systems. Recognition of emergency warnings and alerts enables rapid response that can mean the difference between safe evacuation and dangerous delays. Laugh & Live employs multiple alert methods to ensure everyone receives critical warnings regardless of location or ability. Audible Alarms. Fire alarms, smoke detectors, and emergency alert tones signal immediate need for action. When you hear an alarm, begin emergency procedures immediately — never assume it's a false alarm or wait for confirmation. Verbal Alerts. Staff members may announce emergencies verbally, especially when alarm systems aren't available or when providing specific instructions. Use clear, calm, authoritative language without causing panic. Emergency Notifications. Text messages, phone calls, emails, or other digital alerts notify staff of emergencies affecting our facilities or requiring staff response. Check designated communication channels regularly during severe weather or community emergencies. Communicating With Individuals. Provide clear, calm instructions to individuals receiving services. Explain what's happening in simple terms and tell them exactly what actions to take. Remain reassuring while maintaining urgency. Coordinating With Responders. Share critical information with emergency responders — locations of individuals needing assistance, hazards, facility layouts, and any special circumstances affecting response operations.", "CRITICAL PROCEDURE. Evacuation Procedures: Getting Everyone to Safety. Safe, orderly evacuation requires familiarity with routes, adherence to procedures, and accountability for every individual. When evacuation is necessary, every second counts, and following established procedures ensures no one is left behind. Evacuation Triggers. Evacuate immediately when alarms sound, when directed by emergency personnel, or when conditions threaten life safety — fire, smoke, gas leaks, structural damage, or imminent severe weather. Primary & Secondary Routes. Know both primary and secondary evacuation routes from every area. If primary routes are blocked by fire, smoke, or debris, use secondary routes immediately. Never use elevators during fire emergencies. Accessible Egress. Accessible evacuation routes accommodate individuals with mobility challenges. Identify these routes during drills and ensure they remain clear at all times. Never block exits with furniture, supplies, or equipment. Assembly & Accountability. Proceed to designated assembly areas outside and away from the building. Staff must immediately account for all individuals using attendance sheets or rosters. Report missing individuals to emergency responders immediately. Alternative Shelters. When weather conditions or hazards prevent outdoor assembly, move to predetermined alternative locations or emergency shelters. Know these locations in advance for each facility.", "Supporting Individuals With Special Needs During Evacuation. Effective emergency response means ensuring everyone evacuates safely, including individuals with disabilities or special needs. Our procedures address specific accommodations that enable all individuals to reach safety with dignity and support. Deaf or Hard of Hearing. Use visual alerts, written instructions, gestures, or sign language. Ensure these individuals see evacuation signals and understand what's happening. Make direct eye contact and use clear, visible communication. Blind or Visually Impaired. Provide verbal instructions and physical guidance. Offer your arm for guidance, describe obstacles and routes, and ensure they maintain contact with you throughout evacuation. Never leave them to navigate alone. Non-Ambulatory Individuals. Use accessible evacuation routes, wheelchairs, or evacuation chairs. If evacuation equipment isn't immediately available and danger is imminent, carry individuals carefully using proper lifting techniques or call for assistance. Review each individual's support plan to understand specific needs before emergencies occur. Personalized evacuation strategies ensure everyone receives appropriate assistance without delay or confusion during high-stress situations.", "Emergency Access & Secure Area Protocols. During emergencies, staff may need to override normal security protocols to access locked areas, evacuate individuals, or allow emergency responders entry. Understanding when and how to do this safely protects both security and life safety. Opening Locked Doors. Staff with keys or access codes may unlock secured doors during evacuations to enable rapid exit. After evacuating, leave doors unlocked or propped open to facilitate emergency responder access unless doing so creates additional hazards. Accessing Secure Areas. Emergency personnel may need access to medication storage, confidential records, or secure spaces. Designated staff members should assist first responders while protecting privacy and security to the extent possible during crisis response. Staff Emergency Responsibilities. Unlock exits during evacuations. Provide access codes to emergency responders. Secure valuables and confidential materials when time permits. Restore normal security protocols after emergency resolution.", "Notifying Families & Authorized Representatives. When Notifications Are Required. Contact families and authorized representatives when emergencies result in evacuation, service disruption, injuries, significant property damage, or any situation affecting the individual's health, safety, or service delivery. Documentation Requirements. Document all notification attempts and actual contacts, including date, time, person contacted, information shared, and any questions or concerns raised. Record unsuccessful attempts and continue trying until reaching authorized contacts. Program Coordinators or designated administrative staff typically make family notifications. Direct care staff may make initial contact when supervisors aren't immediately available, but should follow up with leadership afterward. Who Makes Contact. Timely family notification reduces anxiety, enables family support, and maintains trust. Be factual and calm when communicating, share what you know without speculation, and provide clear information about next steps and how to reach staff with questions.", "Emergency Care & Service Modifications. Modifying Service Delivery. Emergencies may require temporary changes to scheduled services, activities, or routines. Staff should prioritize safety while maintaining as much normalcy as possible. Communicate changes clearly to individuals receiving services and document all modifications. Protecting Confidential Information. Even during emergencies, protect individual privacy and confidential records. Secure files before evacuating if time permits. Share information with emergency responders only when necessary for safety or medical care. Medication Management. During evacuations, bring emergency medication supplies, including rescue medications for individuals with seizures, severe allergies, or other critical needs. Maintain medication security and proper storage conditions even in temporary locations. Emergency Transportation. When evacuating to alternative locations, arrange safe transportation for all individuals. Ensure vehicles accommodate wheelchairs or other mobility equipment. Never leave individuals without transportation or supervision. Service Continuity: Our goal is resuming normal services as quickly as safety permits. Administrative staff will communicate service status, reopening plans, and any temporary modifications to all stakeholders."]}, {"id": "doc", "title": "Clinical Documentation: Progress Notes, Timeliness & the Client's Book", "minutes": 30, "orientation": true, "deck": "doc", "slides": 10, "qs": [{"q": "Why is clinical documentation important in DD/IDD services?", "o": ["It is only used for marketing purposes", "It serves as a legal record, supports care continuity, and ensures accountability", "It replaces the Individual Service Plan (ISP)", "It is optional if verbal updates are provided"], "a": 1, "s": 0}, {"q": "Every progress note must include which of the following?", "o": ["Staff personal opinions about the client", "Only the client's diagnosis", "Date, time, duration, and service type", "Family financial information"], "a": 2, "s": 0}, {"q": "Which statement best describes acceptable documentation?", "o": ["“Client did well today.”", "“Session was productive.”", "“Client demonstrated improved coping skills with success during redirection activities.”", "“Client behaved normally.”"], "a": 2, "s": 0}, {"q": "Progress notes must directly reference:", "o": ["The previous staff member's opinion", "The staff schedule", "The ISP goals and objectives", "Billing totals only"], "a": 2, "s": 0}, {"q": "Progress notes should be completed within:", "o": ["72 hours", "48 hours", "24 hours", "By the end of the month"], "a": 2, "s": 0, "fixed": true}, {"q": "Which of the following is considered poor documentation practice?", "o": ["Using measurable behavioral language", "Copying and pasting the same note repeatedly", "Including client responses to interventions", "Referencing the ISP objective"], "a": 1, "s": 0}, {"q": "Why should staff review recent progress notes before providing services?", "o": ["To shorten documentation time", "To avoid duplication and understand current client status", "To replace reviewing the ISP", "To create longer progress notes"], "a": 1, "s": 0}, {"q": "What information may be found in the Client's Book?", "o": ["ISP goals and objectives", "Assessment updates", "Progress note history", "All of the above"], "a": 3, "s": 0, "fixed": true}, {"q": "Documentation completed several days after services were provided may reduce accuracy.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Staff may document services before the session occurs if they know the schedule in advance.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Measurable and observable language should be used in progress notes.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Reviewing the Client's Book before each session helps improve service delivery and care coordination.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Leaving a progress note unsigned is acceptable if the information is accurate.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Which list contains four required elements of a progress note?", "o": ["Date, time, duration, and service type; client presentation; the ISP goal and objective; the client's response to intervention", "Staff opinion; the weather; family finances; the client's diagnosis", "Billing total; staff schedule; the client's address; the previous staff member's opinion", "The client's favorite foods; staff initials only; the shift length; the room number"], "a": 0, "s": 2}, {"q": "Why is timely documentation important in DD/IDD services?", "o": ["Records stay accurate while memory is fresh, and it supports client safety and prevents billing denials", "It lets staff skip reviewing the Client's Book", "It makes notes longer", "It isn't important if the service happened"], "a": 0, "s": 2}], "short": "Clinical Documentation", "sections": ["Multiple choice", "True or false", "Short answer"], "nar": ["Clinical Documentation Training: Progress Notes, Timeliness, and the Client's Book. CLINICAL STAFF TRAINING. Implemented by Laugh & Live, LLC. DOCUMENTATION COMPLIANCE.", "CHAPTER 1. Why Clinical Documentation Matters. At Laugh & Live, LLC, thorough and timely documentation is the backbone of quality, accountable, person-centered care. Every note you write is a legal record and a communication tool for the entire care team. Legal Record. Documentation is a binding account of services provided and decisions made. Care Continuity. Accurate notes ensure every team member can support the individual effectively. Accountability. Demonstrates that services align with each client's individualized plan of care.", "CHAPTER 2. Core Elements of a Progress Note. Every progress note at Laugh & Live, LLC must capture what happened, how the client responded, and what it means for their progress. Vague or generic notes are not acceptable — specificity is essential. Date, Time & Duration. Document when the service occurred, how long it lasted, and the service type delivered. Goals & Objectives Addressed. Clearly identify which specific goals and objectives from the Individual Service Plan were targeted. Client Presentation. Describe the client's mood, behavior, affect, and engagement level during the session. Response & Progress. Describe the client's response to interventions and measurable progress toward identified goals.", "CHAPTER 2 — LINKING TO THE PLAN. Connecting Notes to Goals & Objectives. Every note must reflect the client's Individual Service Plan (ISP). Reference the Goal. Name the specific goal from the ISP that the session targeted — do not write in vague generalities. Describe the Objective. State the measurable objective addressed and what the client did to work toward it during the session. Report Measurable Progress. Use observable, behavioral language — percentages, frequencies, or descriptive outcomes — to reflect movement toward the objective. Plan Next Steps. Briefly note the clinical plan for the next session or any adjustments needed to the service approach. Example: Instead of writing \"Client did well today,\" write: \"Client identified 3 coping strategies related to Goal 2, Objective 1 of the ISP. Client demonstrated improved affect regulation with 80% success rate, up from 60% last session.\".", "CHAPTER 3 — TIMELINESS. Timely Documentation: Why It Cannot Wait. Documentation completed late is documentation that loses accuracy, creates compliance risk, and undermines care quality. At Laugh & Live, LLC ,, timeliness is a non-negotiable standard. Progress notes are due on Sundays at 5:00PM to the QDDP@laughandlivellc.com email if you are providing supportive in home services. Or QDDPii@laughandlivellc.com if you are providing sponsor residential supports. Complete Notes Promptly. Progress notes must be completed within 24 hours of the service being delivered — not at the end of the week. Memory Fades Quickly. Delaying documentation leads to inaccurate, incomplete records that do not reflect what actually occurred during the session. Client Safety Is at Stake. Other team members rely on timely notes to make informed decisions. Late documentation can cause gaps in care coordination. Billing & Compliance Depend on It. Late or missing notes can result in billing denials, audit failures, and regulatory sanctions for Laugh & Live, LLC.", "CHAPTER 3 — WHAT TO AVOID. Common Documentation Errors to Avoid. What NOT to Write. Vague language: \"Client did well\" or \"Session was productive\". Copy-pasting the same note from session to session. Leaving out the specific goal or objective addressed. Personal opinions or judgmental language about the client. Leaving notes unsigned or undated. Documenting services before they occur. Documentation is a reflection of your professional judgment — make it count every time. What GOOD Notes Include. Client identified 3 coping strategies related to Goal 2, Objective 1 of the ISP Client demonstrated improved affect regulation with 80% success rate, up from 60% last session. Specific, observable, behavioral language. Direct reference to the ISP goal and objective number. The client's verbal and behavioral responses. Measurable indicators of progress or regression. Clinician signature, credentials, and date/time. A brief forward-looking clinical plan.", "CHAPTER 4 — THE CLIENT'S BOOK. Assessment Documentation & the Client's Book. The client's book is the comprehensive record of each individual's clinical history, assessment findings, and active service plan. Every direct care staff member is responsible for reviewing and understanding this documentation before and during service delivery. Intake & Psychosocial Assessment. Individual Service Plan (ISP). Contains the goals, objectives, timelines, and responsible parties that guide every service interaction. Establishes the client's background, presenting needs, history, and initial clinical picture at the time of admission. Progress Notes History. Assessment Updates. Reassessments and updated clinical summaries that capture changes in the client's functioning and service needs over time. The cumulative record of all services delivered, responses observed, and progress made toward the plan.", "CHAPTER 4 — REVIEWING THE CLIENT'S BOOK. How to Review Assessment Documentation. Before every service interaction, staff should be familiar with the following sections of the client's book: Review the Active ISP Goals & Objectives. Know the current goals before the session begins. You cannot write an accurate progress note about goals you have not reviewed. Read Recent Progress Notes. Review what other staff documented in the last 2–3 sessions to understand where the client currently stands and avoid duplication. Check for Assessment Updates. Note any recent changes to the clinical assessment — new diagnoses, crisis episodes, or significant life events — that affect your service approach. Note Any Alerts or Special Instructions. Review safety plans, behavioral guidelines, or clinician directives noted in the client's book before beginning the session.", "IMPORTANT. Consequences of Poor Documentation. What Is at Risk. Poor, late, or incomplete documentation can trigger billing denials, regulatory audits, loss of licensure, and — most critically — real harm to the individuals we serve when the care team lacks accurate information. Every documentation failure is a potential gap in a client's safety net. If it wasn't documented, it didn't happen — and it cannot be defended. Risk to Clients. Gaps in documentation mean gaps in care — missed triggers, untracked regressions, and uninformed handoffs. Risk to Laugh & Live. Regulatory sanctions, audit failures, revenue loss, and damage to Laugh & Live, LLC’s reputation as a trusted provider. Risk to Staff. Incomplete notes expose clinicians to professional liability, disciplinary action, and credential jeopardy.", "SUMMARY. Summary & Documentation Standards. Clinical documentation at Laugh & Live, LLC is a professional, ethical, and legal responsibility. Write progress notes that are specific, timely, and directly tied to each client's goals and objectives. Review the client's book before every session. Questions? Contact your Clinical Supervisor or the Compliance Officer for guidance on documentation standards at any time. Be Specific. Reference goals, objectives, and observable behaviors — every time. Know the Book. Review assessment documentation before every client interaction. Thank you for your commitment to clinical excellence and quality documentation at Laugh & Live, LLC! Documentation Checklist. Note completed within 24 hours of service. Date, time, duration, and service type recorded. Specific ISP goal and objective referenced. Client presentation described in behavioral terms. Measurable progress or response documented. Plan for next session included. Note signed with credentials and date. Be Timely. Complete notes within 24 hours — accuracy depends on it."]}, {"id": "pc", "title": "Person-Centeredness", "minutes": 25, "orientation": true, "deck": "pc", "slides": 10, "qs": [{"q": "Person-centeredness focuses on:", "o": ["Staff routines", "Agency convenience", "Individual needs, preferences, and values", "Policies only"], "a": 2, "s": 0}, {"q": "Supporting individual choice means:", "o": ["Staff make decisions for the person", "Individuals are encouraged to follow routines only", "Staff honor the person’s right to make decisions", "Choices are limited for efficiency"], "a": 2, "s": 0}, {"q": "Individualized supports are:", "o": ["The same for every person", "Tailored to each individual’s goals and preferences", "Based only on staff judgment", "Focused only on medical needs"], "a": 1, "s": 0}, {"q": "Trust and rapport improve when individuals:", "o": ["Feel respected and heard", "Follow instructions without question", "Avoid expressing preferences", "Depend fully on staff"], "a": 0, "s": 0}, {"q": "Dignity of risk means:", "o": ["Eliminating all risks from daily life", "Allowing informed choices and reasonable risks", "Preventing independence", "Restricting opportunities"], "a": 1, "s": 0}, {"q": "Community participation includes:", "o": ["Staying inside the home", "Avoiding social interaction", "Supporting involvement in jobs, events, and relationships", "Limiting public access"], "a": 2, "s": 0}, {"q": "Respecting communication style means:", "o": ["Expecting everyone to communicate verbally", "Ignoring gestures or devices", "Learning and honoring how each person communicates", "Correcting communication differences"], "a": 2, "s": 0}, {"q": "Implementing the ISP with fidelity means:", "o": ["Following goals and supports as written", "Ignoring preferences when busy", "Changing plans without discussion", "Focusing only on paperwork"], "a": 0, "s": 0}, {"q": "Active listening involves:", "o": ["Giving full attention without judgment", "Interrupting often", "Multitasking during conversations", "Redirecting the topic quickly"], "a": 0, "s": 0}, {"q": "Person-centeredness is:", "o": ["Only the responsibility of supervisors", "Optional depending on staffing", "Everyone’s responsibility", "A yearly task only"], "a": 2, "s": 0}, {"q": "Every person is considered the expert of their own life.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Community participation is a core part of meaningful daily life.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Staff should do everything for individuals to avoid mistakes.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Person-centeredness includes respecting preferences and communication styles.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Ongoing learning and self-reflection strengthen person-centered practice.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "An individual wants to attend a community event that staff are unfamiliar with. How should staff respond using person-centered principles?", "o": ["Listen to their interests, support safe participation, help plan transportation or resources if needed, and encourage the choice", "Suggest they stick with activities staff already know", "Only allow it if a staff member has been there before", "Ask their family to decide"], "a": 0, "s": 2, "p": 2}, {"q": "A person communicates mainly through gestures and a communication device. What should staff do to support effective communication?", "o": ["Learn their communication style, use the device appropriately, pay attention to gestures, and include their voice in decisions and planning", "Ask only yes-or-no questions", "Speak with their family instead", "Put the device away so they practice speaking"], "a": 0, "s": 2, "p": 2}, {"q": "An individual prefers a different daily routine than what staff usually schedule. How should this be handled?", "o": ["Respect their preferences, adjust the routine when possible, and support choices that reflect their goals and lifestyle", "Keep the usual schedule so the day runs smoothly", "Let them change it only on weekends", "Document it as a behavior concern"], "a": 0, "s": 2, "p": 2}, {"q": "Which is an example of supporting dignity of risk in everyday life?", "o": ["Supporting someone in trying a new activity or preparing their own meal with supervision", "Doing all their cooking so they never get burned", "Keeping them home whenever there is any risk", "Choosing their activities for them"], "a": 0, "s": 2, "p": 2}, {"q": "How can staff promote independence while still providing support?", "o": ["Encourage skill-building, give support only when needed, let them make choices, and avoid doing tasks they can do themselves", "Do tasks for them so they’re done right", "Help with everything to stay safe", "Leave them to do everything alone with no support"], "a": 0, "s": 2, "p": 2}], "sections": ["Multiple choice", "True or false", "Scenarios"], "links": {"5": {"url": "https://www.youtube.com/watch?v=ikwmiUWcXEk", "label": "Open Video 1 on YouTube"}}, "nar": ["Person-Centeredness Training. Laugh & Live, LLC. Staff are not just 'watching' individuals — we are actively supporting outcomes, preferences, independence, and meaningful daily life. This training covers: Supporting Individual Choice · Respecting Preferences · ISP Implementation · Community Participation · Communication Style · Dignity of Risk · Individualized Supports.", "FOUNDATION. What Is Person-Centeredness? Person-centeredness is a guiding philosophy that places each individual's needs, preferences, and values at the very core of care and support. It recognizes each person as the expert of their own life — staff are not just watching, but actively supporting outcomes, independence, and meaningful daily life. Supporting Individual Choice. Staff actively support the choices individuals make about their own lives, honoring their right to decide — even when it differs from what staff would choose. Individualized Supports. No two people are the same. Supports are tailored to each person's unique circumstances, goals, and aspirations — never a one-size-fits-all approach. Respecting Preferences. Every person has unique likes, dislikes, routines, and ways of living. Staff learn and honor those preferences every single day.", "WHY IT MATTERS. Why Person-Centeredness Matters at Laugh & Live, LLC. ISP Implementation. The Individual Support Plan is the roadmap for each person's life. Staff implement ISPs with fidelity — ensuring every goal reflects the person's actual voice, vision, and preferences. This is not paperwork; it is a commitment to the individual. Trust & Rapport. When people feel truly seen, heard, and respected, trust deepens. Person-centered care builds the foundation for meaningful, lasting relationships between staff and the individuals they support. Better Outcomes. When staff go beyond watching and actively support goals, preferences, and independence, individuals experience real growth, stronger community connections, and a higher quality of life.", "CORE PRINCIPLES. Core Principles of Person-Centeredness. Dignity of Risk. Every person has the right to take reasonable risks and make their own choices. Staff support informed decision-making — not overprotection. Removing all risk removes autonomy. Individualized Supports. Supports are designed around each person's unique circumstances, preferences, and aspirations. Staff never apply a generic plan — every approach is tailored to the individual. Communication Style. Every person communicates differently — through words, gestures, devices, or behavior. Staff learn and honor each person's unique communication style to ensure they are truly heard and included. Community Participation. Staff actively open doors to community life — jobs, events, relationships, and belonging. Community participation is not optional; it is a core part of meaningful daily life.", "IMPACT STORIES. Real-Life Impact: Supporting Meaningful Daily Life. Person-centered approaches transform lives when staff move beyond watching and actively support outcomes, preferences, and independence. These real-life examples show what it looks like in practice. Community Participation in Action. A man who had previously been isolated began attending community events and pursuing a job interest after staff actively supported his goals — not just his schedule. By honoring his preferences and facilitating community participation, staff helped him build real connections and independence. When staff support outcomes — not just presence — individuals experience real independence, community belonging, and a meaningful daily life. — Laugh & Live, LLC. Communication Style Honored. A woman who communicated through gestures and a communication device was finally understood and included in her own ISP planning when staff took time to learn and respect her unique communication style. Her voice now shapes her own support plan.", "WATCH & REFLECT. Video 1: Changing Minds. An Introduction to Person-Centered Care. This video explores how shifting to person-centered care fundamentally changes relationships between providers and the people they serve. As you watch, think about what it means to support someone's independence, preferences, and daily life — not just be present with them. _____________. Reflection Prompt: As you watch, consider — how does this approach differ from simply 'watching' someone? What does it look like to actively support outcomes and meaningful daily life?", "STAFF ROLE. Your Role Goes Far Beyond Watching. Direct support staff are the most important people in an individual's daily life. Your role is active, purposeful, and deeply impactful — not passive supervision. Staff are not babysitters or bystanders. You are a professional who supports outcomes, honors preferences, and enables meaningful daily life. Supporting Outcomes. You help individuals work toward the goals in their ISP and the life they want to live. Every interaction is an opportunity to move someone closer to their goals. Honoring Preferences. You learn what each person likes, dislikes, and values — and you act on it every single day. Preferences are not suggestions; they are the foundation of your support. Promoting Independence. You step back when appropriate, encourage skill-building, and resist doing things for people that they can do themselves. Independence is built, not given. Respecting Communication Style. You learn how each person communicates — words, gestures, devices, or behavior — and you meet them where they are. Every person deserves to be heard in their own way. Implementing the ISP with Fidelity. You carry out the Individual Support Plan with fidelity, ensuring each goal is actively pursued and each person's voice is reflected in their daily support. Facilitating Community Participation. You open doors to community life — jobs, events, relationships, and belonging. Community participation is a right, not a privilege. \"You are not a babysitter. You are not just watching. You are a support professional — and that makes all the difference.\" — Laugh & Live, LLC.", "DAILY PRACTICE. How to Practice Person-Centeredness Daily. Staff are not just present — they are active supporters of outcomes, preferences, independence, and meaningful daily life. Here are six daily practices that bring all seven person-centered principles to life. Listen Actively & Honor Communication Style. Give your full attention without judgment. Learn how each person communicates — words, gestures, devices, or behavior — and meet them where they are. Every person deserves to be truly heard. Respect Preferences Every Day. Learn what each person likes, dislikes, and values — and act on it consistently. Preferences shape daily routines, activities, meals, relationships, and everything in between. Facilitate Community Participation. Actively support involvement in community life — jobs, events, friendships, and belonging. Don't wait for opportunities; create them. Community participation is a right. Support Individual Choice. When someone makes a choice, your role is to support it — not redirect it. Honor their right to decide, even when it's different from what you'd choose. Choice is at the heart of person-centeredness. Implement the ISP with Fidelity. Carry out each Individual Support Plan with intention and accuracy. Every goal in the ISP reflects the person's voice — your job is to actively pursue those goals every shift. Honor Dignity of Risk. Support informed decision-making, not overprotection. Every person has the right to take reasonable risks and grow through their own choices. Your role is to inform and support — not to eliminate all risk.", "NAVIGATING BARRIERS. Overcoming Challenges. Person-centered care isn't always easy. Here are common challenges staff face — and how to navigate them while keeping the individual's voice and goals at the center. Safety vs. Autonomy. Find the balance between protecting well-being and honoring individual choice. Dignity of risk means supporting informed decisions — not eliminating all risk. Systemic Constraints. Advocate creatively within policies and ISP frameworks while keeping the person's voice front and center. Document and escalate when barriers prevent person-centered practice. Continuous Growth. Commit to ongoing learning and self-reflection. Person-centeredness is a practice, not a checklist — it grows stronger over time.", "Our Commitment to Person-Centered Care. Every member of the Laugh & Live, LLC team plays a vital role in fostering environments where people feel heard, valued, and empowered to lead their own lives. Person-centeredness is not passive — it is active, intentional, and deeply meaningful. Staff are not just watching. We are supporting outcomes, honoring preferences, implementing ISPs, facilitating community participation, respecting communication styles, upholding dignity of risk, and providing individualized supports. Every Role Matters. From direct support staff to leadership — person-centeredness is everyone's responsibility, every shift, every interaction. It is not a task to complete; it is a way of showing up. Lead with Heart. Let's commit to making person-centeredness the foundation of all we do — every day, for every person we serve at Laugh & Live, LLC. \"The most powerful thing we can do is show up — not just to be present, but to truly support the person in front of us.\" — Laugh & Live, LLC. All 7 Principles in Action. Supporting individual choice, respecting preferences, ISP implementation, community participation, communication style, dignity of risk, and individualized supports — these are not checkboxes. They are commitments."]}, {"id": "hcbs", "title": "Home & Community-Based Services (HCBS)", "minutes": 30, "orientation": true, "deck": "hcbs", "slides": 13, "qs": [{"q": "HCBS supports individuals to live in:", "o": ["Institutional facilities only", "Community-integrated settings", "Hospitals and nursing homes only", "Isolated environments"], "a": 1, "s": 0}, {"q": "Which HCBS principle gives individuals the right to decide their daily routines and goals?", "o": ["Privacy", "Dignity", "Choice and Autonomy", "Documentation"], "a": 2, "s": 0}, {"q": "Freedom from coercion and restraint means:", "o": ["Using threats to gain compliance", "Restricting activities for convenience", "Supporting individuals without pressure or unnecessary restrictions", "Limiting communication access"], "a": 2, "s": 0}, {"q": "Privacy in HCBS includes:", "o": ["Sharing information openly with others", "Respecting personal space and confidentiality", "Allowing staff to enter rooms anytime", "Ignoring personal boundaries"], "a": 1, "s": 0}, {"q": "Rights modifications may only happen when:", "o": ["Staff prefer stricter rules", "Health or safety requires it", "Families request permanent restrictions", "Documentation is unavailable"], "a": 1, "s": 0}, {"q": "Which of the following is an example of community integration?", "o": ["Keeping individuals separated from community activities", "Allowing participation in community events and relationships", "Restricting access to public places", "Limiting communication with others"], "a": 1, "s": 0}, {"q": "DSPs should:", "o": ["Make decisions for individuals", "Offer meaningful choices and respect preferences", "Control all routines", "Avoid community participation"], "a": 1, "s": 0}, {"q": "Which right includes access to meals, visitors, and communication?", "o": ["Freedom from restraint", "Community integration", "Access to food, visitors, communication, and activities", "Documentation compliance"], "a": 2, "s": 0}, {"q": "A rights modification must be:", "o": ["Permanent", "Undocumented", "Time-limited and reviewed regularly", "Based on staff convenience"], "a": 2, "s": 0}, {"q": "Person-Centered Planning places:", "o": ["Staff at the center of decisions", "The individual at the center of planning", "Families in total control", "Policies above preferences"], "a": 1, "s": 0}, {"q": "HCBS promotes meaningful participation in community life.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "DSPs may impose restrictions without team approval.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Privacy and dignity should be respected in all interactions.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Rights modifications must use the least restrictive option possible.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Documentation should include choices made and rights supported.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "A DSP decides not to allow an individual to attend a community event because it would take too much staff time. Is this appropriate under HCBS?", "o": ["No. Community integration is a protected right, and restrictions can’t be based on staff convenience", "Yes. Staff time comes first", "Yes, as long as the DSP writes it down", "Yes, if it only happens once"], "a": 0, "s": 2, "p": 2}, {"q": "During planning, an individual says they want to choose their own meals and activities. How should staff respond using person-centered principles?", "o": ["Respect their preferences, offer choices, and support their decisions about meals and activities", "Explain that staff plan the meals and activities", "Let them choose only on weekends", "Ask their family what they should eat"], "a": 0, "s": 2, "p": 2}, {"q": "A staff member enters a person’s room without knocking. Which HCBS rights are affected?", "o": ["Privacy and dignity: staff should respect personal space and knock before entering", "Freedom from restraint", "Community integration", "No rights are affected"], "a": 0, "s": 2, "p": 2}, {"q": "An individual has a medically documented choking risk requiring food restrictions. What steps must be followed before implementing this modification?", "o": ["Base it on documented health or safety needs, include it in the person’s plan, get team approval, keep it time-limited and reviewed, and use the least restrictive option", "The DSP can start it right away if they think it’s safer", "Ask the family and make it permanent", "Remove all solid food without documenting it"], "a": 0, "s": 2, "p": 2}, {"q": "Why is accurate documentation important in HCBS services?", "o": ["It shows how rights were supported, records choices and services, protects individuals and DSPs, and ensures compliance with HCBS standards", "It’s mainly for billing", "It’s only needed when something goes wrong", "It replaces talking with the person"], "a": 0, "s": 2, "p": 2}], "short": "HCBS", "sections": ["Multiple choice", "True or false", "Scenarios"], "nar": ["LAUGH & LIVE, LLC. Home and Community-Based Services (HCBS): Empowering Individuals with Developmental Disabilities. A Laugh & Live, LLC Training on HCBS Rights and Principles. This training covers the seven core HCBS rights that support people with developmental disabilities to live meaningful lives in their communities: community integration, choice and autonomy, privacy, dignity, freedom from coercion and restraint, access to food, visitors, communication, and activities, and modifications of rights when health or safety requires it.", "Understanding HCBS: A Framework for Community Living. Community Integration. HCBS supports full participation in community life, not isolated institutional settings. Dignity. Every person deserves to be treated with respect in all interactions and settings. Choice & Autonomy. Individuals have the right to decide where they live, who supports them, and how they spend their time. Freedom from Coercion & Restraint. Supports must never rely on pressure, threats, or unnecessary physical restriction. Privacy. Every person has the right to personal space, confidentiality, and control over their own information. Access to Food, Visitors, Communication & Activities. People have the right to the things that make life meaningful and connected. Modifications of Rights. Rights may only be modified when health or safety requires it, and only with proper documentation and review. The core principles of HCBS work together to support meaningful community living. At Laugh & Live, LLC, we emphasize all 7 rights to protect freedom from coercion and restraint while supporting access to food, visitors, communication, activities, and any rights modifications only when health or safety requires it.", "LAUGH & LIVE, LLC. The Department of Behavioral Health and Developmental Services (DBHDS). Leadership. DBHDS oversees HCBS standards so individuals can live, work, and participate in the community through community integration and choice and autonomy. Protections. DBHDS enforces privacy, dignity, and access to food, visitors, communication, and activities as protected rights. Foundation. DBHDS ensures freedom from coercion and restraint and requires that rights modifications are only made when health or safety demands it. DBHDS is the regulatory backbone for HCBS, setting standards, enforcing protections, and supporting consistent, person-centered care across providers and settings. Laugh & Live, LLC operates under these DBHDS standards to help ensure respectful, compliant, community-based support.", "LAUGH & LIVE, LLC. Understanding Waiver Programs. CL Waiver. Funds individualized supports that promote choice, autonomy, privacy, and dignity. Daily Living Supports. Ensures access to food, visitors, communication, and activities as protected rights. DD Waiver. Supports community integration through access to activities, relationships, and meaningful participation. Rights Protections. Upholds freedom from coercion and restraint, and ensures rights modifications are only made when health or safety requires it. Laugh & Live, LLC uses waiver programs to support all 7 HCBS rights by promoting community integration, choice, autonomy, privacy, dignity, access to daily needs, and freedom from coercion or restraint. These supports help create respectful, person-centered services that protect rights while building meaningful participation in everyday life.", "LAUGH & LIVE, LLC. Person-Centered Planning: The Heart of HCBS. Individual at the Center. The person leads the planning process, directing goals, supports, and community integration. Choice & Autonomy. PCP ensures the person has real say in daily life, routines, and decisions. Privacy & Dignity. PCP protects personal information and ensures every interaction is respectful and dignified. Freedom from Coercion & Restraint. Planning must be free from pressure, threats, or unnecessary restrictions. Access to Food, Visitors, Communication & Activities. Plans ensure access to the things that make life meaningful.", "LAUGH & LIVE, LLC. The Role-Playing Approach to PCP. Community Integration in Practice. Role-play supporting someone to access community activities, events, and relationships of their choosing. Choice, Autonomy, Privacy & Dignity. Practice open-ended questions, following the person's lead, knocking first, and speaking respectfully. Access to Food, Visitors, Communication & Activities. Use scenarios about meals, visitors, phone calls, and community outings to remove barriers. Coercion, Restraint & Rights Modifications. Practice recognizing pressure or restrictions, de-escalating safely, and documenting any needed modifications. At Laugh & Live, LLC, role-playing helps DSPs build confidence in supporting all 7 HCBS rights through everyday scenarios. It strengthens person-centered practice by making community integration, choice, autonomy, privacy, dignity, access, and freedom from coercion feel practical and respectful.", "LAUGH & LIVE, LLC. The DSP's Critical Role in HCBS. At Laugh & Live, LLC, DSPs support HCBS rights through everyday actions that remove barriers, protect rights, and strengthen self-determination. Community Integration. Help people access community settings, activities, and relationships so they can participate fully and build natural supports. Choice and Autonomy. Offer real options, listen first, and follow the person's preferences. Do not make choices for them unless legally authorized. Privacy and Dignity. Respect personal space, information, and boundaries. Knock first, speak respectfully, and protect confidentiality. At Laugh & Live, LLC, DSPs turn HCBS rights into daily practice by promoting inclusion, preserving dignity, supporting choice, preventing coercion, and removing unnecessary barriers. Freedom from Coercion and Restraint. Recognize pressure, threats, and unnecessary restrictions as rights concerns. Speak up early and report concerns right away. Access to Food, Visitors, Communication, and Activities. Remove barriers to meals, visitors, calls, messages, community events, and preferred activities in safe, person-centered ways. Modifications of Rights. Support approved, individualized modifications as written and monitor for fairness, effectiveness, and clarity.", "COMMUNITY INTEGRATION. Promoting Community Integration. Community integration is a protected HCBS right, not just a program goal. At Laugh & Live, LLC, our role is to remove barriers, honor choice, and support meaningful participation so people can belong, connect, and live fully in their communities. HCBS RIGHT. LAUGH & LIVE, LLC. Beyond Physical Presence. True integration means active participation, not just being present. Laugh & Live, LLC DSPs support meaningful belonging. Access to Activities & Communication. Individuals have the right to access community activities and communication tools of their choice. Choice in Community Life. Individuals choose where they go, who they spend time with, and how they engage. Community integration is a protected HCBS right — and at Laugh & Live, LLC, it is central to everything we do. Privacy and Dignity in Community Settings. Dignity and privacy extend into all community settings and interactions.", "LAUGH & LIVE, LLC. Choice, Autonomy, and Rights. Community Integration. Support meaningful participation in community life, not just physical presence. Access & Modifications. Remove barriers to food, visitors, communication, and activities. Support rights modifications only when health or safety requires it. Freedom from Coercion & Restraint. Recognize pressure or manipulation and intervene immediately. Never use threats or unnecessary restrictions. At Laugh & Live, LLC, these rights work together to support self-determination, meaningful choice, and a life directed by the individual. Choice & Autonomy. Follow the person's lead and respect their decisions about daily life, routines, and goals. Privacy. Safeguard personal information, respect boundaries, and knock before entering. Dignity. Use preferred names, speak respectfully, and honor each person's identity and worth.", "LAUGH & LIVE, LLC. Modifications of Rights: When Health or Safety Requires It. At Laugh & Live, LLC, understanding when and how rights may be modified is crucial for DSPs. Exception, Not the Rule. At Laugh & Live, LLC, rights modifications are rare, temporary, and used only as a last resort. Strict Criteria. They require a specific, documented health or safety risk that cannot be addressed another way. Key Principles. Individualized and specific to the person. Documented in the person's plan. Time-limited and regularly reviewed. Least restrictive option available. Agreed upon with the person and their team. Common Scenarios. Dietary restrictions for medical reasons. Supervised communication for documented safety concerns. Restricted visitor access for abuse or exploitation risk. DSPs Do Not Impose. At Laugh & Live, LLC, DSPs must never impose restrictions on their own. All modifications must be authorized by the team. At Laugh & Live, LLC, a rights modification is not a punishment — it is a carefully considered, temporary support measure implemented for the individual's well-being and safety. Temporary Measures. Rights are restored as soon as the concern is resolved and the modification is no longer needed.", "LAUGH & LIVE, LLC. Regulatory Compliance and Quality Monitoring at Laugh & Live, LLC. 100%. Service records at Laugh & Live, LLC must show how all 7 HCBS rights were supported in practice. 4x. Regular reviews check whether community integration, choice, privacy, dignity, access, and freedom from coercion are still being upheld. 24hrs. Serious rights concerns, including coercion, restraint, or access violations, must be reported promptly. 30+. Measures confirm community integration, choice, autonomy, privacy, dignity, access, and appropriate use of rights modifications. At Laugh & Live, LLC, regulatory compliance and quality monitoring protect all 7 HCBS rights every day by confirming that documentation, reviews, incident reporting, and quality checks support choice, privacy, dignity, access, community integration, freedom from coercion, and appropriate rights modifications. Documentation. Quarterly Reviews. Incident Reporting. Quality Indicators.", "LAUGH & LIVE, LLC. Documentation Best Practices at Laugh & Live, LLC. At Laugh & Live, LLC, documentation should do more than record services delivered—it should show how HCBS rights were supported in everyday practice. Clear, accurate notes help DSPs demonstrate choice, community access, privacy, dignity, and the least restrictive support possible. Documentation Area. Daily Notes. Community Integration Activities. Choice and Autonomy. Privacy and Dignity. Food, Visitors, Communication, and Activities. Freedom from Coercion and Restraint. Rights Modifications. What to Document. Services provided, the person's response, choices made, and any HCBS rights supports. Where the person went, what they did, who they connected with, and whether the activity was person-selected. Options offered, decisions made, refusals respected, and follow-up support provided. Use respectful, factual language and include only information needed for care. When access was supported, offered, requested, delayed, limited, or restricted—and why. Any use of de-escalation, redirection, restraint, threat, pressure, or concern about coercion. Authorized restriction, rationale, person-centered alternatives tried, time limit, and review date. Unusual events affecting health, safety, rights concerns, or any use of restraint. Advancement toward goals, independence, community participation, and reduced need for restrictions. Why It Matters. Shows what happened and how the person directed their day. Demonstrates access to the community and meaningful participation. Shows the person had real control over daily life. Protects the person's dignity and limits unnecessary disclosure. Documents whether rights were respected and any limitation was appropriate. Shows the person was supported safely and without unnecessary force or pressure. Confirms any modification is documented, reviewed, and not open-ended. Creates a formal record for follow-up, investigation, and protection. Tracks growth over time and shows whether supports are working. Good DSP Example. \"Chose to attend the community art class, selected lunch at the café, and declined the afternoon group activity.\". \"Went to the library and park with staff support; person chose the park route and spoke with two community members.\". \"Offered breakfast options and two outings; person chose oatmeal and a walk instead of shopping.\". \"Assisted with personal care privately and closed the door during support.\". \"Person requested a phone call after dinner; staff supported the call. Visitor request was delayed due to the person's medical appointment, then completed later.\". \"Used calm redirection and offered a quiet space; no restraint used. Incident report completed after escalating behavior.\". \"Food access modification approved by the team plan due to choking risk; less restrictive alternatives tried, effective through 8/30, review scheduled for 8/15.\". \"Person was blocked from leaving the room during escalation; incident report filed, supervisor notified, and follow-up review completed.\". \"Needed fewer prompts to choose meals and independently initiated a community outing this week.\". Watch For. Avoid vague statements like \"had a good day\" without details. Do not only note transportation—document the actual community experience. Avoid writing as if staff decided for the person. Do not include gossip, labels, or extra personal details unrelated to support. Always note the reason and any support provided; do not imply restrictions without explanation. Document facts only; include time, behavior, staff response, and notifications. Never document a restriction as permanent unless policy and authorization require it. Include exactly what happened, who was notified, and when. Use measurable details instead of general praise. Incident Reports. Progress Reports. At Laugh & Live, LLC, accurate documentation protects the individual by showing that rights, choices, privacy, and safety were honored. It also protects the DSP by creating a clear, factual record of the support provided, the reason for any restriction or modification, and the actions taken in response to concerns.", "LAUGH & LIVE, LLC. Putting It All Together: Empowering DSPs at Laugh & Live, LLC. Community Integration. At Laugh & Live, LLC, community access is a protected right. DSPs help people participate meaningfully—not just get there, but belong. Privacy and Dignity. Every interaction at Laugh & Live, LLC should protect privacy and dignity. Use respectful language and share only what is needed. Access to Food, Visitors, Communication, and Activities. At Laugh & Live, LLC, people have rights to the things that make life meaningful. If support, delay, or limits are necessary, explain and document them clearly. Laugh & Live, LLC DSPs, your everyday choices bring all 7 HCBS rights to life—community integration, choice and autonomy, privacy and dignity, freedom from coercion and restraint, access to food, visitors, communication, and activities, rights modifications, and every other right that supports a full, meaningful life. Keep leading with respect, consistency, and purpose so the people you support can thrive with greater safety, dignity, and self-direction. Choice and Autonomy. Person-centered support at Laugh & Live, LLC starts with choice. People should have real say in routines, preferences, goals, and daily decisions. Freedom from Coercion and Restraint. Laugh & Live, LLC support never relies on pressure, threats, or unnecessary restraint. Use calm, least-restrictive approaches and document concerns promptly. Rights Modifications. At Laugh & Live, LLC, any modification must be rare, authorized, time-limited, and reviewed. Record the rationale, supports tried, and review date."]}];
COURSES.forEach(c=>{c.qs.forEach(q=>{q.p=q.p||1});c.total=c.qs.reduce((t,q)=>t+q.p,0);c.short=c.short||c.title});
