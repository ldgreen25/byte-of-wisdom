<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laugh & Live Training · Demo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one app shell — top bar with role switch, then a single working view (list → course → test → certificate, or admin board). */
:root{
  --bg:#f6f4f7; --surface:#ffffff; --sunk:#efebf2; --ink:#221d27; --muted:#675f6e; --line:#e2dce7;
  --accent:#6b3f7a; --accent-ink:#ffffff; --accent-soft:#efe4f3;
  --good:#2c7a57; --good-soft:#e2f2ea; --warn:#9a6210; --warn-soft:#fbefd9; --bad:#b03636; --bad-soft:#f8e1e1; --idle:#5d6670; --idle-soft:#eceff2;
  --screen:#1d1922; --screen-ink:#f3eef6;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16131a; --surface:#201c25; --sunk:#1a171e; --ink:#eeeaf2; --muted:#a69daf; --line:#352f3c;
  --accent:#c99be0; --accent-ink:#1b1220; --accent-soft:#33263b;
  --good:#6cc89d; --good-soft:#1e3329; --warn:#e3aa52; --warn-soft:#3a2d17; --bad:#f08484; --bad-soft:#3d2121; --idle:#a8b1ba; --idle-soft:#2a2e33;
  --screen:#0e0c11; --screen-ink:#f3eef6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16131a; --surface:#201c25; --sunk:#1a171e; --ink:#eeeaf2; --muted:#a69daf; --line:#352f3c;
  --accent:#c99be0; --accent-ink:#1b1220; --accent-soft:#33263b;
  --good:#6cc89d; --good-soft:#1e3329; --warn:#e3aa52; --warn-soft:#3a2d17; --bad:#f08484; --bad-soft:#3d2121; --idle:#a8b1ba; --idle-soft:#2a2e33;
  --screen:#0e0c11; --screen-ink:#f3eef6; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.01em}
.brand span{font-size:.8rem;color:var(--muted);font-style:italic}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;max-width:100%}
.demo-note{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.86rem;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.demo{border-style:dashed;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-good{background:var(--good-soft);color:var(--good)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)} .c-idle{background:var(--idle-soft);color:var(--idle)}
.c-acc{background:var(--accent-soft);color:var(--accent)}

/* staff list */
.section-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.list{display:grid;gap:10px}
.course{display:grid;grid-template-columns:120px 1fr auto;gap:8px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 12px}
.course .thumb{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.course .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.course > div{min-width:0}
@media (max-width:640px){.course{grid-template-columns:1fr}.course .thumb{width:100%}}

/* player */
.back{margin-bottom:14px}
.player{background:var(--screen);color:var(--screen-ink);border-radius:14px;overflow:hidden}
.frame{position:relative;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}
.frame img{width:100%;height:100%;object-fit:contain;display:block}
.frame .k{position:absolute;left:12px;top:12px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;padding:3px 8px;border-radius:6px}
.bar{display:flex;gap:12px;align-items:center;padding:12px 16px;background:rgba(255,255,255,.06)}
.bar .play{width:40px;height:40px;border-radius:50%;border:0;background:var(--screen-ink);color:var(--screen);font-weight:700;flex:none}
.track{position:relative;flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.14);cursor:pointer;min-width:0}
.track .seen{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.28);border-radius:6px}
.track .pos{position:absolute;inset:0 auto 0 0;background:#d7b4ea;border-radius:6px}
.bar .sound{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--screen-ink);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;white-space:nowrap}
.bar .t{font-family:var(--f-mono);font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.watch{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}

/* quiz */
.q{border-top:1px solid var(--line);padding-block:14px}
.q:first-of-type{border-top:0}
.q legend{font-weight:600;margin-bottom:8px;padding:0}
.q .pts{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:6px}
.sec{font-family:var(--f-display);font-size:1rem;margin:18px 0 2px;padding-top:12px;border-top:2px solid var(--line)}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
fieldset{border:0;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--sunk)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.result{border-radius:12px;padding:16px 18px;margin-top:16px}
.result.pass{background:var(--good-soft)} .result.fail{background:var(--bad-soft)}

/* certificate */
.cert{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
.cert-in{border:2px solid var(--accent);border-radius:4px;padding:clamp(20px,5vw,44px);text-align:center;display:grid;gap:10px}
.cert-in .eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cert-in .name{font-family:var(--f-display);font-size:clamp(1.6rem,5vw,2.3rem);color:var(--accent)}
.cert-in .course-t{font-family:var(--f-display);font-size:1.2rem}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px;text-align:left}
.cert-grid div{border-top:1px solid var(--line);padding-top:6px}
.cert-grid span{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mail{font-size:.86rem;background:var(--sunk);border-radius:10px;padding:12px 14px;margin-top:14px}

/* admin */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.tile b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1.1}
.tile span{font-size:.82rem;color:var(--muted)}
.tile.alert{border-color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.88rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:.76rem;color:var(--muted);margin-top:3px}
table.board{min-width:1180px}
table.board th:first-child,table.board td:first-child{position:sticky;left:0;z-index:1;min-width:180px;background:var(--surface);box-shadow:1px 0 0 var(--line)}
table.board th:first-child{background:var(--sunk)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.86rem;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.log{display:grid;gap:8px}
.log div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.86rem}
.cat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cat .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cat .card .cimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;text-align:center;padding:6px;line-height:1.15}
.course .ph{font-size:.8rem}
.noslides{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:linear-gradient(135deg,#3a2546,#1d1922)}
.noslides b{font-family:var(--f-display);font-size:clamp(1.3rem,4vw,2rem)}
.noslides span{opacity:.8;max-width:44ch}
.vlink{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#c4302b;color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap}
.cat .card div{padding:12px 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.form label{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
.form input,.form select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:.95rem;color:var(--ink);width:100%}
.err{color:var(--bad);font-size:.85rem;margin:8px 0 0}
.foot{margin-top:36px;font-size:.78rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.track .pos{transition:width .2s linear}}
</style></head><body>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>Laugh &amp; Live, LLC · Training</b><span>Laugh everyday, Love beyond words</span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="View as">
        <button id="role-staff" aria-pressed="true">Employee</button>
        <button id="role-admin" aria-pressed="false">Administrator</button>
      </div>
      <label class="small muted" for="who">Signed in as</label>
      <select id="who"></select>
    </div>
  </header>
  <div class="demo-note">
    <span><b>Demo.</b> Real Laugh &amp; Live courses with sample staff. Lesson time runs at demo speed (1 second = 1 minute), and "Skip to end" is for demos only. No real emails are sent.</span>
    <button class="linkbtn" id="reset">Reset demo data</button>
  </div>
  <main id="app"></main>
  <p class="foot">Powered by Byte of Wisdom</p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const AGENCY_EMAIL="laughandlivellc@gmail.com";
const PASS=0.8, MAX_ATTEMPTS=3;
const TF=["True","False"];
// Each question: q text, o options, a correct index, p points, s section, fixed = keep option order
const COURSES=[{"id": "hr", "title": "Human Rights", "minutes": 30, "orientation": true, "deck": "hr", "slides": 12, "qs": [{"q": "Individuals receiving DD services maintain:", "o": ["Only limited legal rights", "Rights determined by staff", "All rights granted to any citizen", "Rights only during service hours"], "a": 2, "s": 0}, {"q": "Self-determination means:", "o": ["Staff make decisions for the individual", "Individuals have the right to make choices about their own lives", "Only family members make decisions", "Goals are selected by providers only"], "a": 1, "s": 0}, {"q": "Person-centered services are designed around:", "o": ["Staff schedules and convenience", "Provider preferences", "The individual's unique needs, preferences, and goals", "State inspections only"], "a": 2, "s": 0}, {"q": "Which of the following demonstrates dignity and respect?", "o": ["Speaking about the individual instead of to them", "Using labels to describe individuals", "Honoring personal choices and preferences", "Entering personal spaces without knocking"], "a": 2, "s": 0}, {"q": "Personal records and health information:", "o": ["May be shared freely among staff", "Are confidential and require proper consent or legal authority to share", "Can be discussed in public settings", "Do not require privacy protection"], "a": 1, "s": 0}, {"q": "Which of the following is considered neglect?", "o": ["Respecting individual choices", "Failing to provide necessary care or supervision", "Encouraging independence", "Supporting self-determination"], "a": 1, "s": 0}, {"q": "At Laugh & Live, LLC, staff who suspect abuse, neglect, or exploitation must:", "o": ["Wait for proof before acting", "Report it immediately", "Discuss it only with coworkers", "Ignore minor concerns"], "a": 1, "s": 0}, {"q": "Individuals have the right to:", "o": ["Be denied complaint assistance", "File complaints without retaliation", "Avoid all service planning", "Have complaints ignored"], "a": 1, "s": 0}, {"q": "Which role does the Human Rights Advocate perform?", "o": ["Approving payroll records", "Investigating rights complaints and protecting individual rights", "Scheduling transportation only", "Managing billing systems"], "a": 1, "s": 0}, {"q": "Rights in service delivery include:", "o": ["Restricting communication with family", "Denying community access", "Providing information in plain, understandable language", "Limiting participation in service planning"], "a": 2, "s": 0}, {"q": "Staff should knock before entering an individual's personal space.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Staff may monitor private phone calls without permission.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "All staff are mandatory reporters of suspected abuse, neglect, or exploitation.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Individuals have the right to participate in planning their own services.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Failure to report a rights violation may result in disciplinary action.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "You are preparing to assist an individual with personal care. What should you do to protect their privacy and dignity?", "o": ["Knock before entering, explain the care, respect personal space, keep it confidential, and communicate respectfully", "Work quickly and skip explaining so it's over sooner", "Leave the door open in case a coworker needs you", "Chat with a coworker about the person during care"], "a": 0, "s": 2, "p": 2}, {"q": "An individual tells you they want to file a complaint about services. What are your responsibilities?", "o": ["Help them file it, make sure it's reported, protect them from retaliation, and explain the process in plain language", "Tell them complaints usually don't change anything", "Ask them to wait until their family visits", "Handle it yourself without reporting it"], "a": 0, "s": 2, "p": 2}, {"q": "You witness another staff member speaking disrespectfully to an individual. What should you do?", "o": ["Follow policy: report it to your supervisor or the Human Rights Advocate, document your concerns, and protect the person's rights and dignity", "Ignore it unless it happens again", "Confront the coworker in front of the individual", "Post about it on social media"], "a": 0, "s": 2, "p": 2}, {"q": "A staff member suspects financial exploitation involving an individual's money. What must be done?", "o": ["Report it immediately, document observations, notify Liz Lewis and/or Human Rights Advocate Latoya Wilburn, and make sure the person is safe", "Collect proof for a few weeks before reporting", "Ask the coworker to quietly pay it back", "Bring it up at the next staff meeting"], "a": 0, "s": 2, "p": 2}, {"q": "Why is it important to involve the Human Rights Advocate when a serious rights concern or restriction comes up?", "o": ["They provide independent review, investigate concerns, approve required restrictions, and protect the person's rights", "They process payroll for the staff involved", "They are only needed if the family complains", "They decide which staff members are disciplined"], "a": 0, "s": 2, "p": 2}], "sections": ["Multiple choice", "True or false", "Scenarios"], "nar": ["Human Rights in Developmental Disability Services. A comprehensive training by Laugh & Live, LLC on protecting and respecting the rights of individuals receiving developmental disability services. Human Rights Advocate: Latoya Wilburn , In-Office POC: Liz Lewis.", "Training Agenda. Individual Rights. Understanding personal rights of individuals in DD services. Privacy. Protecting personal information and personal space. Complaint Process. How to file and resolve rights concerns. Today's training by Laugh & Live, LLC will help us strengthen our commitment to protecting individual rights in developmental disability services. For rights concerns, please contact Human Rights Advocate Latoya Wilburn or In-Office POC Liz Lewis as key resources. Dignity and Respect. Treating every person with honor and care. Freedom from Abuse, Neglect & Exploitation. Recognizing and preventing harm. Reporting Rights Violations. Mandatory reporting and procedures.", "Individual Rights. Legal & Civil Rights. Individuals maintain all rights granted to any citizen. A disability does not reduce these rights in any way. Person-Centered Services. Services must be tailored to the individual's unique needs, preferences, and goals — not the convenience of the provider. At Laugh & Live, LLC, we are committed to protecting the rights of people receiving DD services. These rights are inherent — not privileges to be earned — and must be upheld consistently by all staff members at all times. Self-Determination. The right to make choices about one's own life, including daily decisions, goals, and service preferences. Equal Treatment. The right to be treated fairly and without discrimination in all aspects of service delivery.", "Dignity and Respect. What Dignity & Respect Looks Like. Using the individual's preferred name at all times. Speaking directly to the person, not about them. Knocking before entering personal spaces. Maintaining a respectful tone in all interactions. Honoring personal choices and preferences. Avoiding language that demeans or labels. Dignity is not optional — it is a right that every person deserves at all times.", "Privacy Rights. Personal Privacy. Right to private bathing, toileting, and personal care. Staff must knock before entering. Respect personal space at all times. Confidentiality of Information. Personal records, health information, and service details are confidential. Information may only be shared with proper consent or legal authority. Communication Privacy. Right to send and receive private mail. Private phone calls without staff interference. Electronic communications without monitoring. At Laugh & Live, LLC, privacy is a fundamental right for individuals receiving DD services. Any privacy violation must be reported immediately to In-Office POC Liz Lewis or Human Rights Advocate Latoya Wilburn.", "Freedom from Abuse, Neglect & Exploitation. Every individual receiving services from Laugh & Live, LLC has the absolute right to be free from all forms of abuse, neglect, and exploitation. Types of Abuse. Physical, verbal, emotional, sexual, and psychological abuse are strictly prohibited. Any act that causes harm, fear, or distress is considered abuse. Staff Responsibility. All staff are mandatory reporters. If you witness or suspect abuse, neglect, or exploitation, you must report it immediately — silence is not an option. Neglect & Exploitation. Neglect includes failing to provide necessary care, supervision, or support. Exploitation includes misuse of an individual's money, property, or personal information. At Laugh & Live, LLC, protecting individuals from harm is everyone's responsibility. Any suspected abuse, neglect, or exploitation must be reported immediately to Latoya Wilburn, Human Rights Advocate, or Liz Lewis, In-Office POC.", "The Complaint Process. Individual Rights in the Complaint Process. Right to file a complaint about any rights violation. Right to receive assistance in filing a complaint. Right to a fair and timely review. Protection from retaliation for filing a complaint. Right to appeal any decision. Laugh & Live, LLC Provider Responsibilities. Acknowledge complaints within 24 hours. Investigate all complaints impartially. Resolve complaints within 10 working days. Maintain written complaint policies. To file a complaint or get assistance, contact: In-Office POC: Liz Lewis. Human Rights Advocate: Latoya Wilburn. At Laugh & Live, LLC, complaints involving rights violations must be reported to the appropriate oversight authority. Maintaining clear complaint procedures is essential to protecting individual rights and ensuring accountability.", "Reporting Rights Violations. Fundamental Principle: Freedom from Unnecessary Intervention. At Laugh & Live, LLC, all staff are required to report any suspected or confirmed rights violations. Reporting protects individuals and ensures accountability across our organization. What Must Be Reported. Any suspected or confirmed abuse, neglect, exploitation, rights violations, serious injuries, deaths, use of restraint or seclusion, or any incident that affects the health, safety, or rights of an individual. How to Report. Report immediately to In-Office POC Liz Lewis and/or Human Rights Advocate Latoya Wilburn. Document the incident in writing with date, time, description, and individuals involved. Protections for Reporters. Staff who report in good faith are protected from retaliation. Failure to report is a serious violation that may result in disciplinary action or legal consequences.", "Human Rights Advocate: Latoya Wilburn. Role of the Human Rights Advocate. Latoya Wilburn serves as the Human Rights Advocate (HRA) for Laugh & Live, LLC. The HRA is an independent resource who ensures the rights of individuals receiving DD services are protected. When to Involve the HRA. The HRA must be involved when a rights restriction is being considered, a complaint involves a serious rights violation, an individual requests HRA involvement, or when required by policy or regulation. HRA Responsibilities. The HRA reviews and approves any proposed rights restrictions, investigates rights complaints, advocates on behalf of individuals, and ensures Laugh & Live, LLC follows all applicable rights policies. At Laugh & Live, LLC, the Human Rights Advocate plays a critical role in protecting individual rights, ensuring concerns are addressed, and supporting a person-centered approach to services. Contacting Latoya Wilburn. Individuals, families, and staff may contact the Human Rights Advocate at any time. Contact information is posted in all service locations. The HRA is independent and confidential.", "Rights in Service Delivery. Core Service Rights. Use of preferred or legal name at all times. Access to public services and community activities. Protection from physical, verbal, sexual, and psychological harm. Private communication with family, friends, and others. Fair treatment without discrimination. Information about services in plain, understandable language. Right to refuse services or treatments. Right to participate in planning their own services. Rights must be actively supported — not just passively acknowledged. All Laugh & Live, LLC staff are responsible for upholding these rights every day.", "Human Rights Advocate Involvement. Notify In-Office POC. Contact Liz Lewis (In-Office POC) immediately to document and begin the review process. HRA Notification. Latoya Wilburn (Human Rights Advocate) is notified when the situation involves a rights restriction, serious complaint, or requires independent review. Identify the Concern. A rights concern, restriction, or violation is identified by staff, an individual, or a family member. Resolution & Follow-Up. The HRA documents findings, ensures resolution, and follows up to confirm rights are being upheld. HRA Review & Action. The HRA reviews the situation, meets with the individual if needed, and takes appropriate action to protect rights. Timely and thorough involvement of the Human Rights Advocate is a critical component of protecting individual rights at Laugh & Live, LLC. All staff must be familiar with when and how to involve Latoya Wilburn and the steps required to support the review process. Failure to involve the Human Rights Advocate when required is a serious policy violation at Laugh & Live, LLC and may result in disciplinary action.", "Our Commitment at Laugh & Live, LLC. At Laugh & Live, LLC, protecting and promoting human rights is at the heart of everything we do. It's not just policy — it's our culture. Know the Rights. Every staff member must understand the individual rights of the people we serve and apply that knowledge in every interaction, every day. Uphold the Rights. Actively create opportunities for dignity, choice, privacy, and freedom from harm in all aspects of service delivery. Report & Advocate. Speak up when you see potential violations. Contact Liz Lewis (In-Office POC) or Latoya Wilburn (Human Rights Advocate) immediately. Remember: At Laugh & Live, LLC, you are not just providing a service — you are supporting people to live full, self-determined lives with the same rights and dignity as anyone else."]}, {"id": "conf", "title": "Practices of Confidentiality", "minutes": 30, "orientation": true, "deck": "conf", "slides": 10, "qs": [{"q": "Confidentiality is considered the cornerstone of Laugh & Live, LLC's relationship with individuals because:", "o": ["It reduces paperwork", "It builds trust", "It increases profits", "It limits documentation"], "a": 1, "s": 0}, {"q": "Virginia regulation 12VAC35-105-440 requires protection of:", "o": ["Only paper records", "Only electronic records", "All portions of an individual's record", "Only verbal disclosures"], "a": 2, "s": 0}, {"q": "Who is responsible for maintaining confidentiality at Laugh & Live, LLC?", "o": ["Only supervisors", "Only clinical staff", "Staff members only", "Staff, contractors, interns, and volunteers"], "a": 3, "s": 0}, {"q": "Access to client records should be based on:", "o": ["Curiosity", "Friendship with the client", "Legitimate, documented need", "Years of employment"], "a": 2, "s": 0}, {"q": "Before sharing records in person, by phone, or electronically, staff must:", "o": ["Assume the person is authorized", "Verify identity and authorization", "Ask another employee", "Share only partial information"], "a": 1, "s": 0}, {"q": "Copies of client records:", "o": ["Are less sensitive than originals", "Can be made without approval", "Carry the same level of sensitivity as originals", "Do not require safeguards"], "a": 2, "s": 0}, {"q": "All copied records must be labeled:", "o": ["“Private”", "“Protected”", "“CONFIDENTIAL”", "“For Office Use Only”"], "a": 2, "s": 0}, {"q": "Sharing client information generally requires:", "o": ["Verbal permission", "Supervisor approval only", "Signed written consent", "Staff discretion"], "a": 2, "s": 0}, {"q": "Which situation may allow limited disclosure without written consent?", "o": ["Staff curiosity", "A genuine emergency or court order", "Requests from friends", "Social media inquiries"], "a": 1, "s": 0}, {"q": "If you suspect a confidentiality breach, you should:", "o": ["Ignore it", "Wait until the next meeting", "Notify your supervisor immediately", "Handle it privately without reporting"], "a": 2, "s": 0}, {"q": "Confidentiality protections apply from intake through record retention and destruction.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "It is acceptable to discuss client information in break rooms if clients are not present.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Unauthorized copying or distribution of records is considered a serious policy violation.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Confidentiality breaches can result in emotional harm, legal action, and reputational damage.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "When unsure about sharing information, employees should ask before acting.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "A staff member accidentally leaves client files unattended on a printer. What should they do immediately?", "o": ["Secure the records right away, prevent anyone else from seeing them, and notify a supervisor if necessary", "Leave them, since the printer is in a staff-only area", "Shred them and reprint later without telling anyone", "Ask a coworker to drop them at the front desk"], "a": 0, "s": 2, "p": 2}, {"q": "A coworker asks to view a client record out of curiosity because they “know the family.” What is the correct response?", "o": ["Deny access. Only authorized staff with a legitimate, documented need may view records", "Let them look, since they already know the family", "Let them look if no supervisor is around", "Summarize the record out loud instead of showing it"], "a": 0, "s": 2, "p": 2}, {"q": "Someone calls claiming to be authorized to receive client information. What must you do before sharing anything?", "o": ["Verify the caller's identity, confirm authorization, and make sure proper consent exists", "Share basic details, since they said they are authorized", "Share only the client's address", "Ask for their name, then share what they need"], "a": 0, "s": 2, "p": 2}, {"q": "Which are best practices for protecting digital client files?", "o": ["Use strong passwords, enable encryption, and log out when stepping away", "Share one login so coverage is easier", "Save copies to your personal phone as a backup", "Leave your screen unlocked during short breaks"], "a": 0, "s": 2, "p": 2}, {"q": "After client information is legally disclosed, what must be documented?", "o": ["What was shared, with whom, when, and the reason for the disclosure", "Only the date", "Nothing, because the disclosure was legal", "Only the name of the person who asked"], "a": 0, "s": 2, "p": 2}], "short": "Confidentiality", "reg": "12VAC35-105-440", "sections": ["Multiple choice", "True or false", "Scenarios"], "nar": ["Laugh & Live, LLC: Practices of Confidentiality Training. Protecting the privacy, dignity, and trust of every individual we serve — guided by 12VAC35-105-440.", "FOUNDATION. Why Confidentiality Matters. Trust Is Everything. Confidentiality is the cornerstone of the relationship between Laugh & Live, LLC and those we serve. Without it, individuals may hesitate to seek help when they need it most. Real Consequences. Breaches cause tangible harm — emotional distress, legal liability, financial penalties, and lasting damage to our reputation in the community. Regulatory Standards. 12VAC35-105-440 establishes clear, enforceable standards for protecting every portion of a client's record. Compliance is not optional.", "REGULATORY FRAMEWORK. Understanding Confidentiality Under 12VAC35-105-440. Virginia regulation 12VAC35-105-440 mandates that providers protect all portions of an individual's record from unauthorized access, duplication, and dissemination. Here's what that means at Laugh & Live, LLC: All formats covered — written documents, electronic files, and even verbal disclosures. Everyone is accountable — staff, contractors, interns, and volunteers alike. Zero exceptions — protection applies from intake through record retention and destruction at Laugh & Live, LLC.", "ACCESS CONTROLS. Access: Who Can See Client Records? Controlling access is the first line of defense against unauthorized disclosure. At Laugh & Live, every access point is governed by strict protocols. Authorized Personnel Only. Only staff with a legitimate, documented need may view records. Curiosity is never justification. Minimum Necessary. Access must be limited to only the information required for the specific task at hand — nothing more. Verify Before Granting. Always confirm identity and authorization before sharing any record, whether in person, by phone, or electronically.", "DUPLICATION POLICY. Duplication: Handling Copies of Records. Every copy of a client record carries the same level of sensitivity as the original. Uncontrolled duplication is one of the most common paths to a confidentiality breach. Strict Authorization. Copies may only be made when there is a documented, necessary purpose — and approved by a supervisor. Mark & Secure. All copies must be clearly labeled \"CONFIDENTIAL\" and stored with the same safeguards as originals. Zero Tolerance. Unauthorized copying or distribution is a serious policy violation subject to disciplinary action.", "DISSEMINATION RULES. Dissemination: Sharing Client Information. Written Consent Required. Sharing client information requires explicit, signed written consent specifying what may be shared, with whom, and for what purpose. Limited Exceptions. Exceptions exist only for genuine emergencies or court orders — and must always involve legal counsel before disclosure. Document Everything. Always create a written record of what was shared, with whom, when, and the justification for the disclosure.", "CASE STUDY. Real-World Risks of Breaches. Scenario: A well-meaning staff member accidentally emailed a client's sensitive records to an unauthorized party. The result? A formal investigation, corrective action plan, mandatory retraining, and reporting to regulatory authorities. Breaches — whether intentional or accidental — carry severe consequences: Financial penalties including regulatory fines. Legal action from affected individuals. Reputational damage that erodes community trust in Laugh & Live, LLC. Emotional harm to the individuals whose privacy was violated. Vigilance and attention to detail prevent costly mistakes.", "BEST PRACTICES. Best Practices for Maintaining Confidentiality. Secure Physical Records. Keep paper files in locked cabinets. Never leave records unattended on desks, printers, or in vehicles. Protect Digital Files. Use strong passwords, enable encryption, and always log out of systems when stepping away — even briefly. Guard Conversations. Never discuss client information in public areas, hallways, break rooms, or any unsecured setting. Report Immediately. If you suspect a breach, notify your supervisor right away. Early reporting minimizes harm and demonstrates accountability.", "YOUR RESPONSIBILITY. Your Role in Protecting Confidentiality. Every team member at Laugh & Live, LLC is a guardian of client privacy. Your daily actions determine whether our promise of confidentiality is kept. Treat Records as Sensitive. Follow Laugh & Live, LLC Policies. Ongoing Training & Ask. Adhere to 12VAC35-105-440. When in doubt, always ask before acting. Protecting privacy is never an overreaction — it is your professional and ethical obligation.", "Commitment to Confidentiality: Our Promise. \"Protecting client privacy is not just a regulation — it is the foundation of everything Laugh & Live, LLC stands for.\". Shared Responsibility. Every person at Laugh & Live, LLC plays a vital role in safeguarding the information entrusted to us. Dignity & Safety. Together, we ensure every individual's dignity, privacy, and safety are preserved — always. Mission-Driven. Upholding confidentiality strengthens our ability to provide safe, trusted, and compassionate support."]}, {"id": "sir", "title": "Serious Incident Reporting", "minutes": 30, "orientation": true, "deck": "sir", "slides": 14, "qs": [{"q": "The primary purpose of serious incident reporting is to:", "o": ["Increase paperwork", "Protect lives and ensure compliance", "Discipline staff", "Reduce documentation"], "a": 1, "s": 0}, {"q": "A serious incident is any event that:", "o": ["Causes minor inconvenience only", "Poses significant risk of harm, injury, abuse, neglect, or death", "Involves scheduling conflicts", "Only affects staff members"], "a": 1, "s": 0}, {"q": "Which of the following is considered a reportable serious incident?", "o": ["Routine scheduling change", "Minor disagreement between staff", "Medication error with potential harm", "Late arrival to work"], "a": 2, "s": 0}, {"q": "Serious incidents must be reported:", "o": ["After confirmation is received", "Only if harm occurred", "Immediately upon discovery or suspicion", "At the end of the week"], "a": 2, "s": 0}, {"q": "Formal written documentation must be completed within:", "o": ["2 hours", "12 hours", "24 hours", "72 hours"], "a": 2, "s": 0, "fixed": true}, {"q": "Level II and Level III incidents must be submitted through:", "o": ["CONNECT", "CHRIS", "DELTA", "VIDES"], "a": 1, "s": 0}, {"q": "A Level 2 incident typically involves:", "o": ["No harm", "Temporary harm or significant distress requiring intervention", "Death only", "Administrative concerns only"], "a": 1, "s": 0}, {"q": "Which of the following is an example of a Level 3 incident?", "o": ["Minor scrape without injury", "Refusal of medication without consequence", "Hospitalization or death", "Late documentation"], "a": 2, "s": 0}, {"q": "A Root Cause Analysis (RCA) must generally be completed within:", "o": ["7 days", "14 days", "30 days", "60 days"], "a": 2, "s": 0, "fixed": true}, {"q": "Failure to report serious incidents may result in:", "o": ["Praise from leadership", "No consequences", "Regulatory sanctions and legal liability", "Reduced training requirements"], "a": 2, "s": 0}, {"q": "Incidents should still be reported even if later found unsubstantiated.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Reporting protects both clients and staff.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Staff should wait for supervisor approval before reporting a serious incident.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Root Cause Analysis focuses only on blaming individuals.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Every staff member contributes to Laugh & Live, LLC's safety culture.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "A client falls and has minor bruising with no lasting harm. Which classification applies?", "o": ["Level 1: minor, no lasting harm, and documentation is still required", "Level 2: moderate", "Level 3: severe", "Not reportable, so no documentation is needed"], "a": 0, "s": 2, "p": 3, "fixed": true}, {"q": "A client requires hospitalization after a serious injury. Which incident level applies?", "o": ["Level 1", "Level 2", "Level 3: severe, involving serious injury and hospitalization", "Not reportable"], "a": 2, "s": 2, "p": 3, "fixed": true}, {"q": "A medication error is found and corrected before any harm occurs. Should it still be reported?", "o": ["Yes. All incidents must be reported regardless of intent or outcome", "No, because no harm occurred", "Only if the family asks about it", "Only if it happens a second time"], "a": 0, "s": 2, "p": 3}, {"q": "A client goes missing for several hours but is found unharmed. Which classification is most likely?", "o": ["Level 1", "Level 2: missing person with significant risk requiring intervention", "Level 3", "Not reportable, since they were found"], "a": 1, "s": 2, "p": 3, "fixed": true}, {"q": "An unexplained death involving a client occurs. What must happen immediately after discovery?", "o": ["Notify the supervisor, submit required reports including CHRIS, begin investigation procedures, and start Root Cause Analysis", "Wait for the medical examiner before telling anyone", "Call the family, then write it up next week", "Complete the internal form only"], "a": 0, "s": 2, "p": 3}, {"q": "Which details must be included in an incident report?", "o": ["Who, what, when, where, how, witnesses, and immediate actions taken", "Only the client's name and the date", "Your opinion of who was at fault", "Only what your supervisor tells you to write"], "a": 0, "s": 3, "p": 3}, {"q": "After submitting a CHRIS report, who should staff notify internally?", "o": ["Their direct supervisor and leadership contacts, including Devan, Liz, and LaWanda", "No one, because CHRIS notifies everyone", "Only the client's family", "Only the coworkers on shift"], "a": 0, "s": 3, "p": 3}, {"q": "What is the purpose of a Root Cause Analysis (RCA)?", "o": ["To find underlying causes, system failures, and process gaps so it doesn't happen again", "To decide which staff member to blame", "To close the incident as quickly as possible", "To avoid reporting to DBHDS"], "a": 0, "s": 3, "p": 3}, {"q": "Why is confidentiality important during serious incident reporting?", "o": ["It protects sensitive client and staff information and keeps the agency compliant with privacy rules", "It means incidents don't need to be reported", "It keeps supervisors from finding out", "It isn't important during incidents"], "a": 0, "s": 3, "p": 3}, {"q": "How does timely reporting improve safety and quality of care?", "o": ["It allows rapid intervention, prevents further harm, strengthens procedures and training, and supports quality care", "It mostly reduces paperwork", "It only matters for billing", "It doesn't change outcomes"], "a": 0, "s": 3, "p": 3}], "short": "Serious Incidents", "reg": "12VAC35-105-440", "sections": ["Multiple choice", "True or false", "Classification scenarios", "Process & accountability"], "nar": ["Serious Incident Reporting Training. Understanding When, How, and Why to Report — As Required by 12VAC35-105-440. STAFF TRAINING MODULE. COMPLIANCE REQUIRED.", "Why Serious Incident Reporting Matters. Protect Lives. Safeguards the safety, health, and wellbeing of every individual we serve. Stay Compliant. Ensures adherence to all regulatory requirements and Laugh & Live, LLC policies. Drive Improvement. Fuels continuous quality improvement and prevents future harm. Failure to report can lead to legal penalties, loss of public trust, and escalation of harm to vulnerable individuals. 12VAC35-105-440 mandates serious incident reporting training for all staff, including when, how, and under what circumstances reports must be submitted.", "What Is a Serious Incident? A serious incident is any event that causes or poses significant risk of harm, injury, abuse, neglect, or death to a client or staff member. What Is Reportable? Physical injury or unexplained bruising. Allegations of abuse, neglect, or exploitation. Medication errors with potential for harm. Unexpected or unexplained death. Missing or unaccounted-for persons. Suicide attempt or self-harm. Sexual assault or inappropriate sexual behavior. Emergency psychiatric hospitalization. Serious property damage. Law enforcement involvement. Any event posing significant risk of harm to a client or staff member. When in doubt — report. Incidents must be. reported regardless of intent or outcome. Reporting is a critical step in safeguarding everyone.", "When Must You Report? Upon discovery or suspicion of a serious incident — do not wait for confirmation. Verbal notification to supervisor must happen right away. Immediately. Within 24 Hours. All formal written documentation must be completed and submitted within 24 hours of the event. This includes the internal incident report form. Within 2 Hours. Within 30 Days. CHRIS (Critical Human Rights Incident System) report must be submitted within 2 hours for Level II and Level III incidents. Root Cause Analysis (RCA) must be completed for applicable incidents. Delays or failure to report can worsen outcomes, violate 12VAC35-105-440, and result in a Corrective Action Plan (CAP) or formal Citation from the Virginia Department of Behavioral Health and Developmental Services (DBHDS).", "How to Report a Serious Incident. Use the Internal Incident Report Form. Complete Laugh & Live, LLC's official incident report form immediately. Include who, what, when, where, how, and all immediate actions taken. Submit via CHRIS. For Level II and Level III incidents, submit a report through the CHRIS (Critical Human Rights Incident System) portal within 2 hours of discovery. Notify Leadership. Immediately alert your direct supervisor. They will notify the Program Director and Compliance Officer. All notifications must be documented. Maintain Confidentiality. Protect all sensitive client and staff information. Only share on a need-to-know basis. Document all communications within 24 hours.", "CHRIS Reporting — What You Need to Know. CRITICAL REPORTING SYSTEM. CHRIS (Critical Human Rights Incident System) is Virginia's mandatory online reporting portal used to report serious incidents to the Department of Behavioral Health and Developmental Services (DBHDS). Who Must Report. All Laugh & Live, LLC staff who witness or discover a Level II or Level III serious incident are required to submit a CHRIS report. How to Access CHRIS. Log in at the DBHDS CHRIS portal using your assigned credentials. If you do not have credentials, contact your supervisor immediately. After Submission. Notify your supervisor that the CHRIS report has been submitted. Retain a copy for internal records. CHRIS reporting is a legal requirement under 12VAC35-105-440. Failure to submit a timely CHRIS report may result in regulatory action against Laugh & Live, LLC and the individual staff member. When to Submit. CHRIS reports must be submitted within 2 hours of discovery for Level II and Level III incidents. Do not delay. What to Include. Date, time, location, description of the incident, individuals involved, immediate actions taken, and any witnesses.", "Notifying Authorized Representatives & Agency Contacts. NOTIFICATION PROTOCOL. When a serious incident occurs, authorized representatives and designated agency contacts must be notified promptly. This is a required step in Laugh & Live, LLC's internal reporting process. Devan. Primary Agency Contact. Must be notified immediately upon discovery of any Level II or Level III incident. Devan oversees incident response coordination and ensures regulatory compliance. LaWanda. Agency Contact / Client Relations. Notify promptly, especially when incidents involve client welfare, family communication, or authorized representative updates. All notifications must be documented — include the name of the person notified, the date and time of notification, and the method of contact (phone, email, in-person). This documentation is part of the 24-hour reporting requirement. Liz. Agency Contact / Compliance Support. Notify within the same reporting window as Devan. Liz supports documentation review and follow-up actions.", "Documentation Requirements. DOCUMENTATION STANDARDS. Thorough, accurate documentation is a critical component of serious incident reporting at Laugh & Live, LLC. All documentation must be completed within 24 hours of the incident. Internal Incident Report Form. Complete Laugh & Live, LLC's official incident report form. Include: date, time, and location of incident; names of individuals involved; description of what occurred; immediate actions taken; names of witnesses; and staff member completing the report. CHRIS Submission Record. Retain a copy of the submitted CHRIS report. Document the CHRIS confirmation number, date/time of submission, and the name of the staff member who submitted it. Supervisor Notification Log. Document when and how your supervisor was notified — include date, time, and method (phone, email, in-person). Also document notifications to Devan, Liz, and LaWanda. Authorized Representative Notification. Document when the client's authorized representative or family was notified, by whom, and what information was shared. Follow-Up Documentation. Any follow-up actions, medical treatment, or additional communications must be documented and added to the incident file. All incident documentation must be stored securely and confidentially in the client's file. Records must be retained per Laugh & Live, LLC's records retention policy and DBHDS requirements.", "Follow-Up & Corrective Action. QUALITY IMPROVEMENT. After a serious incident is reported, Laugh & Live, LLC is committed to thorough follow-up and corrective action to prevent recurrence and protect those we serve. Step 1 — Immediate Follow-Up (0–24 Hours). Ensure the safety and wellbeing of all individuals involved. Confirm all notifications have been made (supervisor, Devan, Liz, LaWanda, authorized representatives). Verify CHRIS report and internal documentation are complete. Step 3 — Root Cause Analysis (Within 30 Days). For Level II and Level III incidents, a multidisciplinary RCA team investigates the root causes. The team reviews all documentation, interviews staff, and identifies system or process failures. Step 5 — Implementation & Monitoring. Corrective actions are implemented and monitored for effectiveness. Staff are retrained as needed. Progress is documented and reported to leadership and DBHDS as required. Corrective Action Plans are not punitive — they are tools for growth and improvement. Every CAP makes Laugh & Live, LLC stronger and safer for clients and staff alike. Step 2 — Incident Review (Within 7 Days). Supervisor and leadership review the incident report for completeness and accuracy. Determine if a Root Cause Analysis (RCA) is required. Identify any immediate corrective actions needed. Step 4 — Corrective Action Plan (CAP). Based on RCA findings, a formal Corrective Action Plan is developed. The CAP outlines specific actions, responsible parties, and timelines to address identified gaps. Step 6 — Closure & Documentation. Once all corrective actions are verified as complete, the incident file is closed. All documentation is retained per Laugh & Live, LLC's records retention policy.", "CLASSIFICATION FRAMEWORK. Incident Classification Levels. Level 1 — Minor. No lasting harm, but documentation is required. Examples: minor cuts, scrapes, bruises, trips without injury, falls with no injury, swelling of legs/ankles/feet, or refusing medication without consequence. Level 2 — Moderate. Causes temporary harm or significant distress requiring intervention. Examples: serious injury requiring medical attention, missing person, emergency room visit, unplanned psychiatric evaluation, medication error with adverse effect, or law enforcement involvement. Level 3 — Severe. Involves serious harm, hospitalization, or death. Triggers immediate investigation and mandatory CHRIS reporting. Examples: death (expected or unexpected), suicide attempt, sexual assault, serious physical abuse, or critical injury requiring hospitalization. RCA — Root Cause Analysis. An in-depth investigation to identify underlying causes and prevent recurrence. Must be completed within 30 days of the incident. Required for all Level III incidents and selected Level II incidents.", "Root Cause Analysis (RCA) Explained. What Is an RCA? A systematic investigation that goes beyond surface symptoms to uncover why an incident truly happened. Involves multidisciplinary teams. Thorough review of all data and documentation. Identifies system failures and process gaps. Produces actionable safety recommendations. Deadline: 30 days from incident date. Identify Incident. Gather Evidence. Analyze Failures. Implement Actions.", "Consequences of Failing to Report. Regulatory Sanctions. Fines, corrective action plans, and potential loss of licensure from oversight agencies. Reputational Damage. Erodes community trust in Laugh & Live, LLC's commitment to quality care and transparency. Remember: Reporting protects you as much as those you serve. When in doubt — report. This is both a legal obligation under 12VAC35-105-440 and a moral responsibility. Increased Risk of Harm. Unreported incidents allow dangerous conditions to persist, putting clients and staff in jeopardy. Personal Legal Liability. Individual staff members may face legal accountability and disciplinary action.", "CASE STUDY. Real-World Example: Timely Reporting Saves Lives. Incident Detected. A medication error was discovered and immediately reported through DELTA. Rapid Response. Medical intervention was initiated and the family was promptly notified. RCA Completed. Investigation identified training gaps, leading to updated protocols and staff education. \"This case demonstrates the life-saving power of prompt, accurate incident reporting at Laugh & Live, LLC. The client recovered fully because a staff member chose to act without hesitation.\".", "Your Role in Laugh & Live, LLC's Safety Culture. Be Vigilant. Recognize and report all serious incidents without delay. Follow Procedures. Use the internal form and CHRIS, document thoroughly, and communicate clearly. Participate Actively. Engage in investigations, RCAs, and improvement efforts. Questions? Contact your supervisor, Devan, Liz, or LaWanda anytime. Together, we protect those who depend on us. Build Trust Together. Every report strengthens a safer environment for all."]}, {"id": "ic", "title": "Infection Control Practices & Measures", "minutes": 20, "orientation": true, "deck": "ic", "slides": 12, "qs": [{"q": "The primary purpose of infection control practices is to:", "o": ["Reduce paperwork", "Protect staff, clients, and the community", "Increase office productivity", "Eliminate all workplace risks"], "a": 1, "s": 0}, {"q": "Proper handwashing should last at least:", "o": ["10 seconds", "15 seconds", "20 seconds", "30 seconds"], "a": 2, "s": 0, "fixed": true}, {"q": "Hand sanitizer should contain at least:", "o": ["40% alcohol", "50% alcohol", "60% alcohol", "90% alcohol"], "a": 2, "s": 0, "fixed": true}, {"q": "Which of the following is considered a key moment for hand hygiene?", "o": ["Before eating only", "After coughing or sneezing only", "Before and after client contact and after touching shared surfaces", "Once at the start of the shift"], "a": 2, "s": 0}, {"q": "Disposable gloves should:", "o": ["Be reused if they look clean", "Be changed between clients", "Only be worn during emergencies", "Be optional for body fluid exposure"], "a": 1, "s": 0}, {"q": "Which item below is considered PPE?", "o": ["Keyboard", "Face shield", "Notebook", "Cleaning cloth"], "a": 1, "s": 0}, {"q": "High-touch surfaces include:", "o": ["Ceilings", "Floors only", "Doorknobs, phones, and keyboards", "Windows only"], "a": 2, "s": 0}, {"q": "Safe distancing guidelines recommend maintaining at least:", "o": ["3 feet", "4 feet", "6 feet", "10 feet"], "a": 2, "s": 0, "fixed": true}, {"q": "Universal precautions require staff to:", "o": ["Treat only visible blood as infectious", "Treat all body fluids as potentially infectious", "Wear gloves only when clients appear sick", "Avoid reporting minor exposures"], "a": 1, "s": 0}, {"q": "If you experience symptoms of a communicable illness, you should:", "o": ["Wait until symptoms worsen", "Finish your work shift", "Notify your supervisor immediately", "Ignore mild symptoms"], "a": 2, "s": 0}, {"q": "Hand sanitizer completely replaces proper handwashing.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Communicable illnesses can spread before symptoms appear.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Cleaning should always occur before disinfecting surfaces.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Reporting exposure immediately helps prevent outbreaks.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Universal precautions are optional if a client appears healthy.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "You are cleaning a shared workstation used by several staff. What steps should you follow?", "o": ["Clean visible dirt first, then disinfect high-touch surfaces with an EPA-approved disinfectant, wearing gloves and following the label's contact time", "Spray disinfectant and wipe it off right away", "Disinfect first, then clean later if it still looks dirty", "Wipe everything with a dry cloth"], "a": 0, "s": 2, "p": 3}, {"q": "A coworker was exposed to someone with COVID-like symptoms but feels fine and doesn't want to report it. What should they do?", "o": ["Notify their supervisor immediately, even though they feel fine, because illness can spread before symptoms appear", "Wait and see if symptoms develop", "Tell only a few coworkers", "Wear a mask and say nothing"], "a": 0, "s": 2, "p": 3}, {"q": "While assisting a client, blood accidentally gets on your skin. What should you do immediately?", "o": ["Wash the area thoroughly with soap and water, report the exposure right away, complete an incident report, and get a medical evaluation if directed", "Wipe it off and keep working", "Report it at the end of your shift", "Use hand sanitizer only"], "a": 0, "s": 2, "p": 3}, {"q": "A client begins coughing repeatedly during an interaction. What should you do right away?", "o": ["Keep distance when possible, use a mask properly, clean your hands, disinfect shared surfaces, and follow respiratory hygiene", "Leave the client alone for the rest of the day", "Carry on as normal", "Give the client cough medicine"], "a": 0, "s": 2, "p": 3}, {"q": "Why does following infection control consistently build trust at Laugh & Live, LLC?", "o": ["It creates a safe, dependable environment, protects staff and clients, prevents outbreaks, and helps everyone feel respected", "It reduces the number of trainings needed", "It only matters during flu season", "It is mainly for inspections"], "a": 0, "s": 2, "p": 3}], "short": "Infection Control", "sections": ["Multiple choice", "True or false", "Scenarios"], "nar": ["Infection Control Practices & Measures. Training for Laugh & Live, LLC. Protecting our team, our clients, and our community — one practice at a time. Handwashing. Gloves/PPE. Cleaning & Disinfecting. Exposure Prevention. Communicable Illness. Flu/COVID-Type Precautions. Reporting Symptoms. Universal Precautions. Blood/Body Fluid Exposure.", "Why Infection Control Matters. Protect People. Safeguards everyone in the Laugh & Live office — our team, our clients, and the vulnerable individuals we serve every day. Prevent Outbreaks. Helps stop the spread of illness in our Laugh & Live office so care stays consistent and services stay uninterrupted. Build Trust. Creates a safe, dependable Laugh & Live environment where clients and staff feel confident, respected, and cared for.", "Handwashing: Your First Line of Defense. Proper handwashing is the single most effective way to prevent the spread of infections. Make it a consistent habit at the right times and use the right technique: Wash with soap and water for at least 20 seconds — hum \"Happy Birthday\" twice to help time it. Key moments: before and after client contact, after touching shared surfaces, after coughing or sneezing, after using the restroom, and before eating. Proper technique: wet hands, apply soap, scrub all surfaces including between fingers and under nails, rinse thoroughly, and dry with a clean towel. Use hand sanitizer with at least 60% alcohol when soap and water aren’t available. Avoid touching your face — especially your eyes, nose, and mouth — with unwashed hands. Use gloves or PPE after hand hygiene when required by the task or situation.", "Gloves & PPE: Personal Protective Equipment. Personal protective equipment helps reduce exposure to blood, body fluids, contaminated surfaces, and other task-specific risks. Use the right PPE for each situation, put it on correctly, and remove it safely to protect yourself and others. When to Wear Gloves. Wear nitrile or latex gloves when handling blood, body fluids, contaminated surfaces, or during any personal care task. Change gloves between clients and never reuse disposable gloves. Types of PPE. Gloves (nitrile/latex), surgical masks or respirators, protective gowns/aprons, and eye protection such as goggles or face shields. Select PPE based on the level of exposure risk for each task. Proper Donning & Doffing. Always wash hands before putting on PPE. Remove gloves by peeling from the wrist without touching the outer surface. Dispose of used PPE immediately in a designated waste container, then wash hands again.", "Cleaning & Disinfecting Surfaces. Target High-Touch Surfaces. Doorknobs, light switches, phones, keyboards, shared equipment, countertops, and bathroom fixtures need frequent cleaning. High-traffic areas should be cleaned at least once per shift. Use EPA-Approved Disinfectants Correctly. Always use EPA-approved disinfectants and follow label instructions carefully, including proper contact (dwell) time. Wear gloves when handling cleaning products and ensure adequate ventilation. Know the Difference: Cleaning vs. Disinfecting. Cleaning removes visible dirt and debris. Disinfecting kills germs on surfaces. Both steps are necessary — always clean before disinfecting for maximum effectiveness.", "Exposure Prevention. Minimize Contact with Infectious Materials. Avoid unnecessary contact with blood, body fluids, or contaminated items at all times. Use appropriate barriers and PPE whenever any exposure is possible — even if it seems unlikely. Follow Established Protocols — Every Time. Adhere to all Laugh & Live infection control procedures without exception. Never skip steps or take shortcuts — every precaution exists for a reason and protects both you and the people in your care. Maintain Safe Distances & Use Barriers. Keep at least 6 feet from individuals showing signs of respiratory illness. Use physical barriers like partitions, sneeze guards, or masks where available. Limit the number of people in shared spaces when illness is present.", "Communicable Illness: What You Need to Know. What Is a Communicable Illness? A communicable illness is any disease that can spread from person to person through direct contact, respiratory droplets, airborne particles, or contaminated surfaces. Common examples include influenza (flu), COVID-19, the common cold, norovirus, and RSV. How It Spreads in the Workplace. Shared surfaces, close contact, respiratory droplets from coughing or sneezing, and poor hand hygiene are the most common transmission routes in office and care settings. Infected individuals may be contagious before symptoms appear. Your Responsibility. Know the signs and symptoms of common communicable illnesses. Follow all infection control protocols consistently. Report any illness, symptoms, or known exposure to your supervisor at Laugh & Live, LLC immediately — do not wait to see if symptoms worsen.", "URGENT PROTOCOL. Reporting Symptoms & Exposure. Early reporting of symptoms, communicable illness, or any exposure is one of the most powerful tools we have. When in doubt, speak up — it protects everyone, supports exposure prevention, and allows a timely, coordinated response. Reporting is never optional. Recognize. Watch for symptoms: fever (100.4°F or higher), cough, sore throat, chills, shortness of breath, loss of taste or smell, vomiting, diarrhea, or known close contact with a confirmed contagious person. Report Immediately. Notify your supervisor right away if you have symptoms or were exposed — before coming to work or as soon as symptoms develop on-site. This includes flu, COVID-type illness, norovirus, or any communicable disease. Do not wait. Respond & Follow Guidance. Follow your supervisor's instructions: isolate from others, get tested if directed, and do not return to work until cleared by a healthcare provider and approved by your supervisor.", "Universal Precautions & Blood/Body Fluid Exposure. Universal precautions treat ALL blood and body fluids as potentially infectious — regardless of a client's known health status. This is not optional. It is the standard of care that protects both staff and clients at all times. Respond to Exposure Immediately. If blood or body fluid contacts your skin, eyes, or mouth: wash the area thoroughly with soap and water for at least 15 minutes, report to your supervisor immediately, complete an incident report, and seek medical evaluation as directed. Assume All Fluids Are Infectious. Treat blood, saliva, urine, feces, vomit, and all other body fluids as potentially hazardous at all times — no exceptions, regardless of the person's apparent health status. Use PPE for Every Exposure Risk. Gloves are mandatory for any contact with body fluids. Add a mask, gown, or eye protection based on the level of splash or exposure risk. Never skip PPE to save time.", "Flu & COVID-Type Precautions. Respiratory Hygiene. Cover coughs and sneezes with your elbow or a tissue — never your bare hands. Dispose of tissues immediately in a lined trash can and wash hands right after. Avoid touching your face, especially your eyes, nose, and mouth. Stay Home When Sick. Do not come to work if you have flu or COVID-like symptoms: fever, cough, sore throat, body aches, chills, or loss of taste/smell. Wear a mask if you must be present with mild symptoms and notify your supervisor immediately. Ventilate & Vaccinate. Open windows and improve airflow whenever possible to reduce airborne transmission risk. Stay current on recommended vaccinations, including annual flu shots and COVID boosters, as an added layer of protection for yourself and those you serve.", "MYTH BUSTERS. Common Myths & Facts. Myth: \"I'm healthy, so I don't need gloves or PPE.\". Fact: Universal precautions apply to everyone, every time. Blood and body fluids are always treated as potentially infectious — regardless of how healthy you feel. Myth: \"Hand sanitizer is enough — no need to wash.\". Fact: Soap and water physically remove dirt, oils, and germs far more effectively than sanitizer alone. Sanitizer is a backup, not a replacement. Myth: \"If I feel fine, I don't need to report exposure.\". Fact: Communicable illnesses like flu and COVID can take days to show symptoms. Reporting exposure immediately allows the team to respond before an outbreak starts.", "Together, We Create a Safe Haven. Your commitment to these practices — handwashing, gloves & PPE, cleaning & disinfecting, exposure prevention, communicable illness awareness, flu/COVID precautions, reporting symptoms, universal precautions, and blood/body fluid safety — saves lives, builds trust, and makes Laugh & Live, LLC a place where everyone feels protected. Stay Vigilant. Follow every protocol, every time — no shortcuts, no exceptions. Speak Up & Report. Report symptoms, exposures, and concerns immediately. Early action saves lives. Thank you for being a vital part of our infection control efforts. Together, we keep Laugh & Live, LLC safe. Stay Informed. Keep up with the latest guidance on communicable illness, flu, and COVID-type precautions."]}, {"id": "emer", "title": "Emergency Preparedness & Response", "minutes": 45, "orientation": true, "deck": "emer", "slides": 23, "qs": [{"q": "The primary purpose of emergency preparedness training is to:", "o": ["Increase paperwork", "Protect lives and maintain safety", "Reduce staffing needs", "Eliminate emergency responders"], "a": 1, "s": 0}, {"q": "Policy 12 VAC 35-105-530 establishes:", "o": ["Medication guidelines only", "Emergency preparedness requirements for providers", "Payroll procedures", "Transportation regulations"], "a": 1, "s": 0}, {"q": "Which phase of emergency management focuses on immediate action during an emergency?", "o": ["Mitigation", "Preparedness", "Response", "Recovery"], "a": 2, "s": 0, "fixed": true}, {"q": "During a fire emergency, the “A” in RACE stands for:", "o": ["Alert", "Alarm", "Assess", "Assemble"], "a": 1, "s": 0}, {"q": "During evacuation, staff should:", "o": ["Use elevators if faster", "Wait for instructions before moving", "Proceed to the designated assembly area", "Return inside for personal belongings"], "a": 2, "s": 0}, {"q": "Shelter-in-place is used when:", "o": ["It is safer to remain indoors than evacuate", "Staff want to avoid paperwork", "Transportation is unavailable", "Visitors are present"], "a": 0, "s": 0}, {"q": "During a medical emergency, staff should first:", "o": ["Notify family members", "Call a supervisor", "Assess the situation and call 911 if needed", "Complete documentation"], "a": 2, "s": 0}, {"q": "In a missing person incident, staff should:", "o": ["Wait several hours before acting", "Immediately begin search procedures and contact 911", "Search alone without notifying anyone", "Close the facility first"], "a": 1, "s": 0}, {"q": "Confidential information during emergencies should:", "o": ["Be shared publicly for awareness", "Be protected and shared only when necessary", "Be ignored during evacuation", "Be discussed openly with all staff"], "a": 1, "s": 0}, {"q": "Emergency drills are important because they:", "o": ["Replace emergency plans", "Help staff practice coordinated responses", "Remove the need for training", "Prevent all emergencies"], "a": 1, "s": 0}, {"q": "All staff must complete emergency preparedness training annually.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Elevators should be used during fire evacuations.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Shelter-in-place may be necessary during severe weather or hazardous material incidents.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Staff should know the individual emergency plans of the people they support.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Protecting confidentiality remains important during emergencies.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "A fire alarm sounds in the building. What are the correct evacuation steps?", "o": ["Activate the alarm if needed, exit calmly by the nearest safe route without elevators, assist individuals, go to the assembly area, and wait for clearance before re-entering", "Finish what you're doing, then leave", "Take the elevator to get out faster", "Wait in your room until someone comes for you"], "a": 0, "s": 2, "p": 3}, {"q": "An individual who uses a wheelchair must evacuate. How should staff support them?", "o": ["Use accessible routes, give physical help as needed, keep them safe and calm, and never leave them unattended", "Evacuate everyone else first, then come back", "Use the elevator, even during a fire", "Have them wait by the door for responders"], "a": 0, "s": 2, "p": 3}, {"q": "During a severe storm warning, staff are told to shelter in place. What should they do?", "o": ["Move to an interior room away from windows, monitor alerts, stay calm, seal doors and windows if hazardous materials are involved, and wait for the all-clear", "Go outside to check the weather", "Stand near windows to watch the storm", "Leave as soon as the rain stops, before the all-clear"], "a": 0, "s": 2, "p": 3}, {"q": "A person receiving services suddenly becomes unconscious and has trouble breathing. What should staff do?", "o": ["Check responsiveness and breathing, call 911, follow the dispatcher, give first aid or CPR if trained, notify a supervisor, stay with them, and document afterward", "Call the person's family first", "Write the incident report first", "Put them in a car and drive to the hospital"], "a": 0, "s": 2, "p": 3}, {"q": "Why is clear communication important during emergencies, and who should be notified during major incidents?", "o": ["It prevents confusion and supports a coordinated response; notify responders, supervisors, leadership, families or authorized representatives, and state authorities when required", "It's mostly for paperwork; notify only your supervisor", "It can wait until the next day", "Only families need to be notified"], "a": 0, "s": 2, "p": 3}], "short": "Emergency Preparedness", "reg": "12 VAC 35-105-530", "sections": ["Multiple choice", "True or false", "Scenarios"], "nar": ["Emergency Preparedness & Response Training. Laugh & Live, LLC is committed to maintaining the highest standards of safety and emergency readiness for all individuals we serve. This annual training ensures every team member understands their critical role in protecting lives, maintaining service continuity, and responding effectively when emergencies occur. Together, we create a culture of preparedness that saves lives. POLICY 12 VAC 35-105-530. REVISED JUNE 2025.", "Why Emergency Preparedness Matters. Protect Lives. Your preparedness directly impacts the safety and wellbeing of individuals receiving services, colleagues, and yourself during critical moments. Maintain Service Continuity. Effective emergency response ensures we can continue providing essential support to those who depend on us, even during crises. Legal Compliance. Our emergency preparedness meets state regulations and demonstrates our commitment to professional excellence and accountability. Community Resilience. When we're prepared, we strengthen the entire community's ability to respond to and recover from emergencies effectively. Every staff member, supervisor, and contractor must complete this training annually. Your knowledge and readiness can mean the difference between chaos and coordinated response when seconds count.", "REGULATORY FRAMEWORK. Legal Authority & Compliance Standards. Laugh & Live's emergency preparedness program operates under clear regulatory authority that establishes our responsibilities and standards of care. Understanding this framework helps you recognize why our procedures exist and how they protect everyone involved. Primary Regulatory Authority. 12 VAC 35-105-530 — Rules and Regulations for the Licensing of Providers of Behavioral Health and Developmental Services. This regulation establishes comprehensive emergency preparedness requirements for organizations like ours. Supporting Legal Framework. § 44-146.16 Code of Virginia — Defines emergencies and disasters, providing the legal foundation for our response protocols and coordination with state and local authorities. Applicability: These regulations apply to all Laugh & Live services and locations where center-based or residential services are provided. Home and non-center-based services follow modified protocols.", "Our Emergency Preparedness Commitment. Comprehensive Written Plan. Laugh & Live maintains a detailed Emergency Preparedness & Response Plan that addresses all potential emergencies across our service locations. Annual Updates. We formally review and update the plan at least annually, or more frequently when regulations change or incidents reveal improvement opportunities. This systematic approach ensures our emergency preparedness remains current, comprehensive, and effective. Your participation in training is a critical component of this commitment. Universal Application. Our emergency procedures apply consistently across all applicable services and locations, ensuring standardized, reliable responses. Continuous Monitoring. The plan undergoes regular review and monitoring to identify gaps, incorporate lessons learned, and adapt to changing circumstances. Mandatory Training. All applicable personnel receive annual training to ensure everyone knows their role and can execute emergency procedures confidently.", "Understanding Emergencies: What Qualifies? An emergency or disaster is any situation that threatens life safety, property, or our ability to deliver services. Emergencies can strike suddenly or develop grad
