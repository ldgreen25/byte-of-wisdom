<script>
(function(){
const AGENCY_EMAIL="executivesupport@laughandlivellc.com";
const PASS=0.8, MAX_ATTEMPTS=3;
const TF=["True","False"];
// Each question: q text, o options, a correct index, p points, s section, fixed = keep option order
const COURSES=[{"id": "hr", "title": "Human Rights", "minutes": 30, "orientation": true, "deck": "hr", "slides": 12, "qs": [{"q": "Individuals receiving DD services maintain:", "o": ["Only limited legal rights", "Rights determined by staff", "All rights granted to any citizen", "Rights only during service hours"], "a": 2, "s": 0}, {"q": "Self-determination means:", "o": ["Staff make decisions for the individual", "Individuals have the right to make choices about their own lives", "Only family members make decisions", "Goals are selected by providers only"], "a": 1, "s": 0}, {"q": "Person-centered services are designed around:", "o": ["Staff schedules and convenience", "Provider preferences", "The individual's unique needs, preferences, and goals", "State inspections only"], "a": 2, "s": 0}, {"q": "Which of the following demonstrates dignity and respect?", "o": ["Speaking about the individual instead of to them", "Using labels to describe individuals", "Honoring personal choices and preferences", "Entering personal spaces without knocking"], "a": 2, "s": 0}, {"q": "Personal records and health information:", "o": ["May be shared freely among staff", "Are confidential and require proper consent or legal authority to share", "Can be discussed in public settings", "Do not require privacy protection"], "a": 1, "s": 0}, {"q": "Which of the following is considered neglect?", "o": ["Respecting individual choices", "Failing to provide necessary care or supervision", "Encouraging independence", "Supporting self-determination"], "a": 1, "s": 0}, {"q": "At Laugh & Live, LLC, staff who suspect abuse, neglect, or exploitation must:", "o": ["Wait for proof before acting", "Report it immediately", "Discuss it only with coworkers", "Ignore minor concerns"], "a": 1, "s": 0}, {"q": "Individuals have the right to:", "o": ["Be denied complaint assistance", "File complaints without retaliation", "Avoid all service planning", "Have complaints ignored"], "a": 1, "s": 0}, {"q": "Which role does the Human Rights Advocate perform?", "o": ["Approving payroll records", "Investigating rights complaints and protecting individual rights", "Scheduling transportation only", "Managing billing systems"], "a": 1, "s": 0}, {"q": "Rights in service delivery include:", "o": ["Restricting communication with family", "Denying community access", "Providing information in plain, understandable language", "Limiting participation in service planning"], "a": 2, "s": 0}, {"q": "Staff should knock before entering an individual's personal space.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Staff may monitor private phone calls without permission.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "All staff are mandatory reporters of suspected abuse, neglect, or exploitation.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Individuals have the right to participate in planning their own services.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Failure to report a rights violation may result in disciplinary action.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "You are preparing to assist an individual with personal care. What should you do to protect their privacy and dignity?", "o": ["Knock before entering, explain the care, respect personal space, keep it confidential, and communicate respectfully", "Work quickly and skip explaining so it's over sooner", "Leave the door open in case a coworker needs you", "Chat with a coworker about the person during care"], "a": 0, "s": 2, "p": 2}, {"q": "An individual tells you they want to file a complaint about services. What are your responsibilities?", "o": ["Help them file it, make sure it's reported, protect them from retaliation, and explain the process in plain language", "Tell them complaints usually don't change anything", "Ask them to wait until their family visits", "Handle it yourself without reporting it"], "a": 0, "s": 2, "p": 2}, {"q": "You witness another staff member speaking disrespectfully to an individual. What should you do?", "o": ["Follow policy: report it to your supervisor or the Human Rights Advocate, document your concerns, and protect the person's rights and dignity", "Ignore it unless it happens again", "Confront the coworker in front of the individual", "Post about it on social media"], "a": 0, "s": 2, "p": 2}, {"q": "A staff member suspects financial exploitation involving an individual's money. What must be done?", "o": ["Report it immediately, document observations, notify Liz Lewis and/or Human Rights Advocate Latoya Wilburn, and make sure the person is safe", "Collect proof for a few weeks before reporting", "Ask the coworker to quietly pay it back", "Bring it up at the next staff meeting"], "a": 0, "s": 2, "p": 2}, {"q": "Why is it important to involve the Human Rights Advocate when a serious rights concern or restriction comes up?", "o": ["They provide independent review, investigate concerns, approve required restrictions, and protect the person's rights", "They process payroll for the staff involved", "They are only needed if the family complains", "They decide which staff members are disciplined"], "a": 0, "s": 2, "p": 2}], "sections": ["Multiple choice", "True or false", "Scenarios"], "nar": ["Welcome to Human Rights training. This course covers how we protect and respect the rights of every person we support. Your two key contacts are Latoya Wilburn, our Human Rights Advocate, and Liz Lewis, our in-office point of contact.", "Here's what we'll cover today: individual rights, dignity and respect, privacy, freedom from abuse and neglect, the complaint process, and how to report a rights violation. If you ever have a rights concern, go to Latoya or Liz.", "The people we support have every right any other citizen has. A disability doesn't take any of those rights away. That includes making their own choices, being treated fairly, and getting services built around their goals, not around what's easiest for staff.", "This slide shows what dignity and respect look like day to day. Use the name the person prefers, talk to them and not about them, knock before you go into their space, and keep your tone respectful. Dignity isn't optional. It's a right.", "Privacy comes in three parts. Personal privacy, like bathing and personal care. Privacy of their information, which is only shared with consent or legal authority. And private mail, phone calls, and messages. If you see a privacy violation, report it right away to Liz or Latoya.", "Every person has the right to be free from abuse, neglect, and exploitation. Abuse can be physical, verbal, emotional, or sexual. Neglect is failing to give needed care, and exploitation includes misusing someone's money or property. You are a mandatory reporter, so if you see or suspect any of it, report it immediately.", "Anyone we support can file a complaint, get help filing it, and be protected from retaliation. On our side, complaints are acknowledged within 24 hours and resolved within 10 working days. To file one or get help, contact Liz Lewis or Latoya Wilburn.", "All staff must report suspected or confirmed rights violations. That includes abuse, neglect, serious injuries, and any use of restraint. Report right away to Liz or Latoya, and write down the date, time, what happened, and who was involved. You're protected when you report in good faith, and not reporting can lead to discipline.", "This slide introduces Latoya Wilburn, our Human Rights Advocate. She's independent. She reviews any proposed rights restriction, investigates complaints, and speaks up for the people we support. Anyone, whether staff, families, or individuals, can contact her at any time.", "These are the rights people have every day in their services: their preferred name, access to the community, safety from harm, private communication, fair treatment, information in plain language, the right to refuse, and a voice in their own planning. Our job is to actively support these rights, not just know them.", "This shows the steps when a rights concern comes up. First the concern is identified, then you notify Liz right away. Latoya is brought in for restrictions, serious complaints, or anything needing independent review. She reviews it, takes action, and follows up. Leaving her out when she's required is a serious policy violation.", "To wrap up: know the rights, uphold them every day, and speak up when something's wrong. You're not just providing a service. You're helping people live full lives with the same rights and dignity as anyone else."]}, {"id": "conf", "title": "Practices of Confidentiality", "minutes": 30, "orientation": true, "deck": "conf", "slides": 10, "qs": [{"q": "Confidentiality is considered the cornerstone of Laugh & Live, LLC's relationship with individuals because:", "o": ["It reduces paperwork", "It builds trust", "It increases profits", "It limits documentation"], "a": 1, "s": 0}, {"q": "Virginia regulation 12VAC35-105-440 requires protection of:", "o": ["Only paper records", "Only electronic records", "All portions of an individual's record", "Only verbal disclosures"], "a": 2, "s": 0}, {"q": "Who is responsible for maintaining confidentiality at Laugh & Live, LLC?", "o": ["Only supervisors", "Only clinical staff", "Staff members only", "Staff, contractors, interns, and volunteers"], "a": 3, "s": 0}, {"q": "Access to client records should be based on:", "o": ["Curiosity", "Friendship with the client", "Legitimate, documented need", "Years of employment"], "a": 2, "s": 0}, {"q": "Before sharing records in person, by phone, or electronically, staff must:", "o": ["Assume the person is authorized", "Verify identity and authorization", "Ask another employee", "Share only partial information"], "a": 1, "s": 0}, {"q": "Copies of client records:", "o": ["Are less sensitive than originals", "Can be made without approval", "Carry the same level of sensitivity as originals", "Do not require safeguards"], "a": 2, "s": 0}, {"q": "All copied records must be labeled:", "o": ["“Private”", "“Protected”", "“CONFIDENTIAL”", "“For Office Use Only”"], "a": 2, "s": 0}, {"q": "Sharing client information generally requires:", "o": ["Verbal permission", "Supervisor approval only", "Signed written consent", "Staff discretion"], "a": 2, "s": 0}, {"q": "Which situation may allow limited disclosure without written consent?", "o": ["Staff curiosity", "A genuine emergency or court order", "Requests from friends", "Social media inquiries"], "a": 1, "s": 0}, {"q": "If you suspect a confidentiality breach, you should:", "o": ["Ignore it", "Wait until the next meeting", "Notify your supervisor immediately", "Handle it privately without reporting"], "a": 2, "s": 0}, {"q": "Confidentiality protections apply from intake through record retention and destruction.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "It is acceptable to discuss client information in break rooms if clients are not present.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Unauthorized copying or distribution of records is considered a serious policy violation.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Confidentiality breaches can result in emotional harm, legal action, and reputational damage.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "When unsure about sharing information, employees should ask before acting.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "A staff member accidentally leaves client files unattended on a printer. What should they do immediately?", "o": ["Secure the records right away, prevent anyone else from seeing them, and notify a supervisor if necessary", "Leave them, since the printer is in a staff-only area", "Shred them and reprint later without telling anyone", "Ask a coworker to drop them at the front desk"], "a": 0, "s": 2, "p": 2}, {"q": "A coworker asks to view a client record out of curiosity because they “know the family.” What is the correct response?", "o": ["Deny access. Only authorized staff with a legitimate, documented need may view records", "Let them look, since they already know the family", "Let them look if no supervisor is around", "Summarize the record out loud instead of showing it"], "a": 0, "s": 2, "p": 2}, {"q": "Someone calls claiming to be authorized to receive client information. What must you do before sharing anything?", "o": ["Verify the caller's identity, confirm authorization, and make sure proper consent exists", "Share basic details, since they said they are authorized", "Share only the client's address", "Ask for their name, then share what they need"], "a": 0, "s": 2, "p": 2}, {"q": "Which are best practices for protecting digital client files?", "o": ["Use strong passwords, enable encryption, and log out when stepping away", "Share one login so coverage is easier", "Save copies to your personal phone as a backup", "Leave your screen unlocked during short breaks"], "a": 0, "s": 2, "p": 2}, {"q": "After client information is legally disclosed, what must be documented?", "o": ["What was shared, with whom, when, and the reason for the disclosure", "Only the date", "Nothing, because the disclosure was legal", "Only the name of the person who asked"], "a": 0, "s": 2, "p": 2}], "short": "Confidentiality", "reg": "12VAC35-105-440", "sections": ["Multiple choice", "True or false", "Scenarios"], "nar": ["Welcome to Practices of Confidentiality. This training is about protecting the privacy, dignity, and trust of every person we serve, as Virginia's licensing rules require.", "Why does confidentiality matter? Trust is everything. Without it, people may not ask for help. A breach can cause real harm, legal trouble, and damage to our reputation. And Virginia's rules require us to protect every part of a client's record.", "This slide explains what the rule covers. It protects all of a client's record, whether it's on paper, on a computer, or spoken out loud. It applies to everyone, including staff, contractors, interns, and volunteers, from the day someone starts services until their records are destroyed.", "Who can see client records? Only staff who need them for their job, and only the minimum information needed for the task. Being curious is never a reason to look. And always confirm who someone is and that they're authorized before you share anything.", "Every copy of a record is just as sensitive as the original. Only make copies when there's a documented reason and a supervisor approves it. Mark every copy confidential and lock it up like the original. Making copies without permission is a serious violation.", "To share client information, you need signed written consent that says what can be shared, with whom, and why. The only exceptions are true emergencies or court orders. Either way, write down what you shared, who you shared it with, when, and why.", "Here's a real example. A staff member accidentally emailed a client's records to the wrong person. That led to an investigation, a corrective action plan, retraining, and a report to regulators. Accidents still have serious consequences, so double-check before you send.", "Four everyday habits keep information safe. Lock up paper files and never leave them out. Use strong passwords and log out when you step away. Don't talk about clients in public places or break rooms. And if you think there's been a breach, tell your supervisor right away.", "You are a guardian of client privacy. Treat every record as sensitive, follow our policies, keep up with your training, and when you're not sure, ask before you act. Protecting privacy is never an overreaction.", "Confidentiality is a promise we all share. Together we protect each person's dignity, privacy, and safety, and that builds the trust our work depends on."]}, {"id": "sir", "title": "Serious Incident Reporting", "minutes": 30, "orientation": true, "deck": "sir", "slides": 14, "qs": [{"q": "The primary purpose of serious incident reporting is to:", "o": ["Increase paperwork", "Protect lives and ensure compliance", "Discipline staff", "Reduce documentation"], "a": 1, "s": 0}, {"q": "A serious incident is any event that:", "o": ["Causes minor inconvenience only", "Poses significant risk of harm, injury, abuse, neglect, or death", "Involves scheduling conflicts", "Only affects staff members"], "a": 1, "s": 0}, {"q": "Which of the following is considered a reportable serious incident?", "o": ["Routine scheduling change", "Minor disagreement between staff", "Medication error with potential harm", "Late arrival to work"], "a": 2, "s": 0}, {"q": "Serious incidents must be reported:", "o": ["After confirmation is received", "Only if harm occurred", "Immediately upon discovery or suspicion", "At the end of the week"], "a": 2, "s": 0}, {"q": "Formal written documentation must be completed within:", "o": ["2 hours", "12 hours", "24 hours", "72 hours"], "a": 2, "s": 0, "fixed": true}, {"q": "Level II and Level III incidents must be submitted through:", "o": ["CONNECT", "CHRIS", "DELTA", "VIDES"], "a": 1, "s": 0}, {"q": "A Level 2 incident typically involves:", "o": ["No harm", "Temporary harm or significant distress requiring intervention", "Death only", "Administrative concerns only"], "a": 1, "s": 0}, {"q": "Which of the following is an example of a Level 3 incident?", "o": ["Minor scrape without injury", "Refusal of medication without consequence", "Hospitalization or death", "Late documentation"], "a": 2, "s": 0}, {"q": "A Root Cause Analysis (RCA) must generally be completed within:", "o": ["7 days", "14 days", "30 days", "60 days"], "a": 2, "s": 0, "fixed": true}, {"q": "Failure to report serious incidents may result in:", "o": ["Praise from leadership", "No consequences", "Regulatory sanctions and legal liability", "Reduced training requirements"], "a": 2, "s": 0}, {"q": "Incidents should still be reported even if later found unsubstantiated.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Reporting protects both clients and staff.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Staff should wait for supervisor approval before reporting a serious incident.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Root Cause Analysis focuses only on blaming individuals.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Every staff member contributes to Laugh & Live, LLC's safety culture.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "A client falls and has minor bruising with no lasting harm. Which classification applies?", "o": ["Level 1: minor, no lasting harm, and documentation is still required", "Level 2: moderate", "Level 3: severe", "Not reportable, so no documentation is needed"], "a": 0, "s": 2, "p": 3, "fixed": true}, {"q": "A client requires hospitalization after a serious injury. Which incident level applies?", "o": ["Level 1", "Level 2", "Level 3: severe, involving serious injury and hospitalization", "Not reportable"], "a": 2, "s": 2, "p": 3, "fixed": true}, {"q": "A medication error is found and corrected before any harm occurs. Should it still be reported?", "o": ["Yes. All incidents must be reported regardless of intent or outcome", "No, because no harm occurred", "Only if the family asks about it", "Only if it happens a second time"], "a": 0, "s": 2, "p": 3}, {"q": "A client goes missing for several hours but is found unharmed. Which classification is most likely?", "o": ["Level 1", "Level 2: missing person with significant risk requiring intervention", "Level 3", "Not reportable, since they were found"], "a": 1, "s": 2, "p": 3, "fixed": true}, {"q": "An unexplained death involving a client occurs. What must happen immediately after discovery?", "o": ["Notify the supervisor, submit required reports including CHRIS, begin investigation procedures, and start Root Cause Analysis", "Wait for the medical examiner before telling anyone", "Call the family, then write it up next week", "Complete the internal form only"], "a": 0, "s": 2, "p": 3}, {"q": "Which details must be included in an incident report?", "o": ["Who, what, when, where, how, witnesses, and immediate actions taken", "Only the client's name and the date", "Your opinion of who was at fault", "Only what your supervisor tells you to write"], "a": 0, "s": 3, "p": 3}, {"q": "After submitting a CHRIS report, who should staff notify internally?", "o": ["Their direct supervisor and leadership contacts, including Devan, Liz, and LaWanda", "No one, because CHRIS notifies everyone", "Only the client's family", "Only the coworkers on shift"], "a": 0, "s": 3, "p": 3}, {"q": "What is the purpose of a Root Cause Analysis (RCA)?", "o": ["To find underlying causes, system failures, and process gaps so it doesn't happen again", "To decide which staff member to blame", "To close the incident as quickly as possible", "To avoid reporting to DBHDS"], "a": 0, "s": 3, "p": 3}, {"q": "Why is confidentiality important during serious incident reporting?", "o": ["It protects sensitive client and staff information and keeps the agency compliant with privacy rules", "It means incidents don't need to be reported", "It keeps supervisors from finding out", "It isn't important during incidents"], "a": 0, "s": 3, "p": 3}, {"q": "How does timely reporting improve safety and quality of care?", "o": ["It allows rapid intervention, prevents further harm, strengthens procedures and training, and supports quality care", "It mostly reduces paperwork", "It only matters for billing", "It doesn't change outcomes"], "a": 0, "s": 3, "p": 3}], "short": "Serious Incidents", "reg": "12VAC35-105-440", "sections": ["Multiple choice", "True or false", "Classification scenarios", "Process & accountability"], "nar": ["Welcome to Serious Incident Reporting. This training covers when to report, how to report, and why it matters. All staff are required to complete it.", "Reporting serious incidents protects the people we serve, keeps us in compliance, and helps us prevent the same thing from happening again. Not reporting can lead to legal penalties, loss of trust, and more harm.", "A serious incident is anything that causes or risks serious harm, abuse, neglect, or death. This slide lists examples like injuries, unexplained bruising, abuse allegations, medication errors, a missing person, self-harm, emergency hospital visits, and police involvement. When in doubt, report it.", "This timeline shows when to report. Tell your supervisor immediately, as soon as you find or suspect an incident. Report Level 2 and Level 3 incidents in the CHRIS system within 2 hours. Finish the written report within 24 hours. And a root cause analysis is done within 30 days when it's required.", "Here's how to report. Fill out our internal incident report with who, what, when, where, and what you did. For Level 2 and 3 incidents, submit a CHRIS report. Tell your supervisor right away, and keep the details private.", "CHRIS is Virginia's online system for reporting serious incidents to DBHDS. If you witness or discover a Level 2 or Level 3 incident, you're required to file a report there. Log in with your credentials, or ask your supervisor if you don't have them. Afterward, tell your supervisor and keep a copy.", "After a serious incident, notify our agency contacts. Devan is the primary contact for Level 2 and 3 incidents. LaWanda handles client and family communication, and Liz supports documentation and follow-up. Write down who you told, when, and how.", "All documentation is due within 24 hours. That includes the incident report, a copy of the CHRIS report with its confirmation number, a record of who you notified and when, any family or representative contact, and any follow-up. Keep it all secure in the client's file.", "This shows what happens after a report. We make sure everyone is safe, review the incident within 7 days, and do a root cause analysis when needed. Then we put a corrective action plan in place, track it, and close the file. These plans are about getting better, not about punishment.", "Incidents are sorted into three levels. Level 1 is minor with no lasting harm, like a small scrape, but it still gets documented. Level 2 causes temporary harm or needs intervention, like an ER visit or a missing person. Level 3 is the most severe, like hospitalization or death.", "A root cause analysis looks past what happened to find out why it happened. A team reviews the records, finds the gaps in our systems, and recommends fixes. It's due within 30 days.", "Not reporting has real consequences: fines or loss of license, damage to our reputation, ongoing danger to clients and staff, and personal legal trouble for you. Reporting protects you too, so when in doubt, report.", "Here's a real example. A medication error was reported right away. Medical help was given, the family was told, and a review led to better training. The client fully recovered because a staff member acted without hesitating.", "Your part in our safety culture: stay alert, follow the steps, document thoroughly, and take part when we review incidents. If you have questions, reach out to your supervisor, Devan, Liz, or LaWanda anytime."]}, {"id": "ic", "title": "Infection Control Practices & Measures", "minutes": 30, "orientation": true, "deck": "ic", "slides": 12, "qs": [{"q": "The primary purpose of infection control practices is to:", "o": ["Reduce paperwork", "Protect staff, clients, and the community", "Increase office productivity", "Eliminate all workplace risks"], "a": 1, "s": 0}, {"q": "Proper handwashing should last at least:", "o": ["10 seconds", "15 seconds", "20 seconds", "30 seconds"], "a": 2, "s": 0, "fixed": true}, {"q": "Hand sanitizer should contain at least:", "o": ["40% alcohol", "50% alcohol", "60% alcohol", "90% alcohol"], "a": 2, "s": 0, "fixed": true}, {"q": "Which of the following is considered a key moment for hand hygiene?", "o": ["Before eating only", "After coughing or sneezing only", "Before and after client contact and after touching shared surfaces", "Once at the start of the shift"], "a": 2, "s": 0}, {"q": "Disposable gloves should:", "o": ["Be reused if they look clean", "Be changed between clients", "Only be worn during emergencies", "Be optional for body fluid exposure"], "a": 1, "s": 0}, {"q": "Which item below is considered PPE?", "o": ["Keyboard", "Face shield", "Notebook", "Cleaning cloth"], "a": 1, "s": 0}, {"q": "High-touch surfaces include:", "o": ["Ceilings", "Floors only", "Doorknobs, phones, and keyboards", "Windows only"], "a": 2, "s": 0}, {"q": "Safe distancing guidelines recommend maintaining at least:", "o": ["3 feet", "4 feet", "6 feet", "10 feet"], "a": 2, "s": 0, "fixed": true}, {"q": "Universal precautions require staff to:", "o": ["Treat only visible blood as infectious", "Treat all body fluids as potentially infectious", "Wear gloves only when clients appear sick", "Avoid reporting minor exposures"], "a": 1, "s": 0}, {"q": "If you experience symptoms of a communicable illness, you should:", "o": ["Wait until symptoms worsen", "Finish your work shift", "Notify your supervisor immediately", "Ignore mild symptoms"], "a": 2, "s": 0}, {"q": "Hand sanitizer completely replaces proper handwashing.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Communicable illnesses can spread before symptoms appear.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Cleaning should always occur before disinfecting surfaces.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Reporting exposure immediately helps prevent outbreaks.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Universal precautions are optional if a client appears healthy.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "You are cleaning a shared workstation used by several staff. What steps should you follow?", "o": ["Clean visible dirt first, then disinfect high-touch surfaces with an EPA-approved disinfectant, wearing gloves and following the label's contact time", "Spray disinfectant and wipe it off right away", "Disinfect first, then clean later if it still looks dirty", "Wipe everything with a dry cloth"], "a": 0, "s": 2, "p": 3}, {"q": "A coworker was exposed to someone with COVID-like symptoms but feels fine and doesn't want to report it. What should they do?", "o": ["Notify their supervisor immediately, even though they feel fine, because illness can spread before symptoms appear", "Wait and see if symptoms develop", "Tell only a few coworkers", "Wear a mask and say nothing"], "a": 0, "s": 2, "p": 3}, {"q": "While assisting a client, blood accidentally gets on your skin. What should you do immediately?", "o": ["Wash the area thoroughly with soap and water, report the exposure right away, complete an incident report, and get a medical evaluation if directed", "Wipe it off and keep working", "Report it at the end of your shift", "Use hand sanitizer only"], "a": 0, "s": 2, "p": 3}, {"q": "A client begins coughing repeatedly during an interaction. What should you do right away?", "o": ["Keep distance when possible, use a mask properly, clean your hands, disinfect shared surfaces, and follow respiratory hygiene", "Leave the client alone for the rest of the day", "Carry on as normal", "Give the client cough medicine"], "a": 0, "s": 2, "p": 3}, {"q": "Why does following infection control consistently build trust at Laugh & Live, LLC?", "o": ["It creates a safe, dependable environment, protects staff and clients, prevents outbreaks, and helps everyone feel respected", "It reduces the number of trainings needed", "It only matters during flu season", "It is mainly for inspections"], "a": 0, "s": 2, "p": 3}], "short": "Infection Control", "sections": ["Multiple choice", "True or false", "Scenarios"], "nar": ["Welcome to Infection Control. This training covers handwashing, gloves and protective equipment, cleaning, preventing exposure, illnesses that spread, flu and COVID precautions, reporting symptoms, and what to do if you're exposed to blood or body fluids.", "Infection control protects everyone in our office, especially the people we serve. It stops illness from spreading so services aren't interrupted, and it builds trust that this is a safe place.", "Handwashing is your best defense against germs. Wash with soap and water for at least 20 seconds, about two rounds of Happy Birthday. Wash before and after contact with a client, after touching shared surfaces, and after using the restroom. If you can't get to a sink, use sanitizer with at least 60 percent alcohol.", "This slide covers gloves and other protective gear. Wear gloves whenever you handle blood, body fluids, or do personal care, and change them between clients. Choose masks, gowns, or eye protection based on the risk. Wash your hands before putting gear on, remove gloves without touching the outside, throw everything away, and wash again.", "Clean the surfaces people touch most, like doorknobs, phones, keyboards, and bathroom fixtures, at least once a shift in busy areas. Use approved disinfectants and follow the label. Remember, cleaning removes dirt and disinfecting kills germs, so always clean first, then disinfect.", "To prevent exposure, avoid unnecessary contact with blood and body fluids, and use protective gear whenever exposure is possible. Follow every step of our procedures, every time. And keep about 6 feet away from anyone with signs of a respiratory illness.", "Communicable illnesses, like flu, COVID, colds, and stomach bugs, spread from person to person through contact, coughs, and shared surfaces. People can spread them before they feel sick. Know the signs, follow the precautions, and tell your supervisor right away if you're sick or were exposed.", "Reporting symptoms early is one of our strongest tools. Watch for fever, cough, sore throat, shortness of breath, or vomiting. Tell your supervisor right away, before coming in if you can. Then follow their instructions, and don't come back until you're cleared.", "Universal precautions mean treating all blood and body fluids as if they could be infectious, no matter how healthy someone seems. Gloves are required for any contact. If blood or fluid gets on your skin, eyes, or mouth, wash the area with soap and water for at least 15 minutes, tell your supervisor, fill out an incident report, and get checked if you're told to.", "For flu and COVID-type illness: cover coughs and sneezes with your elbow or a tissue, and wash your hands after. Stay home if you have symptoms like fever, cough, or body aches, and tell your supervisor. Keep air moving when you can, and stay current on recommended vaccines.", "Let's clear up three myths. Feeling healthy doesn't mean you can skip gloves, because precautions apply every time. Hand sanitizer doesn't replace washing; it's a backup. And feeling fine doesn't mean you can skip reporting an exposure, because symptoms can take days to show.", "Every one of these habits helps keep Laugh and Live safe. Follow every step every time, speak up about symptoms and exposures, and stay informed. Thank you for helping protect our team and the people we serve."]}, {"id": "emer", "title": "Emergency Preparedness & Response", "minutes": 30, "orientation": true, "deck": "emer", "slides": 23, "qs": [{"q": "The primary purpose of emergency preparedness training is to:", "o": ["Increase paperwork", "Protect lives and maintain safety", "Reduce staffing needs", "Eliminate emergency responders"], "a": 1, "s": 0}, {"q": "Policy 12 VAC 35-105-530 establishes:", "o": ["Medication guidelines only", "Emergency preparedness requirements for providers", "Payroll procedures", "Transportation regulations"], "a": 1, "s": 0}, {"q": "Which phase of emergency management focuses on immediate action during an emergency?", "o": ["Mitigation", "Preparedness", "Response", "Recovery"], "a": 2, "s": 0, "fixed": true}, {"q": "During a fire emergency, the “A” in RACE stands for:", "o": ["Alert", "Alarm", "Assess", "Assemble"], "a": 1, "s": 0}, {"q": "During evacuation, staff should:", "o": ["Use elevators if faster", "Wait for instructions before moving", "Proceed to the designated assembly area", "Return inside for personal belongings"], "a": 2, "s": 0}, {"q": "Shelter-in-place is used when:", "o": ["It is safer to remain indoors than evacuate", "Staff want to avoid paperwork", "Transportation is unavailable", "Visitors are present"], "a": 0, "s": 0}, {"q": "During a medical emergency, staff should first:", "o": ["Notify family members", "Call a supervisor", "Assess the situation and call 911 if needed", "Complete documentation"], "a": 2, "s": 0}, {"q": "In a missing person incident, staff should:", "o": ["Wait several hours before acting", "Immediately begin search procedures and contact 911", "Search alone without notifying anyone", "Close the facility first"], "a": 1, "s": 0}, {"q": "Confidential information during emergencies should:", "o": ["Be shared publicly for awareness", "Be protected and shared only when necessary", "Be ignored during evacuation", "Be discussed openly with all staff"], "a": 1, "s": 0}, {"q": "Emergency drills are important because they:", "o": ["Replace emergency plans", "Help staff practice coordinated responses", "Remove the need for training", "Prevent all emergencies"], "a": 1, "s": 0}, {"q": "All staff must complete emergency preparedness training annually.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Elevators should be used during fire evacuations.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Shelter-in-place may be necessary during severe weather or hazardous material incidents.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Staff should know the individual emergency plans of the people they support.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Protecting confidentiality remains important during emergencies.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "A fire alarm sounds in the building. What are the correct evacuation steps?", "o": ["Activate the alarm if needed, exit calmly by the nearest safe route without elevators, assist individuals, go to the assembly area, and wait for clearance before re-entering", "Finish what you're doing, then leave", "Take the elevator to get out faster", "Wait in your room until someone comes for you"], "a": 0, "s": 2, "p": 3}, {"q": "An individual who uses a wheelchair must evacuate. How should staff support them?", "o": ["Use accessible routes, give physical help as needed, keep them safe and calm, and never leave them unattended", "Evacuate everyone else first, then come back", "Use the elevator, even during a fire", "Have them wait by the door for responders"], "a": 0, "s": 2, "p": 3}, {"q": "During a severe storm warning, staff are told to shelter in place. What should they do?", "o": ["Move to an interior room away from windows, monitor alerts, stay calm, seal doors and windows if hazardous materials are involved, and wait for the all-clear", "Go outside to check the weather", "Stand near windows to watch the storm", "Leave as soon as the rain stops, before the all-clear"], "a": 0, "s": 2, "p": 3}, {"q": "A person receiving services suddenly becomes unconscious and has trouble breathing. What should staff do?", "o": ["Check responsiveness and breathing, call 911, follow the dispatcher, give first aid or CPR if trained, notify a supervisor, stay with them, and document afterward", "Call the person's family first", "Write the incident report first", "Put them in a car and drive to the hospital"], "a": 0, "s": 2, "p": 3}, {"q": "Why is clear communication important during emergencies, and who should be notified during major incidents?", "o": ["It prevents confusion and supports a coordinated response; notify responders, supervisors, leadership, families or authorized representatives, and state authorities when required", "It's mostly for paperwork; notify only your supervisor", "It can wait until the next day", "Only families need to be notified"], "a": 0, "s": 2, "p": 3}], "short": "Emergency Preparedness", "reg": "12 VAC 35-105-530", "sections": ["Multiple choice", "True or false", "Scenarios"], "nar": ["Welcome to Emergency Preparedness and Response. This is an annual training that makes sure everyone knows their role in keeping people safe and keeping services running when an emergency happens.", "Being prepared protects lives, keeps essential services going during a crisis, meets state requirements, and helps the whole community recover. Every staff member, supervisor, and contractor completes this training every year.", "This slide explains the rules behind our emergency plan. Virginia's licensing regulations require providers like us to have an emergency preparedness program, and the Code of Virginia defines what counts as an emergency or disaster.", "Laugh and Live keeps a written emergency plan that covers all of our services and locations. We review and update it at least once a year, or sooner when rules change or we learn something from an incident. Your training is part of keeping that plan working.", "An emergency is anything that threatens safety, property, or our ability to provide services. This slide lists the common ones: fire, natural disasters, power outages, medical emergencies, a missing person, and other threats. Some happen suddenly, others build slowly.", "For a fire, remember RACE. Rescue anyone in immediate danger. Alarm, by pulling the fire alarm. Contain the fire by closing doors if it's safe. Then extinguish a small fire only if you're trained, or evacuate. Leave by the nearest safe exit, never use elevators, and go to the meeting area.", "Natural disasters include tornadoes, hurricanes, winter storms, and extreme heat or cold. For tornadoes and hurricanes, get to an interior room. In winter storms, stay inside and prepare for power loss. In extreme heat or cold, stay hydrated or dress in layers. Be ready to shelter in place.", "During a power outage, stay calm and check on everyone first, especially anyone who relies on powered medical equipment. Turn on backup power if we have it. Keep medications that need refrigeration cold, and let your supervisor know what's happening.", "In a medical emergency, first recognize the signs, like unconsciousness, heavy bleeding, trouble breathing, or chest pain. Call 911 right away and follow the dispatcher. Don't move the person unless they're in danger. Stay with them, give first aid if you're trained, and notify your supervisor.", "If someone goes missing, search the building and grounds right away and confirm where they were last seen. Call 911 and give a description, what they were wearing, and any medical needs. Notify your supervisor, leadership, family, and DBHDS as required, and document everything.", "Shelter in place means staying inside because it's safer than leaving, for example during severe weather or when the outside air is unsafe. Go to an interior room with no windows, seal doors and windows if there's a chemical threat, stay calm, and wait until authorities say it's safe.", "This slide is a quick list of emergency contacts. For police, fire, or an ambulance, call 911. Poison Control is 1-800-222-1222. It also lists our internal contacts, including Liz Lewis and Devan Deisch. Keep this list somewhere you can find it quickly.", "Every person we support needs an emergency plan that fits them. That plan covers their medical conditions and allergies, their medications, their behavior supports, their mobility needs, and how they communicate. Know the plans for the people you support.", "Our emergency program covers emergencies inside our agency and in the community. It follows four stages: reducing risk ahead of time, getting prepared, responding when something happens, and recovering afterward.", "Here are the four phases in more detail. Mitigation finds and reduces risks. Preparedness means planning, training, and drills. Response is taking action during the emergency. Recovery is restoring services and learning from what happened. Each phase feeds into the next.", "Everyone has a role. Leadership activates the plan, coordinates the response, and talks with authorities. Staff do headcounts, follow directions without delay, document what happened, communicate with families, and help anyone with special needs.", "When an emergency happens, tell your supervisor right away. If a life is at risk, call 911 first, then let leadership know. Never wait on an internal call before calling for emergency help. Police, fire, the state, and families may all need to be notified.", "Warnings come in different forms: alarms, someone announcing it out loud, or a text, call, or email. When you hear an alarm, act right away. Never assume it's a false alarm.", "Evacuate when an alarm sounds, when responders tell you to, or when there's fire, smoke, a gas leak, or building damage. Know both your main and backup exit routes, use accessible exits for anyone who needs them, never use elevators in a fire, and account for everyone at the meeting area.", "Some people need extra help to evacuate. For someone who's deaf or hard of hearing, use visual signals or writing. For someone who's blind or has low vision, give clear directions and offer your arm. For someone who can't walk, use their mobility aids and never leave them behind.", "In an emergency, staff may need to unlock secure doors so people can get out and responders can get in. Help emergency crews reach medications or records when they need to, while protecting privacy as much as you can.", "Contact families and authorized representatives when an emergency causes an evacuation, an injury, a service disruption, or anything that affects someone's health or safety. Write down every attempt and every conversation, and keep trying until you reach them.", "During an emergency, services may change for a while. Keep people safe while keeping routines as normal as you can. Protect confidential information, bring emergency medications if you evacuate, and document every change you make."]}, {"id": "doc", "title": "Clinical Documentation: Progress Notes, Timeliness & the Client's Book", "minutes": 30, "orientation": true, "deck": "doc", "slides": 10, "qs": [{"q": "Why is clinical documentation important in DD/IDD services?", "o": ["It is only used for marketing purposes", "It serves as a legal record, supports care continuity, and ensures accountability", "It replaces the Individual Service Plan (ISP)", "It is optional if verbal updates are provided"], "a": 1, "s": 0}, {"q": "Every progress note must include which of the following?", "o": ["Staff personal opinions about the client", "Only the client's diagnosis", "Date, time, duration, and service type", "Family financial information"], "a": 2, "s": 0}, {"q": "Which statement best describes acceptable documentation?", "o": ["“Client did well today.”", "“Session was productive.”", "“Client demonstrated improved coping skills with success during redirection activities.”", "“Client behaved normally.”"], "a": 2, "s": 0}, {"q": "Progress notes must directly reference:", "o": ["The previous staff member's opinion", "The staff schedule", "The ISP goals and objectives", "Billing totals only"], "a": 2, "s": 0}, {"q": "Progress notes should be completed within:", "o": ["72 hours", "48 hours", "24 hours", "By the end of the month"], "a": 2, "s": 0, "fixed": true}, {"q": "Which of the following is considered poor documentation practice?", "o": ["Using measurable behavioral language", "Copying and pasting the same note repeatedly", "Including client responses to interventions", "Referencing the ISP objective"], "a": 1, "s": 0}, {"q": "Why should staff review recent progress notes before providing services?", "o": ["To shorten documentation time", "To avoid duplication and understand current client status", "To replace reviewing the ISP", "To create longer progress notes"], "a": 1, "s": 0}, {"q": "What information may be found in the Client's Book?", "o": ["ISP goals and objectives", "Assessment updates", "Progress note history", "All of the above"], "a": 3, "s": 0, "fixed": true}, {"q": "Documentation completed several days after services were provided may reduce accuracy.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Staff may document services before the session occurs if they know the schedule in advance.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Measurable and observable language should be used in progress notes.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Reviewing the Client's Book before each session helps improve service delivery and care coordination.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Leaving a progress note unsigned is acceptable if the information is accurate.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Which list contains four required elements of a progress note?", "o": ["Date, time, duration, and service type; client presentation; the ISP goal and objective; the client's response to intervention", "Staff opinion; the weather; family finances; the client's diagnosis", "Billing total; staff schedule; the client's address; the previous staff member's opinion", "The client's favorite foods; staff initials only; the shift length; the room number"], "a": 0, "s": 2}, {"q": "Why is timely documentation important in DD/IDD services?", "o": ["Records stay accurate while memory is fresh, and it supports client safety and prevents billing denials", "It lets staff skip reviewing the Client's Book", "It makes notes longer", "It isn't important if the service happened"], "a": 0, "s": 2}], "short": "Clinical Documentation", "sections": ["Multiple choice", "True or false", "Short answer"], "nar": ["Welcome to Clinical Documentation. This training covers writing good progress notes, getting them in on time, and using the client's book.", "Documentation matters because every note is a legal record. It's also how the team keeps care consistent, and it shows that services match each person's plan.", "Every progress note needs a few core pieces: the date, time, how long the service lasted, and the type of service. It also needs which goals from the person's plan you worked on, how they presented, and how they responded. Be specific; general notes don't count.", "Each note has to connect back to the person's Individual Service Plan. Name the goal you worked on, describe the objective and what they did, report progress in measurable terms, and note what's planned for next time.", "Timeliness matters. Late notes are less accurate and put us at risk. Progress notes are due Sundays at 5 PM. Supportive in-home staff send them to the QDDP email, and sponsored residential staff send them to the QDDP two email. Notes should be completed within 24 hours of the service.", "Avoid these common mistakes: vague words like 'did well,' copying the same note over and over, leaving out the goal, personal opinions, missing signatures or dates, and writing notes before the service happens. Good notes are specific and measurable.", "The client's book is each person's full record. It includes their intake assessment, their Individual Service Plan, past progress notes, and any updated assessments. Every direct care staff member is expected to know what's in it.", "Before each visit, review the person's current goals, read the last two or three notes from other staff, and check for any recent changes. That way your note is accurate and you're not repeating someone else's work.", "Poor documentation has real consequences. It can lead to billing denials, failed audits, and loss of our license, and most importantly, gaps in a person's care. Remember: if it wasn't documented, it didn't happen.", "To sum up: be specific, be on time, tie every note to the person's goals, and review the client's book before every visit. If you have questions, ask your supervisor or compliance officer."]}, {"id": "pc", "title": "Person-Centeredness", "minutes": 30, "orientation": true, "deck": "pc", "slides": 10, "qs": [{"q": "Person-centeredness focuses on:", "o": ["Staff routines", "Agency convenience", "Individual needs, preferences, and values", "Policies only"], "a": 2, "s": 0}, {"q": "Supporting individual choice means:", "o": ["Staff make decisions for the person", "Individuals are encouraged to follow routines only", "Staff honor the person’s right to make decisions", "Choices are limited for efficiency"], "a": 2, "s": 0}, {"q": "Individualized supports are:", "o": ["The same for every person", "Tailored to each individual’s goals and preferences", "Based only on staff judgment", "Focused only on medical needs"], "a": 1, "s": 0}, {"q": "Trust and rapport improve when individuals:", "o": ["Feel respected and heard", "Follow instructions without question", "Avoid expressing preferences", "Depend fully on staff"], "a": 0, "s": 0}, {"q": "Dignity of risk means:", "o": ["Eliminating all risks from daily life", "Allowing informed choices and reasonable risks", "Preventing independence", "Restricting opportunities"], "a": 1, "s": 0}, {"q": "Community participation includes:", "o": ["Staying inside the home", "Avoiding social interaction", "Supporting involvement in jobs, events, and relationships", "Limiting public access"], "a": 2, "s": 0}, {"q": "Respecting communication style means:", "o": ["Expecting everyone to communicate verbally", "Ignoring gestures or devices", "Learning and honoring how each person communicates", "Correcting communication differences"], "a": 2, "s": 0}, {"q": "Implementing the ISP with fidelity means:", "o": ["Following goals and supports as written", "Ignoring preferences when busy", "Changing plans without discussion", "Focusing only on paperwork"], "a": 0, "s": 0}, {"q": "Active listening involves:", "o": ["Giving full attention without judgment", "Interrupting often", "Multitasking during conversations", "Redirecting the topic quickly"], "a": 0, "s": 0}, {"q": "Person-centeredness is:", "o": ["Only the responsibility of supervisors", "Optional depending on staffing", "Everyone’s responsibility", "A yearly task only"], "a": 2, "s": 0}, {"q": "Every person is considered the expert of their own life.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Community participation is a core part of meaningful daily life.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Staff should do everything for individuals to avoid mistakes.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Person-centeredness includes respecting preferences and communication styles.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Ongoing learning and self-reflection strengthen person-centered practice.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "An individual wants to attend a community event that staff are unfamiliar with. How should staff respond using person-centered principles?", "o": ["Listen to their interests, support safe participation, help plan transportation or resources if needed, and encourage the choice", "Suggest they stick with activities staff already know", "Only allow it if a staff member has been there before", "Ask their family to decide"], "a": 0, "s": 2, "p": 2}, {"q": "A person communicates mainly through gestures and a communication device. What should staff do to support effective communication?", "o": ["Learn their communication style, use the device appropriately, pay attention to gestures, and include their voice in decisions and planning", "Ask only yes-or-no questions", "Speak with their family instead", "Put the device away so they practice speaking"], "a": 0, "s": 2, "p": 2}, {"q": "An individual prefers a different daily routine than what staff usually schedule. How should this be handled?", "o": ["Respect their preferences, adjust the routine when possible, and support choices that reflect their goals and lifestyle", "Keep the usual schedule so the day runs smoothly", "Let them change it only on weekends", "Document it as a behavior concern"], "a": 0, "s": 2, "p": 2}, {"q": "Which is an example of supporting dignity of risk in everyday life?", "o": ["Supporting someone in trying a new activity or preparing their own meal with supervision", "Doing all their cooking so they never get burned", "Keeping them home whenever there is any risk", "Choosing their activities for them"], "a": 0, "s": 2, "p": 2}, {"q": "How can staff promote independence while still providing support?", "o": ["Encourage skill-building, give support only when needed, let them make choices, and avoid doing tasks they can do themselves", "Do tasks for them so they’re done right", "Help with everything to stay safe", "Leave them to do everything alone with no support"], "a": 0, "s": 2, "p": 2}], "sections": ["Multiple choice", "True or false", "Scenarios"], "links": {"5": {"url": "https://www.youtube.com/watch?v=ikwmiUWcXEk", "label": "Open Video 1 on YouTube"}}, "nar": ["Welcome to Person-Centeredness. The big idea here is that staff don't just watch people. We actively support their goals, preferences, independence, and a meaningful everyday life.", "Person-centeredness means putting each person's needs, preferences, and values at the center of their support. They are the expert on their own life. Staff support their choices, even when those choices differ from what we'd pick, and tailor support to each person.", "Why it matters: the person's support plan is their roadmap, and we follow it faithfully. When people feel heard and respected, trust grows. And when staff actively support goals, people see real growth and independence.", "This slide covers the core principles. Dignity of risk means people can make their own choices, even ones with some risk. Supports are built around each person. We learn how each person communicates. And we support them to take part in their community.", "Here's a real example. A man who had been isolated started going to community events and pursuing a job interest once staff supported his goals and not just his schedule. Person-centered support changes lives.", "This slide introduces a short video about person-centered care. As you watch, think about how actively supporting someone's independence and choices is different from just being there with them.", "Your role is much more than supervising. You're a professional who supports goals, honors preferences, and makes daily life meaningful. Every interaction is a chance to help someone move closer to the life they want.", "Here are daily practices that bring this to life. Listen fully and learn how each person communicates. Respect their preferences every day. Offer real choices, support independence, encourage community activities, and follow their support plan.", "Person-centered care isn't always easy. You'll need to balance safety with each person's right to choose. You'll work within policies while keeping the person's voice front and center, and you'll keep learning and reflecting as you go.", "Person-centeredness is everyone's job, every shift. We're not just watching. We're supporting outcomes, honoring preferences, and helping each person lead their own life."]}, {"id": "hcbs", "title": "Home & Community-Based Services (HCBS)", "minutes": 30, "orientation": true, "deck": "hcbs", "slides": 13, "qs": [{"q": "HCBS supports individuals to live in:", "o": ["Institutional facilities only", "Community-integrated settings", "Hospitals and nursing homes only", "Isolated environments"], "a": 1, "s": 0}, {"q": "Which HCBS principle gives individuals the right to decide their daily routines and goals?", "o": ["Privacy", "Dignity", "Choice and Autonomy", "Documentation"], "a": 2, "s": 0}, {"q": "Freedom from coercion and restraint means:", "o": ["Using threats to gain compliance", "Restricting activities for convenience", "Supporting individuals without pressure or unnecessary restrictions", "Limiting communication access"], "a": 2, "s": 0}, {"q": "Privacy in HCBS includes:", "o": ["Sharing information openly with others", "Respecting personal space and confidentiality", "Allowing staff to enter rooms anytime", "Ignoring personal boundaries"], "a": 1, "s": 0}, {"q": "Rights modifications may only happen when:", "o": ["Staff prefer stricter rules", "Health or safety requires it", "Families request permanent restrictions", "Documentation is unavailable"], "a": 1, "s": 0}, {"q": "Which of the following is an example of community integration?", "o": ["Keeping individuals separated from community activities", "Allowing participation in community events and relationships", "Restricting access to public places", "Limiting communication with others"], "a": 1, "s": 0}, {"q": "DSPs should:", "o": ["Make decisions for individuals", "Offer meaningful choices and respect preferences", "Control all routines", "Avoid community participation"], "a": 1, "s": 0}, {"q": "Which right includes access to meals, visitors, and communication?", "o": ["Freedom from restraint", "Community integration", "Access to food, visitors, communication, and activities", "Documentation compliance"], "a": 2, "s": 0}, {"q": "A rights modification must be:", "o": ["Permanent", "Undocumented", "Time-limited and reviewed regularly", "Based on staff convenience"], "a": 2, "s": 0}, {"q": "Person-Centered Planning places:", "o": ["Staff at the center of decisions", "The individual at the center of planning", "Families in total control", "Policies above preferences"], "a": 1, "s": 0}, {"q": "HCBS promotes meaningful participation in community life.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "DSPs may impose restrictions without team approval.", "o": ["True", "False"], "a": 1, "s": 1}, {"q": "Privacy and dignity should be respected in all interactions.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Rights modifications must use the least restrictive option possible.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "Documentation should include choices made and rights supported.", "o": ["True", "False"], "a": 0, "s": 1}, {"q": "A DSP decides not to allow an individual to attend a community event because it would take too much staff time. Is this appropriate under HCBS?", "o": ["No. Community integration is a protected right, and restrictions can’t be based on staff convenience", "Yes. Staff time comes first", "Yes, as long as the DSP writes it down", "Yes, if it only happens once"], "a": 0, "s": 2, "p": 2}, {"q": "During planning, an individual says they want to choose their own meals and activities. How should staff respond using person-centered principles?", "o": ["Respect their preferences, offer choices, and support their decisions about meals and activities", "Explain that staff plan the meals and activities", "Let them choose only on weekends", "Ask their family what they should eat"], "a": 0, "s": 2, "p": 2}, {"q": "A staff member enters a person’s room without knocking. Which HCBS rights are affected?", "o": ["Privacy and dignity: staff should respect personal space and knock before entering", "Freedom from restraint", "Community integration", "No rights are affected"], "a": 0, "s": 2, "p": 2}, {"q": "An individual has a medically documented choking risk requiring food restrictions. What steps must be followed before implementing this modification?", "o": ["Base it on documented health or safety needs, include it in the person’s plan, get team approval, keep it time-limited and reviewed, and use the least restrictive option", "The DSP can start it right away if they think it’s safer", "Ask the family and make it permanent", "Remove all solid food without documenting it"], "a": 0, "s": 2, "p": 2}, {"q": "Why is accurate documentation important in HCBS services?", "o": ["It shows how rights were supported, records choices and services, protects individuals and DSPs, and ensures compliance with HCBS standards", "It’s mainly for billing", "It’s only needed when something goes wrong", "It replaces talking with the person"], "a": 0, "s": 2, "p": 2}], "short": "HCBS", "sections": ["Multiple choice", "True or false", "Scenarios"], "nar": ["Welcome to Home and Community-Based Services, or HCBS. This training covers the seven core rights that help people with developmental disabilities live full lives in their communities.", "This slide lists the seven HCBS rights: being part of the community, dignity, choice and independence, freedom from pressure and restraint, privacy, access to food, visitors, communication, and activities, and limits on rights only when health or safety truly require it.", "DBHDS, Virginia's Department of Behavioral Health and Developmental Services, sets and enforces the standards for these services. It protects people's rights and makes sure any limit on a right happens only when health or safety demand it.", "Laugh and Live's services are funded through Medicaid waiver programs, like the Community Living waiver and the DD waiver. Those waivers pay for individual supports, and they require that the seven HCBS rights are protected.", "Person-centered planning is the heart of HCBS. The person leads their own planning, has real say in their daily life, and is treated with privacy and dignity. Their plan protects access to the things that make life meaningful, without pressure or unnecessary limits.", "This slide describes role-playing exercises you can use to practice. You'll act out helping someone get to community activities, offering real choices, knocking before entering, handling meals and visitors, and spotting and calming situations where pressure or restrictions show up.", "As a direct support professional, your everyday actions bring these rights to life. Help people get out into the community, offer real options and follow their lead, and respect their personal space and privacy. Don't make choices for them unless you're legally authorized.", "Community integration is a protected right, not just a goal. It means really taking part, not just being somewhere. People choose where they go, who they spend time with, and what they do. Our job is to remove the barriers.", "These rights work together: community integration, choice and independence, freedom from pressure, and access to food, visitors, and activities. Follow each person's lead and step in right away if you see pressure or manipulation.", "Sometimes a right can be limited, but only as a last resort. There has to be a specific, documented health or safety reason. The limit has to be written in the person's plan, temporary, the least restrictive option, and agreed to by the person and their team.", "We monitor all of this closely. Service records must show how every right was supported. Rights are reviewed regularly, and serious concerns, like restraint or blocking access, must be reported promptly.", "Your documentation should show how rights were supported, not just what services you provided. Write down the person's choices, where they went in the community, how their privacy was respected, and any limits used and why.", "To wrap up: help people belong in their community, protect their privacy and dignity, and make sure they have access to the things that matter to them. Your everyday choices are what make these seven rights real."]}];
COURSES.forEach(c=>{c.qs.forEach(q=>{q.p=q.p||1});c.total=c.qs.reduce((t,q)=>t+q.p,0);c.short=c.short||c.title});
const ROLE_NAMES=["Direct Support Professional (DSP)","Program Coordinator","Documentation Coordinator","Human Resources Generalist","Office Support","Executive Director","Program Director","Program Coordinator Specialist","Assistant Program Director"];
function defaultRoles(){const all=COURSES.map(c=>c.id);const r={};ROLE_NAMES.forEach(n=>r[n]=n==="Human Resources Generalist"?[]:n==="Office Support"?["conf","sir","emer"]:all.slice());return r}
const slideSrc=(c,i)=>c.deck?`slides/${c.deck}-${String(i+1).padStart(2,"0")}.jpg`:null;
const thumb=(c,cls)=>c.deck?`<img class="${cls}" src="${slideSrc(c,0)}" alt="">`:`<div class="${cls} ph"><span>${esc(c.short)}</span></div>`;

const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addBiz=(d,n)=>{let x=new Date(d),c=0;while(c<n){x.setDate(x.getDate()+1);const w=x.getDay();if(w&&w<6)c++;}return x};
const fmt=s=>{if(!s)return"—";const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const expires=c=>c?iso(addDays(new Date(c.date+"T00:00:00"),365)):null;
function status(sid,cid){
  const r=S.rec[sid+"|"+cid];
  if(r.pending)return r.question&&!r.question.a?{k:"Question for supervisor",cls:"c-warn",r}:{k:"Needs sign-off",cls:"c-acc",r};
  if(r.cert){const ex=expires(r.cert);const left=(new Date(ex+"T00:00:00")-today)/864e5;
    if(left<0)return{k:"Expired",cls:"c-bad",r};
    if(left<=30)return{k:"Renewal due soon",cls:"c-warn",r};
    return{k:"Completed",cls:"c-good",r};}
  if(r.attempts.length>=MAX_ATTEMPTS)return{k:"Locked: needs reset",cls:"c-bad",r};
  if(r.due<iso(today))return{k:"Overdue",cls:"c-bad",r};
  if(r.attempts.length)return{k:"Retake needed",cls:"c-warn",r};
  if(r.watched>0)return{k:"In progress",cls:"c-acc",r};
  return{k:"Not started",cls:"c-idle",r};
}

// Read-aloud: the browser's own voice reads each slide, one sentence at a time.
const canSpeak=("speechSynthesis" in window);
let soundOn=canSpeak; try{if(localStorage.getItem("ll-sound")==="off")soundOn=false}catch(e){}
let speechRun=0, speaking=false;
// Make slide text sound natural when read aloud.
const KEEP_CAPS = /^(PPE|HCBS|DBHDS|ISP|CHRIS|DSP|DSPS|QDDP|EPA|COVID|RSV|AED|CPR|RCA|ID|US|DD|IDD|HIPAA|OK|IT|POC|ADA|CDC|DMAS)$/;
function speakable(t) {
  return t
    .replace(/(\d+)\s?VAC\s?(\d+)-(\d+)-(\d+)/g, "$1 V A C $2, $3, $4")
    .replace(/\bLLC\b/g, "L L C")
    .replace(/\be\.g\.,?/gi, "for example,").replace(/\bi\.e\.,?/gi, "that is,")
    .replace(/°F/g, " degrees").replace(/%/g, " percent")
    .replace(/\s*&\s*/g, " and ")
    .replace(/([A-Za-z])\/([A-Za-z])/g, "$1 or $2")
    .replace(/\s*[—–]\s*/g, ", ")
    .replace(/[()]/g, ", ")
    .replace(/["“”]/g, "")
    .replace(/\b[A-Z][A-Z'’]+\b/g, (w) => (KEEP_CAPS.test(w.replace(/['’]S$/, "")) ? w : w.charAt(0) + w.slice(1).toLowerCase()))
    .replace(/\s+,/g, ",").replace(/,(\s*,)+/g, ",").replace(/,\s*\./g, ".").replace(/\s{2,}/g, " ").trim();
}
// Best-sounding voices first: Microsoft "Natural"/"Online" voices (Edge), Google's (Chrome), Apple's (Safari).
function rankVoice(v) {
  const n = v.name;
  if (/natural/i.test(n)) return 0;
  if (/online/i.test(n)) return 1;
  if (/google us english/i.test(n)) return 2;
  if (/samantha|ava|allison|aria|jenny|guy|zoe|evan/i.test(n)) return 3;
  if (/google/i.test(n)) return 4;
  return 5;
}
function englishVoices() {
  return speechSynthesis.getVoices().filter((v) => /^en(-|_)(US|GB|CA|AU)/i.test(v.lang))
    .sort((a, b) => rankVoice(a) - rankVoice(b) || (/US/i.test(b.lang) - /US/i.test(a.lang)) || a.name.localeCompare(b.name));
}
let voiceName=null;try{voiceName=localStorage.getItem("ll-voice")}catch(e){}
function pickVoice(){const v=englishVoices();return v.find(x=>x.name===voiceName)||v[0]||null}
function fillVoices(sel){if(!sel||!canSpeak)return;const v=englishVoices();if(!v.length){sel.closest(".voice").hidden=true;return}
  const cur=pickVoice();sel.innerHTML=v.map(x=>`<option value="${esc(x.name)}"${cur&&x.name===cur.name?" selected":""}>${esc(x.name.replace(/^Microsoft /,"").replace(/ - English.*$/,""))}</option>`).join("");sel.closest(".voice").hidden=false}
function stopSpeech(){speechRun++;speaking=false;if(canSpeak)speechSynthesis.cancel()}
function speakText(text){stopSpeech();if(!soundOn||!text||!canSpeak)return;const run=speechRun,voice=pickVoice();
  text=speakable(text);const parts=text.match(/[^.!?]+[.!?]+["')\]]*|\S[^.!?]*$/g)||[text];speaking=true;let i=0;
  const next=()=>{if(run!==speechRun)return;if(i>=parts.length){speaking=false;return}
    const sentence=parts[i++].trim(),u=new SpeechSynthesisUtterance(sentence);if(voice){u.voice=voice;u.lang=voice.lang}u.rate=0.95;let fin=false;
    const finish=()=>{if(!fin){fin=true;next()}};u.onend=finish;u.onerror=()=>{fin=true;if(run===speechRun)speaking=false};
    setTimeout(finish,2500+sentence.split(/\s+/).length*600);speechSynthesis.resume();speechSynthesis.speak(u)};
  // Chrome drops a reading that starts right after cancel(), so wait a moment first.
  setTimeout(()=>{if(run===speechRun)next()},150)}
if(canSpeak&&speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=()=>fillVoices(document.getElementById("voicepick"));

function renderCourse(){
  const c=COURSES.find(x=>x.id===view.cid), r=S.rec[who+"|"+c.id];
  if(view.pos==null)view.pos=Math.min(r.watched,c.minutes)>=c.minutes?0:Math.min(r.watched,c.minutes);
  let playing=false;
  app.innerHTML=`<button class="btn back" id="back">← My trainings</button>
  <div class="section-head"><h1>${esc(c.title)}</h1>${c.reg?`<span class="small muted">Guided by ${esc(c.reg)}</span>`:""}</div>
  <div class="player"><div class="frame" id="frame"><img id="slide" alt=""><div class="noslides" id="noslides" hidden><b>${esc(c.title)}</b><span>Slides for this course haven't been uploaded yet. The timer and test still work for the demo.</span></div><a class="vlink" id="vlink" target="_blank" rel="noopener" hidden></a><span class="k" id="part"></span></div>
   <div class="bar"><button class="play" id="play" aria-label="Play">▶</button>${canSpeak&&c.nar&&c.nar.some(Boolean)?`<button class="sound" id="sound" aria-pressed="${soundOn}">${soundOn?"🔊 Sound on":"🔇 Sound off"}</button>`:""}
    <div class="track" id="track" role="slider" aria-label="Lesson position" tabindex="0"><div class="seen" id="seen"></div><div class="pos" id="pos"></div></div>
    <span class="t" id="time"></span></div></div>
  ${canSpeak&&c.nar&&c.nar.some(Boolean)?`<label class="voice small muted" hidden>Voice <select id="voicepick"></select></label>`:""}
  <div class="watch"><div class="stat"><span>Time completed</span><b id="w"></b></div><div class="stat"><span>Required</span><b>${mmss(c.minutes)}</b></div><div class="stat"><span>Test</span><b id="lock"></b></div></div>
  <div class="panel"><div class="row" style="justify-content:space-between"><p class="small muted" style="margin:0;max-width:56ch">Time only counts while the lesson plays on this screen. Switching tabs pauses it. You can go back, but you can't skip ahead of what you've completed.</p>
  <div class="row"><button class="btn demo" id="skip">Skip to end (demo only)</button><button class="btn primary" id="take" disabled>Take the test</button></div></div></div>`;
  const $=id=>document.getElementById(id);
  // preload slides
  for(let i=0;i<c.slides;i++){const im=new Image();im.src=slideSrc(c,i)}
  let shown=-1;
  if(!c.slides){$("slide").hidden=true;$("noslides").hidden=false}
  function paint(){
    if(c.slides){const i=Math.min(c.slides-1,Math.floor(view.pos/c.minutes*c.slides));
    if(i!==shown){$("slide").src=slideSrc(c,i);$("slide").alt=`${c.title}, slide ${i+1}`;shown=i;
      const L=c.links&&c.links[i];const v=$("vlink");if(L){v.href=L.url;v.textContent="▶ "+L.label;v.hidden=false;if(playing){playing=false;stopTimer();stopSpeech()}}else{v.hidden=true;if(playing)speakText(c.nar&&c.nar[i])}}
    $("part").textContent=`Slide ${i+1} of ${c.slides}`;} else $("part").textContent="Lesson";
    $("seen").style.width=(Math.min(r.watched,c.minutes)/c.minutes*100)+"%";$("pos").style.width=(view.pos/c.minutes*100)+"%";
    $("time").textContent=mmss(view.pos)+" / "+mmss(c.minutes);$("w").textContent=mmss(Math.min(r.watched,c.minutes));
    const ok=r.watched>=c.minutes;$("lock").textContent=ok?"Unlocked":"Locked";$("take").disabled=!ok;$("skip").hidden=ok;
    $("play").textContent=playing?"❚❚":"▶";$("play").setAttribute("aria-label",playing?"Pause":"Play");
  }
  function tick(){ if(!playing||document.hidden)return; // demo speed: 1s = 1 min, tick every 250ms
    // Hold on this slide until the voice finishes reading it.
    const nextSlide=Math.min(c.slides-1,Math.floor((view.pos+0.25)/c.minutes*c.slides));
    if(speaking&&c.slides&&nextSlide!==shown&&view.pos+0.25<c.minutes)return;
    view.pos=Math.min(c.minutes,view.pos+0.25);
    if(view.pos>r.watched)r.watched=view.pos;
    if(view.pos>=c.minutes){playing=false;stopTimer();toast("Lesson complete. The test is unlocked.")}
    save();paint();}
  $("play").onclick=()=>{playing=!playing;if(playing){if(view.pos>=c.minutes)view.pos=0;timer=timer||setInterval(tick,250);paint();if(c.slides)speakText(c.nar&&c.nar[shown])}else{stopTimer();stopSpeech();paint()}};
  const vp=$("voicepick");fillVoices(vp);if(vp)vp.onchange=()=>{voiceName=vp.value;try{localStorage.setItem("ll-voice",voiceName)}catch(e){}speakText(c.nar&&c.nar[Math.max(shown,0)])};
  const snd=$("sound");if(snd)snd.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("ll-sound",soundOn?"on":"off")}catch(e){}
    snd.setAttribute("aria-pressed",soundOn);snd.textContent=soundOn?"🔊 Sound on":"🔇 Sound off";if(soundOn&&playing)speakText(c.nar&&c.nar[shown]);else stopSpeech()};
  $("track").onclick=e=>{const rc=e.currentTarget.getBoundingClientRect();const want=(e.clientX-rc.left)/rc.width*c.minutes;
    if(want>r.watched+0.01){toast("You can't skip ahead. Keep going to continue.");return}
    view.pos=Math.max(0,want);paint();if(playing)speakText(c.nar&&c.nar[shown])};
  $("skip").onclick=()=>{playing=false;stopTimer();stopSpeech();r.watched=c.minutes;view.pos=c.minutes-0.01;save();paint();toast("Demo: lesson marked complete. The test is unlocked.")};
  $("back").onclick=()=>go({name:"list"});
  $("take").onclick=()=>go({name:"quiz",cid:c.id});
  document.onvisibilitychange=()=>{if(document.hidden&&playing){playing=false;stopTimer();stopSpeech();paint()}};
  paint();
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQuiz(){
  const c=COURSES.find(x=>x.id===view.cid), r=S.rec[who+"|"+c.id];
  if(!view.order){
    // shuffle within each section, keep section order; True/False options stay in order
    const groups={};c.qs.forEach((q,i)=>{(groups[q.s||0]=groups[q.s||0]||[]).push(i)});
    view.order=Object.keys(groups).sort((a,b)=>a-b).flatMap(k=>shuffle(groups[k])).map(i=>({i,opts:(c.qs[i].o.length===2||c.qs[i].fixed)?c.qs[i].o.map((t,j)=>j):shuffle(c.qs[i].o.map((t,j)=>j))}));
  }
  const n=r.attempts.length+1;let lastSec=null,k=0;
  const body=view.order.map(o=>{const q=c.qs[o.i];let h="";
    if(c.sections&&q.s!==lastSec){lastSec=q.s;h+=`<h3 class="sec">${esc(c.sections[q.s])}</h3>`}
    k++;
    return h+`<fieldset class="q"><legend>${k}. ${esc(q.q)}<span class="pts">${q.p} pt${q.p>1?"s":""}</span></legend>
     ${o.opts.map(j=>`<label class="opt"><input type="radio" name="q${o.i}" value="${j}" required><span>${esc(q.o[j])}</span></label>`).join("")}</fieldset>`}).join("");
  app.innerHTML=`<button class="btn back" id="back">← Back to lesson</button>
  <div class="section-head"><h1>${esc(c.short)} · Test</h1><span class="small muted">Attempt ${n} of ${MAX_ATTEMPTS} · ${c.total} points · Passing score 80%</span></div>
  <form class="panel" id="f">${body}
   <div class="row" style="margin-top:10px"><button class="btn primary" type="submit">Submit answers</button></div></form>`;
  document.getElementById("back").onclick=()=>go({name:"course",cid:c.id});
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);
    let pts=0;c.qs.forEach((q,i)=>{if(Number(fd.get("q"+i))===q.a)pts+=q.p});
    const score=Math.round(pts/c.total*100);r.attempts.push({date:iso(today),score,pts});
    const s=S.staff.find(x=>x.id===who);
    if(pts/c.total>=PASS){r.pending={date:iso(today),score,pts};delete r.question;
      save();go({name:"sign",cid:c.id});return}
    save();
    const left=MAX_ATTEMPTS-r.attempts.length;
